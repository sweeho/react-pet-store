  - record_key: ADMIN-UTIL-0007
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a Debug.print(Throwable t, String msg) method that, when debuggingOn
      is true, outputs the exception message "Received throwable with Message: " followed by the
      exception's getMessage(), then optionally outputs the provided msg parameter if it is not null,
      then prints the full stack trace via t.printStackTrace(). When debuggingOn is false, no output
      is produced.
    confidence: high
    confidence_basis: >
      The method is explicitly defined with all output logic observable in the source code.
      The conditional checks for msg != null and the printStackTrace() call are both explicit.
      This is deterministic exception reporting behavior.
    risk_class: operational
    basis: >
      Debug.java lines 68-75 define the print(Throwable, String) method. Line 70 outputs the
      exception message prefix, lines 71-72 conditionally output the msg parameter, and line 73
      prints the stack trace. All output goes to System.out (not System.err).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 68
        line_end: 75
        excerpt: |
          public static void print(Throwable t, String msg) {
              if (debuggingOn) {
                  System.out.println("Received throwable with Message: "+t.getMessage());
                  if (msg != null)
                      System.out.print(msg);
                  t.printStackTrace();
              }
          }
    stack_metadata:
      method_name: print
      method_arity: 2
      parameter_types: "Throwable, String"
      output_stream: System.out
      includes_stack_trace: "true"

