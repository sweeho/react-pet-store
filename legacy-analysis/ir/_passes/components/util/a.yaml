  - record_key: ADMIN-UTIL-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a Debug.println(String msg) method that, when debuggingOn is true,
      writes ">>" followed by the message and a newline to System.err. When debuggingOn is false,
      the method SHALL produce no output.
    confidence: high
    confidence_basis: >
      The method is explicitly defined with the ">>" prefix concatenation and System.err.println()
      call. The prefix and newline handling are observable in the source code.
    risk_class: operational
    basis: >
      Debug.java lines 54-58 define the println(String) method which prepends ">>" to the message
      before calling System.err.println(). The prefix is hardcoded and unconditional when debug is on.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 54
        line_end: 58
        excerpt: |
          public static void println(String msg) {
              if (debuggingOn) {
                  System.err.println(">>" + msg);
              }
          }
    stack_metadata:
