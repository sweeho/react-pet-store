records:
  - record_key: ADMIN-UTIL-0001
    kind: entity
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a Debug utility class (com.sun.j2ee.blueprints.util.tracer.Debug)
      as a final, non-instantiable utility class with static helper methods for conditional
      debug message output across the application.
    confidence: high
    confidence_basis: >
      The Debug class is explicitly defined as a final public class with only static members.
      The class javadoc states "This class is just a helper class to make it handy to print out
      debug statements". The class is used consistently across multiple components for debug output,
      indicating this is a declared utility service.
    risk_class: operational
    basis: >
      Debug.java defines the Debug class as a final class containing only static methods and a
      static field. The class has no public constructor (implicit private due to final class nature).
      The javadoc describes its purpose as a debug statement helper utility.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 40
        line_end: 52
        excerpt: |
          /**
           * This class is just a helper class to make it handy
           * to print out debug statements
           */
          public final class Debug {

              public static final boolean debuggingOn = false;

              public static void print(String msg) {
                  if (debuggingOn) {
                      System.err.print(msg);
                  }
              }
    stack_metadata:
      class_type: utility
      instantiation: static-only
      access_modifier: public

  - record_key: ADMIN-UTIL-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a static boolean flag debuggingOn initialized to false (disabled).
      This flag controls the global activation/deactivation of all debug output throughout the
      application. When debuggingOn is false, all Debug.print*() calls SHALL produce no output.
    confidence: high
    confidence_basis: >
      The debuggingOn flag is explicitly declared as public static final boolean with value false
      in the source code. The conditional logic in all print methods checks this flag before
      outputting anything. Both code structure and runtime behavior are deterministic.
    risk_class: operational
    basis: >
      Debug.java line 46 declares: "public static final boolean debuggingOn = false;".
      Every print and println method checks this flag before writing to System streams.
      The flag is immutable (final) and application-scoped.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 46
        line_end: 52
        excerpt: |
          public static final boolean debuggingOn = false;

          public static void print(String msg) {
              if (debuggingOn) {
                  System.err.print(msg);
              }
          }
    stack_metadata:
      flag_name: debuggingOn
      flag_type: boolean
      flag_value: "false"
      flag_modifiers: "static final public"

