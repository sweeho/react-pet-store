  - record_key: ADDR-ENTITY-0001
    kind: entity
    capability_key: user-accounts
    requirement: >
      The system SHALL persist Address entities as persistent business objects containing
      street address, city, state, postal code, and country information.
    confidence: high
    confidence_basis: >
      Address is implemented as a CMP 2.x EntityBean with persistent fields declared in
      both the AbstractSchemaName and the ejb-jar.xml CMP field declarations. Both the
      ejb-jar.xml and the Address.java class show identical field definitions, providing
      cross-validation of the persistent data model.
    risk_class: operational
    basis: >
      Container-Managed Persistence (CMP) entity bean declaration in ejb-jar.xml (lines
      46-85), abstract methods in AddressEJB.java (lines 53-69), and value object
      constructor in Address.java (lines 73-82).
    traces:
