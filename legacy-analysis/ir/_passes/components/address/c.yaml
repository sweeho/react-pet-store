      ejb.security_model: Container-Managed

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
    description: >
      The Country field has conflicting treatment across the XML serialization layer. The
      DTD schema (Address.dtd line 38) declares Country as optional (Country?), but the
      toDOM() serialization method (line 153) appends it unconditionally without null or
      empty-string checking, unlike streetName2 (line 147). The fromDOM() deserialization
      method (line 175) treats Country as required (false parameter). This means: (1)
      serialization always includes Country even when null, (2) deserialization requires
      Country to be present. This creates an asymmetry between declared schema optionality
      and actual implementation requirements.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
    description: >
      The primary key class is declared as java.lang.Object (line 53), which is unusual
      for CMP entity beans. EJB 2.0 typically specifies a concrete primary key class (e.g.,
      Integer, Long, or a custom compound key class). Using Object suggests the actual
      primary key type and generation strategy are deployment-time decisions or
      application-server-specific. This cannot be determined from the component-level source
      files alone and introduces uncertainty about primary key handling across deployment
      environments.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
    description: >
      The no-argument ejbCreate() method (lines 99-101) creates an Address entity with all
      fields left uninitialized. No usage examples or calling patterns are visible in the
      component source files, and no documentation explains the intended use case. This
      method exists as a creation option in the API (declared in AddressLocalHome.java
      line 50 and ejb-jar.xml lines 125-126) but its purpose and contract are undocumented.
