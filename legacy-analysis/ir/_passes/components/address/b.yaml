    confidence: high
    confidence_basis: >
      The create method signature is declared in the EJB home interface
      (AddressLocalHome.java lines 45-46) with explicit parameters for all fields.
      The implementation (AddressEJB.java lines 73-82) accepts these parameters and
      populates the entity. This is reinforced by the ejb-jar.xml configuration
      (lines 144-154) that declares this create method signature in the deployment
      descriptor, indicating it is a formal deployment unit contract.
    risk_class: operational
    basis: >
      AddressLocalHome.java lines 45-46 define the create method with six String
      parameters. AddressEJB.java lines 73-82 implement the ejbCreate method that
      accepts and applies these parameters. ejb-jar.xml lines 144-154 declare this
      create method signature in the assembly descriptor, confirming it as part of
      the EJB contract.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocalHome.java
        line_start: 45
        line_end: 46
        excerpt: |
          public AddressLocal create(String streetName1, String streetName2, String city,
                                     String state, String zipCode, String country) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 82
        excerpt: |
          public Object ejbCreate(String streetName1, String streetName2, String city,
                                  String state, String zipCode, String country) throws CreateException {
                                    setStreetName1(streetName1);
                                    setStreetName2(streetName2);
                                    setCity(city);
                                    setState(state);
                                    setZipCode(zipCode);
                                    setCountry(country);
                                    return null;
