records:
  - record_key: user-accounts-entity-0001
    kind: entity
    capability_key: user-accounts
    requirement: >
      The system SHALL maintain an Address entity with the following fields:
      streetName1 (required), streetName2 (optional), city (required), state (required),
      zipCode (required), and country (optional).
    confidence: high
    confidence_basis: >
      The address structure is declared in the DTD schema (Address.dtd line 38) which
      specifies required vs optional fields using DTD syntax (no ? means required, ? means
      optional). This is further reinforced by the EJB entity bean definition
      (ejb-jar.xml lines 57-80) which declares all six as CMP fields, and the Address.java
      value object (lines 62-67) which mirrors the same field structure. Two independent
      sources (declarative schema and code) confirm the same field set.
    risk_class: operational
    basis: >
      Address.dtd lines 38-43 define the XML element structure with required/optional
      markers. AddressEJB.java lines 53-69 declare abstract getter/setter methods for all
      six fields. Address.java lines 62-67 declare corresponding private fields. The DTD
      element definition uses ? suffix to mark optional fields (streetName2, Country),
      indicating all others are required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);
          public abstract String getStreetName2();
          public abstract void setStreetName2(String streetName2);
          public abstract String getCity();
          public abstract void setCity(String city);
          public abstract String getState();
          public abstract void setState(String state);
          public abstract String getZipCode();
          public abstract void setZipCode(String zipCode);
          public abstract String getCountry();
          public abstract void setCountry(String country);

