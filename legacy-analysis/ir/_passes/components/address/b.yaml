  - record_key: user-accounts-requirement-0007
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL serialize an Address entity to XML format containing elements
      for StreetName (one or two), City, State, ZipCode, and optionally Country.
    confidence: high
    confidence_basis: >
      The Address.java toDOM method (lines 144-155) implements XML serialization
      following the DTD schema exactly. The code explicitly checks for streetName2
      presence before including it (line 147), and includes country unconditionally
      but with no null check. The DTD schema (Address.dtd lines 38-43) defines the
      expected XML structure. Both declarative (DTD) and programmatic (toDOM method)
      sources agree on the structure.
    risk_class: operational
    basis: >
      Address.java lines 144-155 implement XML serialization with explicit element
      creation for each field. Line 147 shows conditional inclusion of optional
      streetName2. Address.dtd lines 38-43 define the XML element schema with required
      and optional markers.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }

  - record_key: user-accounts-requirement-0008
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL deserialize an Address entity from XML format, parsing StreetName
      (one required, one optional), City, State, ZipCode, and Country elements.
    confidence: high
    confidence_basis: >
      Address.java lines 157-180 implement XML deserialization following the DTD schema.
      The code correctly handles the optional second StreetName element (lines 164-168)
      by checking for its presence before reading. The required fields are read without
      optional checks. The fromDOM method signature and implementation indicate a
      well-defined parsing contract based on the DTD schema (Address.dtd lines 38-43).
    risk_class: operational
    basis: >
      Address.java lines 157-180 parse XML elements in the order specified by the DTD.
      Lines 162-168 show optional handling for streetName2 using getNextSibling with
      true flag indicating optional. Other fields use false flag for required parsing.
      The parsing order and field names match the DTD schema exactly.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
        excerpt: |
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }

