  - record_key: CAT-BRSN-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support result set pagination using absolute positioning with
      ResultSet.absolute(int), reading forward sequentially from a calculated starting
      position. Pagination state is stateless; each query must independently position
      the cursor at the requested start index before iterating.
    confidence: high
    confidence_basis: >
      All DAO query methods use the same pagination pattern: check(start >= 0 && resultSet.absolute(start + 1)),
      then iterate with resultSet.next(). This pattern is consistently applied and is
      deterministic.
    risk_class: operational
    basis: >
      getCategories (line 194), getProducts (line 248), getItems (line 314), and
      searchItems (line 371) all use the pattern: if (start >= 0 && resultSet.absolute(start + 1)).
      The absolute() call positions the cursor at row start+1 (1-indexed), and the
      loop collects count items, decrementing count and checking resultSet.next() in
      the loop condition.
    traces:
