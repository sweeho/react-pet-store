  - record_key: CAT-REQ-0008
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support full-text search of Items by query string, tokenizing
      the query by whitespace and returning a paginated list of Items that match any
      keyword in their description, name, or attributes. Empty search queries SHALL
      return an empty result page.
    confidence: high
    confidence_basis: >
      searchItems is implemented in both EJB and DAO layers with explicit tokenization
      logic and empty-query handling.
    risk_class: operational
    basis: >
      CatalogEJB.searchItems(String searchQuery, int start, int count, Locale l)
      delegates to DAO. GenericCatalogDAO.searchItems() tokenizes the search query by
      whitespace using StringTokenizer, collects unique keywords in a HashSet, returns
      empty page if keyword set is empty, and otherwise builds prepared statement
      parameters with wildcards for each keyword and field.
