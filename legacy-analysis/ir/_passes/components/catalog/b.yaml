  - record_key: CAT-REQ-0010
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support two access patterns to the Catalog service: (1) EJB
      invocation via CatalogEJB stateless session bean (accessed through
      CatalogLocalHome.create()), or (2) Fast-lane reader direct JDBC access via
      CatalogDAO (accessed via CatalogDAOFactory.getDAO()). The CatalogHelper client
      abstraction SHALL support switching between patterns via a useFastLane constructor
      parameter (default true).
    confidence: medium
    confidence_basis: >
      CatalogHelper implements both patterns with separate methods for EJB vs DAO access.
      The default constructor sets useFastLane = true, and the parameterized constructor
      accepts the flag. However, no explicit interface enforces this dual-access pattern,
      and reachability of the EJB path (when useFastLane = false) is unclear without
      test or configuration data.
    risk_class: operational
    basis: >
      CatalogHelper has two constructors: CatalogHelper() sets useFastLane = true,
      and CatalogHelper(boolean useFastLane) accepts the flag. Each query method
      (getCategories, getProducts, getItems, getItem, searchItems) contains a ternary
      that selects between useFastLane ? DAOMethod : EJBMethod. The EJB path calls
      getCatalogEJB() which looks up CatalogLocalHome from JNDI and calls create().
      The DAO path calls CatalogDAOFactory.getDAO().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 72
        line_end: 91
        excerpt: |
          public class CatalogHelper implements java.io.Serializable {
              private CatalogDAO dao;
              private boolean useFastLane = false;
              // ...
              public CatalogHelper(boolean useFastLane) {
                  this.useFastLane = useFastLane;
              }

              public CatalogHelper() {
                  useFastLane = true;
              }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 189
        line_end: 224
        excerpt: |
          public Page getCategories(int start, int count, String localeString)
              throws CatalogException {
              Locale locale = getLocaleFromString(localeString);
              return useFastLane
                  ? getCategoriesFromDAO(start, count, locale)
                  : getCategoriesFromEJB(start, count, locale);
          }

          private Page getCategoriesFromEJB(int start, int count, Locale locale)
              throws CatalogException {
              return getCatalogEJB().getCategories(start, count, locale);
          }
    stack_metadata:
