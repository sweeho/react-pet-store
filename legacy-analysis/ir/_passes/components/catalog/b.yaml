  - record_key: CAT-REQ-0012
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support multiple database implementations (e.g., Cloudscape,
      Oracle, generic JDBC) by abstracting database access through a CatalogDAO interface
      and CatalogDAOFactory factory. The factory SHALL instantiate the appropriate DAO
      implementation (CloudscapeCatalogDAO or GenericCatalogDAO) based on environment
      configuration, and the DAO SHALL load SQL statements from an external XML
      configuration resource via JNDI lookup.
    confidence: medium
    confidence_basis: >
      The factory pattern and multiple DAO implementations exist. The GenericCatalogDAO
      loads SQL from XML via JNDI. However, the factory implementation and configuration
      mechanism are not fully visible in the reviewed code, so completeness of this
      requirement cannot be fully confirmed.
    risk_class: operational
    basis: >
      CatalogDAOFactory.getDAO() instantiates the appropriate DAO implementation based
      on configuration. GenericCatalogDAO constructor attempts JNDI lookup of
      JNDINames.CATALOG_DAO_SQL_URL and JNDINames.CATALOG_DAO_DATABASE, then uses
      SAXParserFactory to parse SQL statements from the URL using loadSQLStatements().
      Two DAO implementations exist: CloudscapeCatalogDAO and GenericCatalogDAO.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CatalogDAOFactory.java
        line_start: 1
        line_end: 1
