findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
    description: >
      The CatalogHelper demonstrates a Fast Lane Reader pattern with both EJB and DAO
      access paths, but the conditions under which each path is used in production are
      unclear. No configuration, test, or documentation specifies whether EJB access
      (useFastLane = false) is actually deployed or tested. The default constructor
      sets useFastLane = true, suggesting DAO is the primary path, but the EJB path
      remains as an alternative that may be dead code or a legacy fallback.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      The GenericCatalogDAO relies on external XML SQL configuration files loaded via
      JNDI. The actual SQL statements (GET_CATEGORY, GET_CATEGORIES, GET_PRODUCT, etc.)
      are not visible in the reviewed code, making it impossible to verify specific
      database behavior (join strategies, filtering logic, sort order, or performance
      characteristics). The GenericCatalogDAO assumes SQL will be provided by
      configuration; if that configuration is missing or incorrect, queries will fail
      silently with null returns.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      The buildSQLStatement() method implements dynamic SQL assembly from fragments
      with parameter substitution. The logic is complex and difficult to verify without
      understanding the Statement and Fragment inner classes and the XML configuration
      format. The method reconstructs SQL strings from fragments, but the fragment
      structure and the variableOccurrence / parameterNumber semantics are not
      documented in the reviewed code, making the correctness of this assembly logic
      difficult to assess.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
    description: >
      The Page class was refactored from a prior version (indicated by XXX comments and
      dead code blocks, lines 47-71) that tracked containingListSize separately from
      hasNext. The current implementation uses only hasNext, which simplifies the contract
      but may lose information if future code attempts to compute the total size of the
      result set. Pass A and Pass B may differ on whether this was an intentional
      requirement simplification or a bug fix.
