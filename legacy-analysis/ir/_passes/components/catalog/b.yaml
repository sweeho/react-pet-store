  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL model catalog data as a four-level hierarchy:
      Category (e.g. birds, cats, dogs) containing Products (e.g. Amazon Parrot,
      Finch) containing Items (e.g. specific individual items with unique identifiers
      and pricing) each with specific Attributes (5 text fields: attribute1 through
      attribute5).
    confidence: high
    confidence_basis: >
      Category, Product, and Item classes are explicitly defined in the model tier with
      documented class comments referencing the five-level hierarchy. Both pass A and B
      can verify the inheritance structure and field definitions.
    risk_class: operational
    basis: >
      The entity hierarchy is enforced through model classes (Category.java, Product.java,
      Item.java) and DAO access patterns (getCategories, getProducts, getItems). The
      Item class explicitly defines attributes1-5 as String fields and demonstrates
      the complete data structure needed for catalog presentation.
