  - record_key: CAT-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support pagination of catalog results (categories, products,
      and items) by returning a Page object containing (1) a List of results, (2) a
      starting position index, (3) a boolean indicating whether a next page is available,
      and (4) computed methods to determine if a previous page is available and to
      calculate the start position of the next/previous page.
    confidence: high
    confidence_basis: >
      The Page class is explicitly designed for pagination with documented methods
      for pagination state. All DAO methods that return collections (getCategories,
      getProducts, getItems, searchItems) uniformly return Page objects. Both passes
      can verify the implementation.
    risk_class: operational
    basis: >
      Page.java implements a standard pagination contract with isNextPageAvailable(),
      isPreviousPageAvailable(), getStartOfNextPage(), and getStartOfPreviousPage().
      All CatalogDAO list methods (getCategories, getProducts, getItems, searchItems)
      accept start and count parameters and return Page objects constructed with the
      count of returned items and a hasNext boolean flag. The Page class method
      getStartOfNextPage() computes start + objects.size(), and
      getStartOfPreviousPage() computes Math.max(start - objects.size(), 0).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              List objects;
              int start;
              boolean hasNext;

              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }

              public List getList() { return objects; }

              public boolean isNextPageAvailable() {
                return hasNext;
              }

              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }

              public int getStartOfNextPage() { return start + objects.size(); }

              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }

              public int getSize() { return objects.size(); }
          }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              // ...
              if (start >= 0 && resultSet.absolute(start + 1)) {
                  boolean hasNext = false;
                  List categories = new ArrayList();
                  do {
                      categories.add(new Category(...));
                  } while ((hasNext = resultSet.next()) && (--count > 0));
                  return new Page(categories, start, hasNext);
              }
              return Page.EMPTY_PAGE;
          }
