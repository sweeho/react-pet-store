  - record_key: CATBROW-BIZ-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      All retrievals from the database SHALL use PreparedStatement with externalized SQL,
      where SQL statements are loaded from JNDI-accessed XML configuration at bean
      initialization time, and queries are built via buildSQLStatement() method that
      applies locale and ID parameters to template statements.
    confidence: high
    confidence_basis: >
      ejb-jar.xml defines resource-ref for url/CatalogDAOSQLURL (lines 74-78) indicating
      SQL statements are JNDI-managed. GenericCatalogDAO constructor (lines 89-108) loads
      SQL from JNDI URL via SAXParser, storing statements in sqlStatements map.
      Every query uses buildSQLStatement() to construct parameterized statements (lines 169,
      192, 222, 246, 276, 312, 369). This pattern is enforced consistently with no exceptions.
    risk_class: operational
    basis: >
      EJB configuration declares JNDI resource for SQL URL. DAO constructor loads XML
      configuration from that JNDI URL. All data access goes through buildSQLStatement()
      which applies parameters to externalized statements. This prevents SQL injection and
      enables multi-database support via configuration.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
        line_start: 74
        line_end: 78
        excerpt: |
          <resource-ref>
            <res-ref-name>url/CatalogDAOSQLURL</res-ref-name>
            <res-type>java.net.URL</res-type>
            <res-auth>Container</res-auth>
          </resource-ref>
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 89
        line_end: 108
        excerpt: |
          public GenericCatalogDAO() throws CatalogDAOSysException {
            try {
              InitialContext context = new InitialContext();
              URL daoSQLURL = (URL) context.lookup(JNDINames.CATALOG_DAO_SQL_URL);
              String database = (String) context.lookup(JNDINames.CATALOG_DAO_DATABASE);
              SAXParserFactory parserFactory = SAXParserFactory.newInstance();
              parserFactory.setValidating(true);
              parserFactory.setNamespaceAware(true);
              XMLReader reader = parserFactory.newSAXParser().getXMLReader();
              loadSQLStatements(parserFactory.newSAXParser(), database,
                                new InputSource(daoSQLURL.openStream()));
    stack_metadata:
      ejb.bean: CatalogEJB
      db.object: GenericCatalogDAO

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      The search query tokenization in searchItems (line 346) uses StringTokenizer with
      default whitespace delimiter and produces a HashSet of keywords. The resulting order
      of keywords in the SQL query is non-deterministic because HashSet does not preserve
      insertion order (line 353). This means the same search query may return results in
      different orders across different JVM invocations or Hotspot compilations. No collation
      order is documented, making it unclear whether this is intentional for ranking or a
      latent bug that results may vary. A human needs to verify whether deterministic ordering
      is required.

