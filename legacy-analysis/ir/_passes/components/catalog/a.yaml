      (lines 194, 248, 314): checks `if (start >= 0 && resultSet.absolute(start + 1))`.
      The pattern is repeated three times without documented requirement, suggesting it
      is a safety guard rather than a documented business rule. No comment explains why
      negative indices are invalid; this is inferred from defensive code placement.
    risk_class: operational
    basis: >
      All three pagination methods (getCategories, getProducts, getItems) check start >= 0
      before attempting to position result set. Empty page returns without executing query
      when start < 0, indicating this is a guard condition.
