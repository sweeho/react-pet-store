  - record_key: CATBROW-REQ-0007
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support full-text search over items given a search query string
      and return a paginated Page object containing matching items, localized for the
      specified Locale. Search SHALL tokenize the query string on whitespace and perform
      wildcard matching with % delimiters on each keyword across item attributes.
    confidence: high
    confidence_basis: >
      EJB configuration (ejb-jar.xml lines 103-116) defines searchItems transaction requirement.
      CatalogEJB.java (lines 141-149) delegates to DAO method. GenericCatalogDAO.java (lines
      343-398) shows complete search implementation: StringTokenizer parsing query, HashSet
      deduplication, generation of % wildcards, SQL parameter construction, and pagination.
      All three layers enforce this requirement consistently. No alternative search implementation
      exists in the codebase.
    risk_class: operational
    basis: >
      Search logic implemented entirely in GenericCatalogDAO.searchItems(): uses StringTokenizer
      to split query by whitespace (line 346), creates unique keyword set (line 345), wraps each
      keyword with % for SQL LIKE patterns (lines 361-365), executes parameterized query, paginates
      results. Empty query returns EMPTY_PAGE (line 351). Pagination logic identical to other methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
        line_start: 103
        line_end: 116
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CatalogEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>searchItems</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>int</method-param>
                <method-param>int</method-param>
                <method-param>java.util.Locale</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 398
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
            throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                connection = getDataSource().getConnection();
                String[] parameterValues = new String[1 + (keywords.length * 3)];
                parameterValues[0] = locale.toString();
                for (int i = 0; i < keywords.length; i++) {
                  parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                  parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                  parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
                }
                statement = buildSQLStatement(connection, sqlStatements, XML_SEARCH_ITEMS, parameterValues);
                resultSet = statement.executeQuery();
                if (start >= 0 && resultSet.absolute(start + 1)) {
                  boolean hasNext = false;
                  List items = new ArrayList();
                  do {
                    int i = 1;
                    items.add(new Item(resultSet.getString(i++).trim(),
                                       resultSet.getString(i++).trim(),
                                       resultSet.getString(i++),
                                       resultSet.getString(i++).trim(),
                                       resultSet.getString(i++).trim(),
                                       resultSet.getString(i++),
                                       resultSet.getString(i++),
                                       resultSet.getString(i++),
                                       resultSet.getString(i++),
                                       resultSet.getString(i++),
                                       resultSet.getString(i++),
                                       resultSet.getDouble(i++),
                                       resultSet.getDouble(i++)));
                  } while ((hasNext = resultSet.next()) && (--count > 0));
                  return new Page(items, start, hasNext);
                }
                return Page.EMPTY_PAGE;
              } catch (SQLException exception) {
                throw new CatalogDAOSysException("SQLException: " + exception.getMessage());
              } finally {
                closeAll(connection, statement, resultSet);
              }
          }
