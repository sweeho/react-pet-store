    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      When paginating results, the pagination algorithm SHALL position the result
      set cursor using resultSet.absolute(start + 1), iterate with a do-while loop
      counting down from count, and determine whether a next page is available by
      checking whether resultSet.next() returns true after processing count items.
