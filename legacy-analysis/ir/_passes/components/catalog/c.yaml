      The pagination algorithm is implemented identically in four separate methods
      (getCategories, getProducts, getItems, searchItems). The consistency across
      multiple implementations suggests this is a deliberate design pattern.
      However, this is implementation-level logic not declared in configuration,
      and a single source layer. It is a consistent pattern within the visible code
      but not reinforced at a declarative or schema layer.
    risk_class: operational
    basis: >
      GenericCatalogDAO.java implements the pagination algorithm in getCategories
      (lines 182-210), getProducts (lines 236-264), getItems (lines 302-341),
      and searchItems (lines 343-398). All four use:
      1. resultSet.absolute(start + 1) to position cursor
      2. do { ... } while ((hasNext = resultSet.next()) && (--count > 0))
      3. return new Page(items, start, hasNext)
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          if (start >= 0 && resultSet.absolute(start + 1)) {
            boolean hasNext = false;
            List categories = new ArrayList();
            do {
              categories.add(new Category(resultSet.getString(1).trim(),
                                          resultSet.getString(2),
                                          resultSet.getString(3)));
            } while ((hasNext = resultSet.next()) && (--count > 0));
            return new Page(categories, start, hasNext);
          }
