  - record_key: CAT-C-REQ-0007
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL search for inventory items by a free-form query string,
      tokenize the query into individual keywords, and return a paginated Page
      object of items matching any keyword, with results localized for the
      specified Locale. The system MAY return empty results if the query is empty.
    confidence: medium
    confidence_basis: >
      Search implementation is visible in GenericCatalogDAO.java searchItems() method.
      The tokenization logic using StringTokenizer is clear. The parameter construction
      with wildcards for LIKE matching shows the search uses three fields per keyword.
      However, the actual SQL statement comes from external XML configuration (via
      buildSQLStatement), so without seeing that XML, the exact database search columns
      and logic cannot be fully verified. The code shows intent but external config
      is hidden. Single source layer (DAO only, no declarative enforcement) also
      reduces confidence.
    risk_class: operational
    basis: >
      GenericCatalogDAO.java (lines 343-398) implements searchItems: tokenizes input
      using StringTokenizer (whitespace delimiter), builds parameter array with locale
      and keyword wildcard patterns (3 occurrences per keyword via (i*3)+1,+2,+3 indexing).
      Uses buildSQLStatement() with XML_SEARCH_ITEMS selector, executes query, and
      paginates results using same absolute/count logic as other methods. Returns
      EMPTY_PAGE if input tokenizes to no keywords.
    traces:
