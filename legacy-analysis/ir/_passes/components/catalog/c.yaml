          public Page searchItems(String searchQuery, int start,
                                  int count, Locale l) {
              try {
                  return dao.searchItems(searchQuery, start, count, l);
              }
              catch (CatalogDAOSysException se) {
                  throw new EJBException(se.getMessage());
              }
          }
