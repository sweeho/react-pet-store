  - record_key: CAT-C-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL retrieve a paginated list of product categories, starting at
      a specified index, with a specified maximum count, and return a Page object
      containing the requested categories with metadata indicating whether additional
      pages are available. Categories SHALL be localized for the specified Locale.
    confidence: high
    confidence_basis: >
      Pagination is implemented consistently across layers. ejb-jar.xml defines
      transaction attribute Required. CatalogEJB.java delegates to DAO. GenericCatalogDAO
      implements pagination using resultSet.absolute(start+1) to position, a do-while loop
      with (--count > 0) to limit results, and (hasNext = resultSet.next()) to detect
      existence of next page. Page.java model encapsulates pagination with isNextPageAvailable()
      returning the hasNext flag. The pattern is consistent and enforced in multiple places.
    risk_class: operational
    basis: >
      Pagination logic in GenericCatalogDAO.getCategories(): checks start >= 0, calls
      resultSet.absolute(start+1) to position cursor at start index plus 1, loops
      collecting categories while count > 0, sets hasNext = resultSet.next() to detect
      whether a next record exists. Page model stores hasNext flag and provides
      isNextPageAvailable() method for client navigation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
        line_start: 169
        line_end: 181
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CatalogEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCategories</method-name>
              <method-params>
                <method-param>int</method-param>
                <method-param>int</method-param>
                <method-param>java.util.Locale</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;
              } catch (SQLException exception) {
                  throw new CatalogDAOSysException("SQLException: " + exception.getMessage());
              } finally {
                  closeAll(connection, statement, resultSet);
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              List objects;
              int start;
              boolean hasNext;

              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }

              public List getList() { return objects; }
              public boolean isNextPageAvailable() { return hasNext; }
              public boolean isPreviousPageAvailable() { return start > 0; }
              public int getStartOfNextPage() { return start + objects.size(); }
              public int getStartOfPreviousPage() { return Math.max(start-objects.size(), 0); }
              public int getSize() { return objects.size(); }
          }
