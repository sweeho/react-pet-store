    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL allow retrieval of a single product category by its ID and
      return a Category entity containing the category ID, localized name, and
      localized description for the specified Locale.
    confidence: high
    confidence_basis: >
      This requirement is enforced at three independent layers: (1) ejb-jar.xml
      declares a container-managed transaction with Required attribute for getCategory
      method with String and Locale parameters; (2) CatalogEJB.java implements
      getCategory() which delegates to the DAO layer; (3) GenericCatalogDAO.java
      implements locale-aware SQL retrieval constructing Category objects from
      result set columns. The Category model class defines the exact structure
      (id, name, description). Multiple layers with consistent behavior = high confidence.
    risk_class: operational
    basis: >
      ejb-jar.xml (lines 85-102) declares getCategory method with transaction
      semantics. CatalogEJB.java (lines 85-92) shows ejb-jar delegation pattern.
      GenericCatalogDAO.java (lines 159-180) implements using parameterized SQL
      with locale.toString() and categoryID as parameters, executing a prepared
      statement and constructing Category(categoryID, name, description).
