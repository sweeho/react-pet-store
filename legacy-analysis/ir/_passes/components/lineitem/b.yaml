  - record_key: LINEITEM-REQ-0006
    kind: requirement
    capability_key: order-placement
    requirement: >
      All LineItem entity methods accessed through the LineItemLocal interface SHALL
      execute within a transaction context with Required transaction semantics.
      Methods SHALL either join an existing transaction or cause the container to
      initiate a new one.
    confidence: high
    confidence_basis: >
      ejb-jar.xml container-transaction elements (lines 93-204) declare Required
      trans-attribute for every method: getCategoryId, getProductId, getItemId,
      getLineNumber, getQuantity, getUnitPrice, getQuantityShipped, setQuantityShipped,
      both create methods, and getData. This is a comprehensive, declarative enforcement.
      No method has any other transaction attribute.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor defines container-transaction blocks for all
      LocalHome and Local methods with trans-attribute Required. This is the sole
      transaction policy applied.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 93
        line_end: 204
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                <ejb-name>LineItemEJB</ejb-name>
                <method-name>*</method-name>
              </method>
            </method-permission>
            <container-transaction>
             <method>
               <ejb-name>LineItemEJB</ejb-name>
               <method-intf>Local</method-intf>
               <method-name>getCategoryId</method-name>
               <method-params />
             </method>
             <trans-attribute>Required</trans-attribute>
            </container-transaction>
    stack_metadata:
      ejb.transaction: Required
      applied_to: all_methods

  - record_key: LINEITEM-REQ-0007
    kind: requirement
    capability_key: order-placement
    requirement: >
      LineItem access control SHALL be unchecked; no role-based authorization
      restrictions SHALL be enforced. All callers SHALL be able to invoke any method
      on LineItemLocal. Security context SHALL be propagated using caller identity.
    confidence: high
    confidence_basis: >
      ejb-jar.xml method-permission (lines 86-92) specifies <unchecked /> for all
      methods (method-name *). Security-identity (lines 79-82) specifies <use-caller-identity />.
      This is declarative, comprehensive, and unambiguous.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor declares method-permission unchecked for all
      LineItemEJB methods and security-identity use-caller-identity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 79
        line_end: 92
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>LineItemEJB</ejb-name>
              <method-name>*</method-name>
            </method>
          </method-permission>
    stack_metadata:
      ejb.bean: LineItemEJB
      security_model: unchecked_caller_identity

  - record_key: LINEITEM-REQ-0008
