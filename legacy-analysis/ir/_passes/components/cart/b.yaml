  - record_key: CART-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL represent a shopping cart item with the following attributes:
      itemId (String), productId (String), category (String), name (String),
      attribute (String), quantity (int), and unitCost (double).
    confidence: high
    confidence_basis: >
      CartItem class is explicitly defined and instantiated from catalog data.
      Both pass A and pass B would independently observe the same class definition
      with concrete field declarations.
    risk_class: operational
    basis: >
      CartItem.java lines 46-66 define the entity with six getter methods
      returning each field (getCategory, getItemId, getProductId, getName,
      getAttribute, getQuantity, getUnitCost).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 98
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;

              public CartItem(String itemId, String productId, String category, String name,
                              String attribute, int quantity, double unitCost) { ... }
              public String getItemId() { return itemId; }
              public String getProductId() { return productId; }
              public String getCategory() { return category; }
              public String getName() { return name; }
              public String getAttribute() { return attribute; }
              public int getQuantity() { return quantity; }
              public double getUnitCost() { return unitCost; }
          }
    stack_metadata:
