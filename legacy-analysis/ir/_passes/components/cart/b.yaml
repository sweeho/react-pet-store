  - record_key: CART-REQUIREMENT-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow updating the quantity of an item in the shopping cart.
      When the new quantity is less than or equal to 0, the item SHALL be removed
      from the cart.
    confidence: high
    confidence_basis: >
      Logic is explicit in both the interface declaration and implementation.
      The quantity-based removal rule is encoded in the implementation.
      Declarative transaction enforcement ensures consistency.
    risk_class: operational
    basis: >
      ShoppingCartLocal.java line 69 declares updateItemQuantity(String itemID, int newQty).
      ShoppingCartLocalEJB.java lines 123-127 implement the method: it first removes
      the old entry, then only re-adds if newQty > 0. This prevents negative or zero
      quantities from being stored. CartHTMLAction.java lines 99-120 extract quantities
      from request parameters and invoke the update. ejb-jar.xml lines 101-112 assign
      the Required transaction attribute.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 69
        line_end: 69
        excerpt: |
          public void updateItemQuantity(String itemID, int newQty);
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.transaction: Required

  - record_key: CART-REQUIREMENT-0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the shopping cart subtotal by multiplying the
      unit cost by the quantity for each item and summing all line totals.
    confidence: high
    confidence_basis: >
      Calculation is explicit in the implementation. The formula is visible in one
      location. CartItem.java also implements getTotalCost() confirming the per-item
      calculation pattern.
    risk_class: financial
    basis: >
      ShoppingCartLocal.java line 71 declares getSubTotal() returning Double.
      ShoppingCartLocalEJB.java lines 133-144 implement it: it iterates over items,
      calls getItems() to fetch CartItem objects, and accumulates
      (i.getUnitCost() * i.getQuantity()) for each. CartItem.java lines 95-97 also
      define getTotalCost() as quantity * unitCost. ShoppingCartModel.java lines 79-86
      provides a parallel calculation by iterating CartItems and summing getTotalCost().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }
    stack_metadata:
      ejb.transaction: Required
      return_type: Double

  - record_key: CART-REQUIREMENT-0006
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support retrieving all items currently in the shopping cart
      as a collection of CartItem objects, with each CartItem populated from
      corresponding catalog data.
    confidence: high
    confidence_basis: >
      Method is declared, implemented consistently, and invoked from subtotal and
      display operations. CatalogHelper integration is explicit.
    risk_class: operational
    basis: >
      ShoppingCartLocal.java line 65 declares getItems() returning Collection.
      ShoppingCartLocalEJB.java lines 83-109 implement it: for each item ID in the
      internal HashMap, it calls CatalogHelper.getItem(key, locale) to fetch the
      Item from the catalog component, then constructs a CartItem from the Item's
      attributes. The Locale is set via setLocale. cart.jsp lines 59-88 iterate
      over ${cart.items} to display each item.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 65
        line_end: 65
        excerpt: |
          public Collection getItems();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;
          }
    stack_metadata:
      ejb.transaction: Required

