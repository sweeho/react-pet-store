  - record_key: CART-WORKFLOW-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      The system SHALL support the following cart operations via the cart.do
      request handler: purchase (add item), remove (delete item), and update
      (modify quantities). Each operation extracts parameters from the HTTP
      request and creates a corresponding CartEvent.
    confidence: high
    confidence_basis: >
      CartHTMLAction.java explicitly dispatches on the action parameter and
      creates events. The mapping is visible in one location.
    risk_class: operational
    basis: >
      CartHTMLAction.java lines 82-123 implement the perform method which:
      - Lines 91-93: if action="purchase", creates CartEvent(ADD_ITEM, itemId)
      - Lines 95-97: if action="remove", creates CartEvent(DELETE_ITEM, itemId)
      - Lines 99-120: if action="update", extracts all itemQuantity_* parameters
        and creates CartEvent(UPDATE_ITEMS, quantities HashMap)
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 82
        line_end: 123
        excerpt: |
          public Event perform(HttpServletRequest request)
              throws HTMLActionException {
              String actionType= (String)request.getParameter("action");
              HttpSession session = request.getSession();
              CartEvent event = null;
              if (actionType == null) return null;
              if (actionType.equals("purchase")) {
                  String itemId = request.getParameter("itemId");
                  event = new CartEvent(CartEvent.ADD_ITEM, itemId);
              }
              else if (actionType.equals("remove")) {
                  String itemId = request.getParameter("itemId");
                  event = new CartEvent(CartEvent.DELETE_ITEM, itemId);
              }
              else if (actionType.equals("update")) {
                  Map quantities = new HashMap();
                  Map parameters = request.getParameterMap();
                  for (Iterator it = parameters.keySet().iterator();
                       it.hasNext(); ) {
                      String name = (String) it.next();
                      String value = ((String[]) parameters.get(name))[0];
                      final String ITEM_QTY = "itemQuantity_";
                      if (name.startsWith(ITEM_QTY)) {
                          String itemID = name.substring(ITEM_QTY.length());
                          Integer quantity = null;
                          try {
                              quantity = new Integer(value);
                          }
                          catch (NumberFormatException nfe) {
                              quantity = new Integer(0);
                          }
                          quantities.put(itemID, quantity);
                      }
                  }
                  event = CartEvent.createUpdateItemEvent(quantities);
              }
              return event;
          }
    stack_metadata:
      struts.action: CartHTMLAction

  - record_key: CART-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      When a customer updates item quantities in the shopping cart,
      if a quantity is entered as 0 or negative, the item SHALL be
      removed from the cart rather than stored with a non-positive quantity.
    confidence: high
    confidence_basis: >
      The rule is explicitly coded in the updateItemQuantity implementation with
      the condition (newQty > 0) before re-adding the item.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.java lines 123-127 show updateItemQuantity first
      removes the item, then conditionally re-adds it only if newQty > 0,
      with a comment stating "remove item if it is less than or equal to 0".
      CartHTMLAction.java lines 111-116 show that non-numeric quantities are
      caught and converted to 0 via NumberFormatException handling.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      validation: quantity_range

