  - record_key: CART-INTEGRATION-0001
    kind: integration
    capability_key: shopping-cart
    requirement: >
      When retrieving cart items for display, the shopping cart SHALL call the
      Catalog component's CatalogHelper to fetch the current item details (name,
      attribute, list price) for each item ID stored in the cart, using the
      current locale to fetch localized information.
    confidence: high
    confidence_basis: >
      The integration is explicit in the ShoppingCartLocalEJB.getItems() method,
      which instantiates CatalogHelper and calls getItem() for each cart item.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.java lines 83-109 implement getItems():
      - Line 85 creates a CatalogHelper(false) instance
      - Line 94 calls catalog.getItem(key, locale) to fetch the Item
      - Lines 96-102 extract fields from the Item and create a CartItem
      - Line 104 catches CatalogException and logs it
      The Catalog component is referenced via ejb-jar.xml lines 56-62, which
      define an <ejb-local-ref> to CatalogEJB.
    traces:
