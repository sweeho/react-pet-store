records:
  - record_key: shopping-cart-entity-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The shopping cart SHALL be a stateful session component that maintains
      a collection of cart items for a user session, storing item identifiers
      and quantities that persist across multiple interactions within a session.
    confidence: high
    confidence_basis: >
      Both the EJB interface definition (ShoppingCartLocal.java) and implementation
      (ShoppingCartLocalEJB.java) consistently define a stateful session bean.
      The stateful nature is reinforced by the ejb-jar.xml configuration which
      declares session-type as Stateful. Multiple methods (addItem, deleteItem,
      updateItemQuantity) that modify cart state support the session-persistence
      model. High confidence because this is declared at multiple architectural
      layers (interface, implementation, deployment descriptor).
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB is declared as implementing SessionBean, with a HashMap
      to store items. ejb-jar.xml declares <session-type>Stateful</session-type>.
      The session maintains state across user interactions within a single
      user session.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 62
        line_end: 70
        excerpt: |
          public class ShoppingCartLocalEJB implements SessionBean {
              private HashMap cart;
              // default to the US English
              private Locale locale = Locale.US;
              public ShoppingCartLocalEJB() {
                  cart = new HashMap();
              }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
        line_start: 47
        line_end: 54
        excerpt: |
          <session>
            <display-name>ShoppingCartSB</display-name>
            <ejb-name>ShoppingCartEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocalEJB</ejb-class>
            <session-type>Stateful</session-type>
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Container-managed

  - record_key: shopping-cart-item-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      Each cart item SHALL contain the following attributes: itemId (unique
      identifier), productId, category, product name, attribute (variant),
      quantity, and unit cost, from which the total cost per item is derived
      as quantity multiplied by unit cost.
    confidence: high
    confidence_basis: >
      The CartItem class explicitly defines all required fields with getters
      and a getTotalCost() method that calculates quantity * unitCost. This
      structure is consistently referenced in both the JSP display (cart.jsp)
      and the EJB implementation (ShoppingCartLocalEJB.getItems). High confidence
      because the structure is enforced through a dedicated model class.
    risk_class: operational
    basis: >
      CartItem.java defines immutable fields: itemId, productId, category, name,
      attribute, quantity (as int), and unitCost (as double). The getTotalCost()
      method computes quantity * unitCost. This is constructed when the EJB
      converts catalog items to cart items.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 97
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;
              // ... constructor and getters ...
              public double getTotalCost() {
                  return quantity * unitCost;
              }
          }
    stack_metadata:
      model.class: CartItem

  - record_key: shopping-cart-add-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow a user to add a single item to the shopping cart
      by item identifier. When an item is added without an explicit quantity,
      the default quantity SHALL be 1.
    confidence: high
    confidence_basis: >
      Both passes (A and B on the action layer) would agree on this fundamental
      operation. The CartHTMLAction explicitly handles the "purchase" action
      mapping to CartEvent.ADD_ITEM with a single itemId parameter. The JSP
      calls cart.do with action=purchase. The EJB implements addItem(String itemID)
      with a default quantity of 1. Multiple implementation paths (HTML action,
      EJB action, EJB implementation) all confirm this single pattern.
    risk_class: operational
    basis: >
      CartHTMLAction.perform() creates CartEvent(CartEvent.ADD_ITEM, itemId)
      when action="purchase". CartEJBAction.perform() calls
      cart.addItem(ce.getItemId()). ShoppingCartLocalEJB.addItem(String itemID)
      inserts the item with quantity 1.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 91
        line_end: 94
        excerpt: |
          if (actionType.equals("purchase")) {
              String itemId = request.getParameter("itemId");
              event = new CartEvent(CartEvent.ADD_ITEM, itemId);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 68
        line_end: 71
        excerpt: |
          case  CartEvent.ADD_ITEM  : {
              cart.addItem(ce.getItemId());
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }
          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
    stack_metadata:
      ejb.transaction: Required
      framework: CartEvent, CartHTMLAction, CartEJBAction

  - record_key: shopping-cart-remove-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow a user to remove an item from the shopping cart
      by item identifier. The item SHALL be completely deleted from the cart
      and no longer available for checkout.
    confidence: high
    confidence_basis: >
      Multiple implementation layers confirm this requirement. CartHTMLAction
      handles the "remove" action, CartEJBAction calls deleteItem, and
      ShoppingCartLocalEJB.deleteItem removes the item from the internal HashMap.
      The JSP provides a "Remove" link for each item. The implementation is
      consistent across all layers.
    risk_class: operational
    basis: >
      CartHTMLAction.perform() detects action="remove" and creates
      CartEvent(CartEvent.DELETE_ITEM, itemId). CartEJBAction performs
      cart.deleteItem(ce.getItemId()). ShoppingCartLocalEJB.deleteItem(String)
      calls cart.remove(itemID). JSP displays a Remove link per item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 95
        line_end: 98
        excerpt: |
          else if (actionType.equals("remove")) {
              String itemId = request.getParameter("itemId");
              event = new CartEvent(CartEvent.DELETE_ITEM, itemId);
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 121
        excerpt: |
          public void deleteItem (String itemID) {
              cart.remove(itemID);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 70
        line_end: 78
        excerpt: |
          <td class="petstore_listing">
           <c:url value="/cart.do" var="removeURL">
            <c:param name="action" value="remove"/>
            <c:param name="itemId" value="${item.itemId}"/>
           </c:url>
           <a href='<c:out value="${removeURL}"/>'>
           Remove
          </a>
    stack_metadata:
      ejb.transaction: Required
      jsp.page: cart.jsp

  - record_key: shopping-cart-update-qty-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow a user to update the quantity of one or more items
      in the shopping cart. Each item's quantity is specified individually via
      a form parameter named itemQuantity_<itemId>.
    confidence: high
    confidence_basis: >
      CartHTMLAction.perform() explicitly parses all request parameters beginning
      with "itemQuantity_" prefix and builds a map of itemId to quantity. This
      is then passed to CartEJBAction which iterates through the map and calls
      updateItemQuantity for each entry. ShoppingCartLocalEJB implements the
      update method. The JSP also shows the quantity input field for each item.
    risk_class: operational
    basis: >
      CartHTMLAction.perform() iterates through request.getParameterMap(),
      detects names starting with "itemQuantity_", extracts the itemId
      substring, and adds to a quantities map. CartEvent.createUpdateItemEvent
      wraps this. CartEJBAction performs the loop: for each itemId, calls
      cart.updateItemQuantity(itemId, quantity).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 99
        line_end: 121
        excerpt: |
          else if (actionType.equals("update")) {
              Map quantities = new HashMap();
              Map parameters = request.getParameterMap();
              for (Iterator it = parameters.keySet().iterator();
                   it.hasNext(); ) {
                  String name = (String) it.next();
                  String value = ((String[]) parameters.get(name))[0];
                  final String ITEM_QTY = "itemQuantity_";
                  if (name.startsWith(ITEM_QTY)) {
                      String itemID = name.substring(ITEM_QTY.length());
                      Integer quantity = null;
                      try {
                          quantity = new Integer(value);
                      }
                      catch (NumberFormatException nfe) {
                          quantity = new Integer(0);
                      }
                      quantities.put(itemID, quantity);
                  }
              }
              event = CartEvent.createUpdateItemEvent(quantities);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 79
        line_end: 83
        excerpt: |
          <td class="petstore_listing" align="right">
           <waf:input type="text" maxlength="10" size="3">
           <waf:name>itemQuantity_<c:out value="${item.itemId}"/></waf:name>
           <waf:value><c:out value="${item.quantity}" /></waf:value></waf:input>
          </td>
    stack_metadata:
      ejb.transaction: Required
      jsp.page: cart.jsp
      form_parameter: itemQuantity_<itemId>

  - record_key: shopping-cart-update-qty-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      When updating an item quantity, if the new quantity is less than or equal
      to zero, the item SHALL be deleted from the cart. If the quantity is
      greater than zero, the item quantity SHALL be updated to that value.
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.updateItemQuantity() contains explicit logic:
      first removes the item unconditionally, then only re-inserts if newQty > 0.
      CartHTMLAction also has a try-catch that defaults to 0 on NumberFormatException,
      which would trigger this deletion rule. The logic is straightforward and
      appears in a single canonical location (the EJB method).
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.updateItemQuantity(String itemID, int newQty):
      always removes the item, then conditionally re-inserts only if newQty > 0.
      This means zero or negative quantities delete items. CartHTMLAction defaults
      to 0 for non-numeric input, which will also trigger deletion.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.transaction: Required

