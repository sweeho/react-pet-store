  - record_key: shopping-cart-subtotal-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate and provide a cart subtotal equal to the sum
      of all items' total costs (each item's quantity multiplied by its unit cost).
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.getSubTotal() iterates through all cart items,
      multiplies quantity by unitCost for each, and sums the result. This
      calculation is displayed in the JSP using fmt:formatNumber with
      type="currency". The calculation logic is centralized in one location
      and consistently used.
    risk_class: financial
    basis: >
      ShoppingCartLocalEJB.getSubTotal() retrieves items via getItems(),
      then iterates: for each CartItem, adds (i.getUnitCost() * i.getQuantity())
      to the running total. The JSP displays this value formatted as currency.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 96
        line_end: 98
        excerpt: |
          <td bgcolor="#CCCCFF" class="petstore_listing" align="right">
           <fmt:formatNumber value="${cart.subTotal}" type="currency" />
          </td>
    stack_metadata:
      ejb.transaction: Required

