  - record_key: shopping-cart-catalog-integration-0001
    kind: integration
    capability_key: shopping-cart
    requirement: >
      The shopping cart SHALL integrate with the catalog component to enrich
      cart items with product details (product name, category, attribute, unit cost)
      from the catalog at the time of cart item retrieval. The cart stores only
      the item ID and quantity; full item details are fetched from the catalog
      on demand.
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.getItems() explicitly creates a CatalogHelper and
      calls catalog.getItem(key, locale) for each itemId in the cart. The
      retrieved Item is then converted to a CartItem with the full set of
      attributes. This is the sole method of enriching cart data and is
      consistently implemented. High confidence because the integration is
      explicit and the only path to item details.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.getItems() constructs a CatalogHelper, iterates
      through internal cart HashMap keys (itemIds), and for each calls
      catalog.getItem(key, locale). Exceptions are caught and printed but
      the item is skipped on error.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
