findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      CatalogException is caught in getItems() but only printed to System.out, not
      re-thrown or logged. This error handling is incomplete. Calling code has no way
      to know if an item failed to enrich. The behavior when a catalog lookup fails
      (item not in catalog anymore?) is unspecified—the exception is silently swallowed.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      ShoppingCartModel.getTotalCost() and ShoppingCartLocalEJB.getSubTotal()
      calculate cart total identically, but they operate on different sources:
      ShoppingCartModel sums CartItem objects (already enriched with catalog data),
      while ShoppingCartLocalEJB.getSubTotal() recalculates by fetching and enriching
      items on-the-fly. Both return the same type (Double for EJB, double for Model),
      but different paths could diverge if catalog data changes.
