  - record_key: CART-REQ-0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate and display cart subtotal as the sum of
      (unitCost × quantity) for all items in the cart.
    confidence: high
    confidence_basis: >
      Both ShoppingCartModel and ShoppingCartLocalEJB implement getTotalCost()
      with identical summing logic. JSP displays ${cart.subTotal} formatted as currency.
    risk_class: operational
    basis: >
      CartItem.getTotalCost() returns quantity * unitCost. ShoppingCartModel.getTotalCost()
      and ShoppingCartLocalEJB.getSubTotal() both iterate items and sum line totals.
      cart.jsp displays result with fmt:formatNumber type="currency".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 95
        line_end: 97
        excerpt: |
          public double getTotalCost() {
              return quantity * unitCost;
          }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
              return total;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
