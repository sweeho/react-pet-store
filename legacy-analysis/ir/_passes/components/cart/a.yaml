  - record_key: CART-INTEGRATION-0001
    kind: integration
    capability_key: shopping-cart
    requirement: >
      When retrieving cart items, the system SHALL enrich the stored cart data
      (itemId -> quantity) by calling the Catalog component (local EJB reference
      ejb/Catalog) to fetch full item details (productId, category, name, attribute,
      listCost).
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.getItems() explicitly calls CatalogHelper and catches
      CatalogException. EJB deployment descriptor declares ejb-local-ref to Catalog.
      Both sides of integration are visible.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.getItems() instantiates CatalogHelper(false) for local
      access and calls catalog.getItem(itemId, locale) for each cart entry. Returned
      Item is converted to CartItem. CatalogException is caught (printed to stdout
      only, not re-thrown).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              // get a catalog helper using local EJB Access
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      // convert catalog item to cart item
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;
