records:
  - record_key: CART-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A CartItem entity SHALL contain the following fields: itemId (String),
      productId (String), category (String), name (String), attribute (String),
      quantity (int), and unitCost (double).
    confidence: high
    confidence_basis: >
      CartItem class is directly defined with all fields as instance variables
      with getters. Both the component and the petstore app use it consistently.
    risk_class: operational
    basis: >
      CartItem is a value object holding line-item data in the cart model.
      Fields map directly to product catalog attributes (category, name,
      attribute, listCost) and cart-specific data (quantity).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 98
        excerpt: |
          public class CartItem implements Serializable {
              private String itemId;
              private String productId;
              private String category;
              private String name;
              private String attribute;
              private int quantity;
              private double unitCost;
              ...
              public double getTotalCost() {
                  return quantity * unitCost;
              }
          }
    stack_metadata: {}

  - record_key: CART-ENTITY-0002
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A ShoppingCart entity SHALL maintain a collection of items indexed by
      itemId (String key, Integer quantity value in a HashMap).
    confidence: high
    confidence_basis: >
      The ShoppingCartLocalEJB implementation directly uses HashMap<String, Integer>
      to store cart state. Multiple code paths confirm this structure.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB uses HashMap(itemId -> quantity) as the canonical
      representation. Cart items are retrieved by calling getItems() which
      enriches the stored keys with catalog data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
          public class ShoppingCartLocalEJB implements SessionBean {
              private HashMap cart;
              ...
