                  cart = new HashMap();
              }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      session.scope: Stateful

  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support adding an item to the shopping cart. When adding
      an item with a specified quantity, the quantity SHALL be stored. When adding
      an item without a quantity specification, the default quantity SHALL be 1.
    confidence: high
    confidence_basis: >
      Two overloaded addItem methods exist with explicit implementations in both
      the EJB and the HTML action. This is a core capability with two code paths.
    risk_class: operational
    basis: >
      CartHTMLAction maps "purchase" action to CartEvent(ADD_ITEM, itemId).
      ShoppingCartLocalEJB.addItem(String) creates entry with quantity 1,
      and addItem(String, int) uses provided quantity. CartEvent supports both.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 91
        line_end: 94
        excerpt: |
          if (actionType.equals("purchase")) {
              String itemId = request.getParameter("itemId");
              event = new CartEvent(CartEvent.ADD_ITEM, itemId);
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required

