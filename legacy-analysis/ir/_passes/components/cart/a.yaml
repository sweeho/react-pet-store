      removed from the cart.
    confidence: medium
    confidence_basis: >
      CartHTMLAction explicitly catches NumberFormatException and defaults to 0.
      However, this behavior is implicit in exception handling, not explicitly
      documented. No test or requirement documentation found.
    risk_class: operational
    basis: >
      CartHTMLAction.perform() has try-catch block converting "itemQuantity_*"
      parameters. NumberFormatException defaults to new Integer(0), which is
      then passed to updateItemQuantity, triggering removal.
