  - record_key: XMLDOC-UTIL-0004
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for reading text content from XML elements
      with support for multiple data types (string, integer, float) and optional/required
      validation.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java provides getContent and getContentAs* methods (lines 153-178).
      getContent concatenates text and CDATA nodes from an element (lines 153-166). Typed
      variants (getContentAsInt, getContentAsFloat) parse the content with exception handling
      (lines 172-186). The optional parameter controls whether empty content is valid.
    risk_class: operational
    basis: >
      getContent method (lines 153-166) iterates through TEXT_NODE and CDATA_SECTION_NODE
      children. If optional=false and buffer is empty, XMLDocumentException is thrown (lines
      162-164). Typed variants (lines 172-186) wrap parseInt/parseFloat with error handling.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 153
        line_end: 186
        excerpt: |
          public static String getContent(Element element, boolean optional) throws XMLDocumentException {
            StringBuffer buffer = new StringBuffer();
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.TEXT_NODE || child.getNodeType() == Node.CDATA_SECTION_NODE) {
                try {
                  buffer.append(((Text) child).getData());
                } catch (DOMException e) {}
              }
            }
            if (!optional && buffer.length() == 0) {
              throw new XMLDocumentException(element.getTagName() + " element: content expected.");
            }
            return buffer.toString();
          }
          public static String getContentAsString(Element element, boolean optional) throws XMLDocumentException {
            return getContent(element, optional);
          }
          public static int getContentAsInt(Element element, boolean optional) throws XMLDocumentException {
            try {
              return Integer.parseInt(getContent(element, optional));
            } catch (NumberFormatException exception) {
              throw new XMLDocumentException(element.getTagName() + " element: content format error.", exception);
            }
          }
          public static float getContentAsFloat(Element element, boolean optional) throws XMLDocumentException {
            try {
              return Float.parseFloat(getContent(element, optional));
            } catch (NumberFormatException exception) {
              throw new XMLDocumentException(element.getTagName() + " element: content format error.", exception);
            }
          }
    stack_metadata:
      framework: J2EE

  - record_key: XMLDOC-ENTITY-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL resolve XML entity references from a properties catalog, supporting
      both URL-based and resource-based entity sources, with fallback to parent resolver.
    confidence: high
    confidence_basis: >
      CustomEntityResolver.java (lines 47-110) implements EntityResolver and loads entity
      mappings from a properties file (ENTITY_CATALOG constant at line 50). Constructor variants
      accept URL, Properties, or another EntityResolver as parent (lines 55-109). The
      resolveEntityFromURL method (lines 111-150) tries URL resolution first, then resource
      classpath resolution, indicating a fallback chain.
    risk_class: operational
    basis: >
      CustomEntityResolver loads entityCatalog from properties file (line 63-72). Multiple
      constructor variants allow customization (lines 55-109). The resolveEntityFromURL method
      (lines 111-150) demonstrates attempt/fallback pattern: tries URL, then resource path.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 47
        line_end: 110
        excerpt: |
          public class CustomEntityResolver implements EntityResolver {
            public static final boolean TRACE = false;
            public static final String ENTITY_CATALOG
            = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties";
            private Properties entityCatalog = null;
            private EntityResolver parentResolver = null;

            public CustomEntityResolver() {
              this((EntityResolver) null);
              return;
            }
            public CustomEntityResolver(EntityResolver parentResolver) {
              this.parentResolver = parentResolver;
              entityCatalog = new Properties();
              InputStream stream = getClass().getResourceAsStream(ENTITY_CATALOG);
              if (stream != null) {
                try {
                  entityCatalog.load(stream);
                } catch (IOException exception) {
                  System.err.println("Can't load from resource: " + ENTITY_CATALOG + ": " + exception);
                }
              }
              return;
            }
            public CustomEntityResolver(URL entityCatalogURL) {
              this(entityCatalogURL, null);
              return;
            }
            public CustomEntityResolver(URL entityCatalogURL, EntityResolver parentResolver) {
              this(parentResolver);
              if (entityCatalogURL != null) {
                entityCatalog = new Properties(entityCatalog);
                try {
                  entityCatalog.load(entityCatalogURL.openStream());
                } catch (IOException exception) {
                  System.err.println("Can't load from resource: " + entityCatalogURL + ": " + exception);
                }
              }
              return;
            }
    stack_metadata:
      framework: J2EE

