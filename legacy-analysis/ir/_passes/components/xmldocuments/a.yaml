  - record_key: XMLDOC-UTIL-0002
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for serializing XML documents to various result
      targets with configurable DTD public/system IDs and namespace support.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java provides multiple overloaded toXML methods (lines 388-436) that
      serialize documents to Result targets. Methods support entity catalogs for DTD resolution
      and XSD support flags. The serialize method (lines 364-386) configures transformer output
      properties for DOCTYPE declarations.
    risk_class: operational
    basis: >
      toXML methods in XMLDocumentUtils.java (lines 388-436) accept various parameters for
      document type specification. The serialize method (lines 364-386) uses transformer
      output properties (OutputKeys.DOCTYPE_SYSTEM, OutputKeys.DOCTYPE_PUBLIC) to write DTD
      information into the serialized output.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 388
