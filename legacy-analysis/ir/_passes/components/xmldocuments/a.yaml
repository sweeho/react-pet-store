  - record_key: XMLDOC-UTIL-0003
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for DOM tree navigation that enforce schema
      constraints through optional/required element validation, supporting both namespaced
      and non-namespaced XML elements.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java provides methods for traversing DOM trees with boolean optional
      parameters that control validation (getFirstChild lines 87-100, getNextSibling lines
      138-151, getChild lines 102-114). Corresponding namespace-aware variants (getFirstChildNS
      lines 208-221, getNextSiblingNS lines 259-272) provide namespaced versions. All methods
      throw XMLDocumentException when required elements are missing.
    risk_class: operational
    basis: >
      Navigation methods in XMLDocumentUtils.java (getFirstChild, getNextSibling, getChild,
      getSibling at lines 87-151) use the optional boolean parameter to enforce requirements.
      When optional=false and element is not found, XMLDocumentException is thrown (lines 96-98).
      Namespace-aware variants follow the same pattern with NS-aware element matching (lines
      208-272).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 87
        line_end: 151
        excerpt: |
          public static Element getFirstChild(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getTagName().equals(name)) {
                  return (Element) child;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected as first child of " + element.getTagName() + ".");
            }
            return null;
          }
          public static Element getNextSibling(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node sibling = element.getNextSibling(); sibling != null; sibling = sibling.getNextSibling()) {
              if (sibling.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) sibling).getTagName().equals(name)) {
                  return (Element) sibling;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected after " + element.getTagName() + ".");
            }
            return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 208
        line_end: 272
        excerpt: |
          public static Element getFirstChildNS(Element element, String nsURI, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getLocalName().equals(name) && ((Element) child).getNamespaceURI().equals(nsURI)) {
                  return (Element) child;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected as first child of " + element.getTagName() + ".");
            }
            return null;
          }
          public static Element getNextSiblingNS(Element element, String nsURI, String name, boolean optional) throws XMLDocumentException {
            for (Node sibling = element.getNextSibling(); sibling != null; sibling = sibling.getNextSibling()) {
              if (sibling.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) sibling).getLocalName().equals(name) && ((Element) sibling).getNamespaceURI().equals(nsURI)) {
                  return (Element) sibling;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected after " + element.getTagName() + ".");
