  - record_key: XMLDOC-UTIL-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for parsing XML documents from various sources
      (streams, SAX sources, DOM sources) with support for DTD and XSD validation.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.java provides multiple overloaded methods for parsing XML (fromXML methods
      at lines 503-545). The implementation uses DocumentBuilderFactory with configurable validation
      (line 516) and custom entity resolution for DTD/XSD support. Multiple source types are
      supported via polymorphic transform methods (lines 461-501).
    risk_class: operational
    basis: >
      XMLDocumentUtils.java fromXML methods (lines 503-545) provide parsing with configurable
      validation flags. The custom entity resolver is used to resolve DTD entities from a catalog
      (line 536). Support for multiple source types is evident in transform methods that handle
      DOMSource, StreamSource, and SAXSource.
