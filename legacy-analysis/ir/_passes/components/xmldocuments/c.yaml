  - record_key: XMLDOC-SERIAL-UTIL-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL serialize DOM documents to various result targets (streams, SAX,
      DOM results) with configurable DTD public/system ID output and encoding support.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides overloaded toXML methods (lines 388-436) that serialize
      documents using Transformer with OutputKeys for DOCTYPE_SYSTEM and DOCTYPE_PUBLIC
      (lines 371-373). The serialize method (lines 364-386) demonstrates explicit control
      over output properties.
    risk_class: operational
    basis: >
      toXML methods (lines 388-436) use serialize() which configures transformer output
      properties for DTD declarations. Methods accept Result parameters for flexible
      output targets. Entity catalog mapping is supported for DTD URI resolution.
