  - record_key: XMLDOC-DOM-NAVIGATION-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for navigating and querying DOM document
      trees, including element access, sibling traversal, and optional element handling.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides methods for element access (getChild, getFirstChild,
      getNextSibling, getSibling at lines 87-172) with both namespace-aware and
      non-namespace variants. The optional parameter controls exception throwing behavior.
    risk_class: operational
    basis: >
      Methods like getChild (lines 102-114), getFirstChild (lines 87-100), getSibling
      (lines 120-131) implement consistent DOM traversal with optional element handling
      indicated by boolean parameters.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 87
        line_end: 172
        excerpt: |
          public static Element getFirstChild(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getTagName().equals(name)) {
                  return (Element) child;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected as first child of " + element.getTagName() + ".");
            }
            return null;
          }
          public static Element getChild(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getTagName().equals(name)) {
                  return (Element) child;
                }
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected as child of " + element.getTagName() + ".");
            }
            return null;
          }
