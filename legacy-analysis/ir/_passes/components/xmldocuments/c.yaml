  - record_key: XMLDOC-ELEMENT-CREATION-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for creating XML elements and appending
      child elements with text content, supporting both string and numeric value types.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides createElement and appendChild methods (lines 274-362)
      with overloads for String, long, and float values. Methods demonstrate consistent
      handling of element creation and tree building.
    risk_class: operational
    basis: >
      createElement methods (lines 274-340) create elements with text nodes. appendChild
      methods (lines 297-362) add child elements with configurable null handling. Methods
      handle type conversion for numeric values.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 274
        line_end: 362
        excerpt: |
          public static Element createElement(Document document, String name, String value) {
            if (value != null) {
              Element element = (Element) document.createElement(name);
              element.appendChild(document.createTextNode(value));
              return element;
            }
            throw new IllegalArgumentException("XMLDocumentUtils.createElement: value of " + name + " element can't be null.");
          }
          public static Element createElement(Document document, String name, float value) {
            return createElement(document, name, Float.toString(value));
          }
          public static void appendChild(Document document, Node root, String name, String value) {
            Node node = document.createElement(name);
            node.appendChild(document.createTextNode(value != null ? value : ""));
            root.appendChild(node);
          }
    stack_metadata:
      framework: J2EE

  - record_key: XMLDOC-ATTRIBUTE-ACCESS-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods for reading and validating XML element
      attributes and text content with type conversion (String, int, float) and
      optional element handling.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides getAttribute, getAttributeAsInt, getAttributeAsFloat,
      getContent, and getContentAsInt methods (lines 67-206) with exception throwing
      controlled by optional parameters. Methods demonstrate consistent validation pattern.
    risk_class: operational
    basis: >
      getAttribute (lines 67-77) checks for null and throws XMLDocumentException if
      required. Numeric variants (lines 79-206) include NumberFormatException handling
      for type conversion failures.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 67
        line_end: 206
        excerpt: |
          public static String getAttribute(Element element, String name, boolean optional) throws XMLDocumentException {
            String value = element.getAttribute(name);
            if (value == null && !optional) {
              throw new XMLDocumentException("Attribute " + name + " of " + element.getTagName() + " expected.");
            }
            return value;
          }
          public static int getAttributeAsInt(Element element, String name, boolean optional) throws XMLDocumentException {
            try {
              return Integer.parseInt(getAttribute(element, name, optional));
            } catch (NumberFormatException exception) {
              throw new XMLDocumentException(element.getTagName() + "/@" + name + " attribute: value format error.", exception);
            }
          }
          public static int getContentAsInt(Element element, boolean optional) throws XMLDocumentException {
            try {
              return Integer.parseInt(getContent(element, optional));
            } catch (NumberFormatException exception) {
              throw new XMLDocumentException(element.getTagName() + " element: content format error.", exception);
            }
          }
    stack_metadata:
      framework: J2EE

  - record_key: XMLDOC-ORDERAPPROVAL-STRUCT-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL maintain an OrderApproval XML document structure containing
      one or more Order elements, each with OrderId and OrderStatus child elements.
    confidence: high
    confidence_basis: >
      OrderApproval.dtd (lines 38-46) and OrderApproval.java (lines 66-170) both
      define the structure: root OrderApproval element contains Order children, each
      with OrderId and OrderStatus. The Java class implements symmetric serialization
      and deserialization (toDOM/fromDOM).
    risk_class: operational
    basis: >
      DTD declares: <!ELEMENT OrderApproval (Order+)> and <!ELEMENT Order (OrderId,
      OrderStatus)>. Java class OrderApproval contains ArrayList of ChangedOrder objects
      (line 71), where ChangedOrder carries orderId and orderStatus fields (lines 48-49).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 46
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 66
        line_end: 155
        excerpt: |
          public class OrderApproval {
            private ArrayList orderList = new ArrayList();
            public void addOrder(ChangedOrder order) {
              orderList.add(order);
            }
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_ORDERAPPROVAL);
              for (Iterator i = orderList.iterator(); i.hasNext();) {
                ChangedOrder changedOrder = (ChangedOrder) i.next();
                root.appendChild(changedOrder.toDOM(document));
              }
              return root;
            }
            public static OrderApproval fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE &&
                  (element = ((Element) node)).getTagName().equals(XML_ORDERAPPROVAL)) {
                OrderApproval orderApproval = new OrderApproval();
                for (child = XMLDocumentUtils.getFirstChild(element, ChangedOrder.XML_ORDER, false);
                     child != null;
                     child = XMLDocumentUtils.getNextSibling(child, ChangedOrder.XML_ORDER, true)) {
                  orderApproval.orderList.add(ChangedOrder.fromDOM(child));
                }
                return orderApproval;
              }
            }
    stack_metadata:
      dtd_public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN"
      dtd_system_id: "OrderApproval.dtd"

