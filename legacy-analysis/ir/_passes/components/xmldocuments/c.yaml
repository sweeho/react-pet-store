  - record_key: XMLDOC-LOCALE-SUPPORT-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL support parsing of locale strings in language_country_variant
      format and conversion to Java Locale objects, with support for default locale
      fallback and variant omission handling.
    confidence: medium
    confidence_basis: >
      XMLDocumentUtils.getLocaleFromString (lines 644-678) parses underscore-separated
      strings. The method handles three-part (language_country_variant) and two-part
      (language_country) formats, with "default" string mapped to Locale.getDefault().
      However, the variant parsing logic contains a bug (line 666) that makes variant
      support unreliable.
    risk_class: operational
    basis: >
      Method parses "language_country_variant" format using indexOf('_'). Returns
      Locale.getDefault() for "default" string. Constructs Locale objects with variant
      when present. Bug at line 666 overwrites countryIndex, making variant unreachable
      in practice.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 644
        line_end: 678
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
            if (localeString == null) {
              return null;
            }
            if (localeString.toLowerCase().equals("default")) {
              return Locale.getDefault();
            }
            int languageIndex = localeString.indexOf('_');
            if (languageIndex  == -1) {
              return null;
            }
            int countryIndex = localeString.indexOf('_', languageIndex +1);
            String country = null;
            if (countryIndex  == -1) {
              if (localeString.length() > languageIndex) {
                country = localeString.substring(languageIndex +1, localeString.length());
              } else {
                return null;
              }
            }
            int variantIndex = -1;
            if (countryIndex != -1) {
              countryIndex = localeString.indexOf('_', countryIndex +1);
            }
            String language = localeString.substring(0, languageIndex);
            String variant = null;
            if (variantIndex  != -1) {
              variant = localeString.substring(variantIndex +1, localeString.length());
            }
            if (variant != null) {
              return new Locale(language, country, variant);
            } else {
              return new Locale(language, country);
            }
          }
    stack_metadata:
      framework: J2EE

findings:
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      getLocaleFromString method (lines 644-678) contains logic error in variant parsing.
      Line 666 reassigns countryIndex to the result of indexOf, overwriting the valid
      country end index. This means the variant field parsing at line 671 will always
      fail (variantIndex remains -1) because variantIndex is never actually set. The
      method will never construct a Locale with a variant component despite supporting
      the three-part format in documentation. Clarification needed on whether this is
      dead code, a bug, or intentional limitation.
