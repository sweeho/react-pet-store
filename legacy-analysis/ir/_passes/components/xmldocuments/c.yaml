  - record_key: XMLDOC-ENTITY-RESOLVER-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL resolve XML entity URIs using a configurable entity catalog
      (DTD public IDs mapped to system IDs) with fallback to direct URL resolution
      and resource path lookup.
    confidence: high
    confidence_basis: >
      CustomEntityResolver implements EntityResolver (line 47) with explicit catalog
      loading from properties files (lines 62-78, 86-97). The resolveEntity method
      (lines 175-217) shows three-tier resolution: catalog mapping, URL resolution,
      resource path fallback.
    risk_class: operational
    basis: >
      CustomEntityResolver loads EntityCatalog.properties (line 50) and provides
      mapEntityURI (lines 159-173) for public ID to system ID mapping. resolveEntity
      method implements priority-based resolution: parent resolver > catalog mapping >
      direct URL > resource path.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 47
        line_end: 110
        excerpt: |
          public class CustomEntityResolver implements EntityResolver {
            public static final String ENTITY_CATALOG
              = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties";
            private Properties entityCatalog = null;
            public CustomEntityResolver(URL entityCatalogURL, EntityResolver parentResolver) {
              this(parentResolver);
              if (entityCatalogURL != null) {
                entityCatalog = new Properties(entityCatalog);
                entityCatalog.load(entityCatalogURL.openStream());
              }
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 159
        line_end: 217
        excerpt: |
          public String mapEntityURI(String entityURI) {
            if (entityCatalog != null && entityURI != null) {
              String entityURL = entityCatalog.getProperty(entityURI);
              return entityURL;
            }
            return null;
          }
          public InputSource resolveEntity(String entityURI, String entityURL) {
            if (parentResolver != null) {
              source = parentResolver.resolveEntity(entityURI, entityURL);
              if (source != null) return source;
            }
            if (entityURI != null) {
              String mappedEntityURL = mapEntityURI(entityURI);
              if (mappedEntityURL != null) {
                source = resolveEntityFromURL(mappedEntityURL);
                if (source != null) return source;
              }
            }
            if (entityURL != null) {
              source = resolveEntityFromURL(entityURL);
              if (source != null) return source;
            }
            return null;
          }
