  - record_key: XMLDOC-DOM-NAV-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide DOM navigation methods that enforce element presence validation,
      supporting optional/required element semantics for both namespaced and non-namespaced elements.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides paired sets of navigation methods: non-namespaced (getFirstChild,
      getNextSibling, getChild, getSibling at lines 87-151) and namespace-aware (getFirstChildNS,
      getNextSiblingNS, getChildNS, getSiblingNS at lines 208-272). All methods accept boolean
      optional parameter; when false, missing elements throw XMLDocumentException.
    risk_class: operational
    basis: >
      getFirstChild (lines 87-100) iterates children, breaks on first non-matching element node,
      throws XMLDocumentException if optional=false (lines 96-98). getNextSibling (lines
      138-151) follows same pattern. Namespace variants check both localName and namespaceURI
      (lines 211, 226).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 87
        line_end: 151
        excerpt: |
          public static Element getFirstChild(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) child).getTagName().equals(name)) {
                  return (Element) child;
                }
                break;
              }
            }
            if (!optional) {
              throw new XMLDocumentException(name + " element expected as first child of " + element.getTagName() + ".");
            }
            return null;
          }
          public static Element getNextSibling(Element element, String name, boolean optional) throws XMLDocumentException {
            for (Node sibling = element.getNextSibling(); sibling != null; sibling = sibling.getNextSibling()) {
              if (sibling.getNodeType() == Node.ELEMENT_NODE) {
                if (((Element) sibling).getTagName().equals(name)) {
                  return (Element) sibling;
                }
    stack_metadata:
