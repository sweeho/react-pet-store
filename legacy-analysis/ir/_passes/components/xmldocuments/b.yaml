      xml_parser: JAXP
      validation_support: DTD+XSD

  - record_key: XMLDOC-SERIAL-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL serialize XML documents to Result targets with DOCTYPE declaration,
      configurable encoding, and optional indentation.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils.serialize method (lines 364-386) sets OutputKeys for METHOD, DOCTYPE_PUBLIC,
      DOCTYPE_SYSTEM, ENCODING, and INDENT (lines 368-379). The toXML family of methods (lines
      388-436) provide overloads for various configuration combinations. Indentation is always set
      to "yes" (line 379).
    risk_class: operational
    basis: >
      serialize method constructs Transformer output properties: OutputKeys.DOCTYPE_PUBLIC (line
      373), OutputKeys.DOCTYPE_SYSTEM (line 371), OutputKeys.ENCODING (line 378), OutputKeys.INDENT
      (line 379). The method then calls transformer.transform() with DOMSource and Result (line 380).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 364
        line_end: 386
        excerpt: |
          public static void serialize(Transformer transformer, Document document, String dtdPublicId,
                                       String dtdSystemId, boolean xsdSupport, String encoding, Result result)
                throws XMLDocumentException {
            try {
              transformer.setOutputProperty(OutputKeys.METHOD, "xml");
              if (!xsdSupport) {
                if (dtdSystemId != null) {
                  transformer.setOutputProperty(OutputKeys.DOCTYPE_SYSTEM, dtdSystemId);
                }
                transformer.setOutputProperty(OutputKeys.DOCTYPE_PUBLIC, dtdPublicId);
              }
              transformer.setOutputProperty(OutputKeys.ENCODING, encoding);
              transformer.setOutputProperty(OutputKeys.INDENT, "yes");
              transformer.transform(new DOMSource(document), result);
    stack_metadata:
      framework: J2EE
      serialization_format: XML
      default_encoding: UTF-8

