  - record_key: XMLDOC-ELEM-CREATE-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL provide utility methods to create XML elements with text content,
      supporting multiple data types (String, long, float) and both namespaced and non-namespaced variants.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides createElement and appendChild method families (lines 274-362).
      Non-namespaced variants (lines 274-317) accept element name and value; namespace-aware
      variants (lines 319-362) accept nsURI parameter. Overloads support String, long, float
      primitives (lines 283-289, 328-334).
    risk_class: operational
    basis: >
      createElement(Document, String, String) (lines 274-280) creates element and appends
      TextNode. Primitive overloads (lines 283-289) convert via toString. appendChild methods
      (lines 297-317) follow same pattern, delegating to createElement. Namespace variants
      (lines 319-362) use createElementNS/createTextNodeNS.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 274
        line_end: 317
        excerpt: |
          public static Element createElement(Document document, String name, String value) {
            if (value != null) {
              Element element = (Element) document.createElement(name);
              element.appendChild(document.createTextNode(value));
              return element;
            }
            throw new IllegalArgumentException("XMLDocumentUtils.createElement: value of " + name + " element can't be null.");
          }
          public static Element createElement(Document document, String name, long value) {
            return createElement(document, name, Long.toString(value));
          }
          public static void appendChild(Document document, Node root, String name, String value) {
            Node node = document.createElement(name);
            node.appendChild(document.createTextNode(value != null ? value : ""));
            root.appendChild(node);
