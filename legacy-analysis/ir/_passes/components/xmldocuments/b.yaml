  - record_key: XMLDOC-PARSE-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL support XML document parsing from multiple source types (Source, InputSource,
      String) with configurable validation against DTD or XSD schemas.
    confidence: high
    confidence_basis: >
      XMLDocumentUtils provides overloaded fromXML methods (lines 503-545) accepting Source or
      InputSource parameters. DocumentBuilderFactory.setValidating() (line 516) controls validation.
      Both DTD (via CustomEntityResolver) and XSD paths are implemented. The validating parameter
      is used consistently across overloads.
    risk_class: operational
    basis: >
      fromXML methods in XMLDocumentUtils.java accept Source (StreamSource, SAXSource, DOMSource)
      and InputSource parameters. The validating flag is passed to DocumentBuilderFactory and
      used during parsing (line 516-517). Custom entity resolution is applied for DTD entity
      lookup (line 536).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 503
        line_end: 545
        excerpt: |
          public static Document fromXML(Source source, String dtdPublicId, final URL entityCatalogURL, boolean validating)
                throws XMLDocumentException {
            return deserialize(createTransformer(), source, dtdPublicId, entityCatalogURL, validating, false);
          }
          public static Document fromXML(InputSource source, String dtdPublicId, final URL entityCatalogURL, boolean validating)
                throws XMLDocumentException {
            Document document;
            try {
              if (source.getSystemId() == null) {
                source.setSystemId(SCHEMAS_DIRECTORY_PATH);
              }
              DocumentBuilderFactory builderFactory = DocumentBuilderFactory.newInstance();
              builderFactory.setValidating(validating);
              DocumentBuilder builder = builderFactory.newDocumentBuilder();
    stack_metadata:
