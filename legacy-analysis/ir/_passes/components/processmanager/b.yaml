records:
  - record_key: order-fulfillment-wf-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL track purchase orders through a fulfillment workflow with
      the following state transitions: PENDING (initial) -> APPROVED -> SHIPPED_PART
      (when part of order has shipped) -> COMPLETED (when entire order has shipped),
      or PENDING -> DENIED (when order is rejected).
    confidence: high
    confidence_basis: >
      The OrderStatusNames constant class explicitly documents the order states and
      their sequence. The ProcessManagerEJB and ManagerEJB provide methods to
      create and update status. The schema defines both orderId and status as
      persistent CMP fields, and the declarative configuration enforces Container
      transaction management on all state transitions, providing dual evidence
      (schema + declarative configuration).
    risk_class: operational
    basis: >
      OrderStatusNames.java defines five status constants: PENDING, APPROVED, DENIED,
      SHIPPED_PART, and COMPLETED. The comments state the valid sequence. ProcessManagerEJB
      methods createManager() starts with a status, updateStatus() changes it, and
      getStatus() retrieves it. ManagerEJB is a CMP entity with abstract getters/setters
      for orderId and status, persisted as CMP fields in ejb-jar.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 66
        excerpt: |
          * This class is the central location to store the names of the
          * status that an order can be in.
          * The states an order goes through are:
          * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
          * pending->denied
          ...
          public static final String PENDING = "PENDING";
          public static final String APPROVED = "APPROVED";
          public static final String DENIED = "DENIED";
          public static final String SHIPPED_PART = "SHIPPED_PART";
          public static final String COMPLETED = "COMPLETED";
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 63
        line_end: 76
        excerpt: |
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }

          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB (stateless session), ManagerEJB (entity bean, CMP 2.x)
      ejb.transaction: Required (container-managed)

  - record_key: order-fulfillment-wf-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      When a new order is placed, the system SHALL create a Manager entity to track
      the order through the fulfillment workflow, initialized with the PENDING status.
    confidence: high
    confidence_basis: >
      The ProcessManagerEJB.createManager() method is explicitly documented as
      "Business method used for when new purchase orders are received and want to
      start the workflow process to fulfill the order." The method creates a Manager
      entity via the home interface. This is a single documented source with clear
      intent and corresponding code implementation.
    risk_class: operational
    basis: >
      ProcessManagerEJB.createManager(String orderId, String status) takes an orderId
      and status, then calls mlh.create(orderId, status) to create a ManagerLocal entity.
      The method javadoc states it is called "when new purchase orders are received and
      want to start the workflow process to fulfill the order."
    traces:
