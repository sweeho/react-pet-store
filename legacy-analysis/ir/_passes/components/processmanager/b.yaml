  - record_key: order-fulfillment-wf-0005
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The admin portal SHALL provide a method to retrieve all orders in a specified
      status, enabling admins to view and manage orders at a particular stage of
      fulfillment.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.getOrdersByStatus(String status) is documented as "Business
      method to get all orders of given status for the admin." The ManagerEJB defines
      a CMP query findOrdersByStatus that retrieves entities with matching status.
      This is enforced at both the session bean and entity bean levels with container
      transaction management.
    risk_class: operational
    basis: >
      ProcessManagerEJB defines getOrdersByStatus(String status) that calls
      mlh.findOrdersByStatus(status) and returns a Collection. ManagerEJB's ejb-jar.xml
      declares a CMP query with EJB-QL: SELECT DISTINCT OBJECT(a) FROM Manager a
      WHERE a.status = ?1. The method is available to the admin interface.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 86
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
          </query>
    stack_metadata:
      ejb.bean: ProcessManagerEJB (stateless session), ManagerEJB (entity bean)
      cmp.query: findOrdersByStatus
      ejb.transaction: Required

  - record_key: order-fulfillment-entity-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL maintain a persistent Manager entity with orderId as the
      primary key and status as a mutable field, representing an order's current
      fulfillment state.
    confidence: high
    confidence_basis: >
      ManagerEJB is declared as a CMP 2.x entity bean with container-managed
      persistence in ejb-jar.xml. Both orderId and status are defined as CMP fields
      with explicit field-name declarations. The primary key constraint and field
      persistence are declaratively enforced, providing the highest confidence.
    risk_class: operational
    basis: >
      ejb-jar.xml declares ManagerEJB as an entity bean with persistence-type
      "Container" and CMP version 2.x. It defines two CMP fields: orderId and status.
      The primkey-field is orderId. ManagerEJB.java implements EntityBean and provides
      abstract getters/setters for both fields.
    traces:
