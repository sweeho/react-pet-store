  - record_key: order-fulfillment-wf-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow updating the status of a tracked order to reflect progress
      through the fulfillment workflow (e.g., from PENDING to APPROVED, APPROVED to
      SHIPPED_PART, or any status to DENIED).
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.updateStatus() is explicitly documented for this purpose.
      ManagerEJB has setStatus() as a CMP field. The container transaction management
      ensures atomicity of updates. Method appears in both the session bean interface
      and the entity bean, providing dual enforcement points.
    risk_class: operational
    basis: >
      ProcessManagerEJB.updateStatus(String orderId, String status) is documented as
      "Business method used to keep track of an order in the workflow process." It looks
      up the Manager entity by orderId and calls setStatus() on it. ManagerEJB exposes
      setStatus(String status) as an abstract method backed by a CMP field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
