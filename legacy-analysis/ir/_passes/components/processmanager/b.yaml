      ejb.bean: ManagerEJB (entity bean, CMP 2.x)
      db.object: Manager (abstract schema name)

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions
    description: >
      The transitions/ directory contains TransitionDelegate interface, TransitionInfo
      class, TransitionDelegateFactory, and TransitionException, suggesting a pluggable
      transition mechanism for orchestrating state changes. However, these classes are
      not referenced by ProcessManagerEJB or ManagerEJB, and no concrete TransitionDelegate
      implementations are visible in this module. It is unclear whether this framework
      is actually used for order fulfillment workflows or if it is dead code / a template
      for future extension. Reachability from the main process manager flow is unresolved.
