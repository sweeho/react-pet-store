    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB"
      ejb.transaction: "Required"

  - record_key: ORDERFULFILL-BIZ-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      All order fulfillment workflow methods on both ProcessManagerEJB and ManagerEJB
      SHALL be accessible without authorization checks; the ejb-jar.xml declares an
