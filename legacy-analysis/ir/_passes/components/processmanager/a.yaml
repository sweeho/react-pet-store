records:
  - record_key: ORDERFULFILL-ENT-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL maintain a Manager entity (order workflow state) with two core
      attributes: orderId and status.
    confidence: high
    confidence_basis: >
      The ManagerEJB abstract entity bean and the ejb-jar.xml both explicitly declare
      orderId as the primary key and status as a CMP field. The entity is container-managed
      with CMP version 2.x.
    risk_class: operational
    basis: >
      The ManagerEJB in ejb-jar.xml lines 46-80 declares a CMP entity bean with
      orderId as primary key (line 65) and status as a CMP field (line 59).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 46
        line_end: 80
        excerpt: |
          <entity>
            <display-name>ManagerEB</display-name>
            <ejb-name>ManagerEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerEJB</ejb-class>
            <persistence-type>Container</persistence-type>
