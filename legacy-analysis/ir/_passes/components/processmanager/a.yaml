      ejb.bean: "com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerEJB"
      db.object: "ManagerEJBTable"

  - record_key: ORDERFULFILL-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support an order fulfillment workflow with the following valid
      states: PENDING (orders placed but not yet approved), APPROVED (orders approved
      for fulfillment), DENIED (orders rejected), SHIPPED_PART (partial fulfillment),
      and COMPLETED (fully fulfilled).
    confidence: high
    confidence_basis: >
      The OrderStatusNames class explicitly defines all five status constants as public
      static strings, with comments explaining each state's meaning in the workflow.
      The class documentation shows the explicit state transition paths allowed.
    risk_class: operational
    basis: >
      OrderStatusNames.java lines 44-66 define status constants PENDING, APPROVED,
      DENIED, SHIPPED_PART, and COMPLETED. The class javadoc (lines 44-46) describes
      the allowed state transitions: pending->approved->shippedPart->completed OR
      pending->denied.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 42
        line_end: 66
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";


              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";


              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
      framework: "J2EE"

  - record_key: ORDERFULFILL-BIZ-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN a new purchase order is received, the system SHALL create a workflow
      manager entity with an initial status of PENDING to initiate the fulfillment
      process.
    confidence: high
    confidence_basis: >
      The ProcessManagerEJB.createManager() method (lines 66-68) is explicitly documented
      as "Business method used for when new purchase orders are received and want to start
      the workflow process to fulfill the order". The method creates a Manager entity
      via the ManagerLocalHome.create() call with orderId and status parameters.
    risk_class: operational
    basis: >
      ProcessManagerEJB.createManager(orderId, status) method calls
      mlh.create(orderId, status) which instantiates the ManagerEJB entity through
      the container-managed entity bean creation lifecycle.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
          /**
           * Business method used for when new purchase orders are recieved
           * and want to start the workflow process to fullfil the order
           */
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }
    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB"
      ejb.transaction: "Required"

  - record_key: ORDERFULFILL-BIZ-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support updating an order's workflow status by orderId. When
      updateStatus() is called with an orderId and new status, the system SHALL locate
      the corresponding workflow manager entity and update its status field.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.updateStatus() method lines 73-76 is documented as "Business
      method used to keep track of an order in the workflow process". It retrieves the
      ManagerLocal entity by orderId and calls setStatus() to update the status field.
    risk_class: operational
    basis: >
      ProcessManagerEJB.updateStatus(String orderId, String status) calls
      mlh.findByPrimaryKey(orderId) to locate the entity, then calls
      manager.setStatus(status) to update the status.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB"
      ejb.transaction: "Required"

  - record_key: ORDERTRACK-REQ-0001
    kind: requirement
    capability_key: order-tracking
    requirement: >
      The system SHALL provide a method to retrieve the current workflow status of
      an order by its orderId.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.getStatus() method lines 81-84 is documented as "Business method
      used to keep track of an order in the workflow process". It takes an orderId,
      retrieves the corresponding ManagerLocal entity, and returns its status.
    risk_class: operational
    basis: >
      ProcessManagerEJB.getStatus(String orderId) retrieves the ManagerLocal entity by
      orderId and invokes manager.getStatus() to return the current status string.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 78
        line_end: 84
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public String getStatus(String orderId) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            return manager.getStatus();
          }
    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB"
      ejb.transaction: "Required"

  - record_key: ADMINOPS-REQ-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide a method to retrieve all orders currently in a specific
      workflow status, returning a collection of Manager entities filtered by status
      for administrative dashboard and reporting purposes.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.getOrdersByStatus() method lines 88-91 is documented as "Business
      method to get all orders of given status for the admin". It calls
      mlh.findOrdersByStatus(status) which executes an EJB-QL query to find all Manager
      entities matching the specified status.
    risk_class: operational
    basis: >
      ProcessManagerEJB.getOrdersByStatus(String status) calls
      mlh.findOrdersByStatus(status), which is defined in ejb-jar.xml lines 70-79
      as an EJB-QL query: "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1"
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 86
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
