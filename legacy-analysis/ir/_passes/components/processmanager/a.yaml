  - record_key: ORDERFULFILL-INTEG-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The ProcessManagerEJB stateless session bean SHALL be registered in the
      application server as a local EJB and SHALL maintain a reference to the
      ManagerEJB entity bean via JNDI lookup with the ejb-ref name "ejb/Manager".
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares ProcessManagerEJB as a stateless session bean with an
      ejb-local-ref entry (lines 89-95) mapping the reference name "ejb/Manager" to the
      ManagerEJB entity bean. ProcessManagerEJB.ejbCreate() (lines 93-100) performs a
      JNDI lookup on MANAGER_HOME_ENV_NAME to initialize the ManagerLocalHome reference.
    risk_class: operational
    basis: >
      ProcessManagerEJB declares MANAGER_HOME_ENV_NAME = "java:comp/env/ejb/Manager" and
      performs InitialContext lookup in ejbCreate() to obtain the ManagerLocalHome.
      The ejb-jar.xml lines 89-95 define the ejb-local-ref declaration.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 55
        line_end: 100
        excerpt: |
          public class ProcessManagerEJB implements SessionBean {

              private static final String MANAGER_HOME_ENV_NAME = "java:comp/env/ejb/Manager";

              private ManagerLocalHome mlh;
              private InitialContext ic;

              public void ejbCreate() throws CreateException {
                try {
                   ic = new InitialContext();
                   mlh = (ManagerLocalHome) ic.lookup(MANAGER_HOME_ENV_NAME);
                } catch (NamingException ne) {
                   throw new EJBException("Got naming exception! " + ne.getMessage());
                }
              }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 89
        line_end: 95
        excerpt: |
          <ejb-local-ref>
            <ejb-ref-name>ejb/Manager</ejb-ref-name>
            <ejb-ref-type>Entity</ejb-ref-type>
            <local-home>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocal</local>
            <ejb-link>ManagerEJB</ejb-link>
          </ejb-local-ref>
    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB"

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
    description: >
      The workflow state transition rules are documented only in a javadoc comment
      (lines 44-46) rather than in executable code or configuration. The comment
      indicates transitions of pending->approved->shippedPart->completed OR
      pending->denied, but there is no programmatic validation preventing invalid
      state transitions (e.g., jumping directly from PENDING to COMPLETED, or
      transitioning from DENIED back to APPROVED). It is unclear whether this
      represents the intended behavior or a gap in validation logic. A future decision
      is needed on whether the new system should enforce these transition rules in code.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      The transition framework references (TransitionDelegate, TransitionDelegateFactory,
      TransitionInfo) are defined in the processmanager component but are not invoked
      by the ProcessManagerEJB methods. These interfaces appear to provide an extensible
      mechanism for executing business logic during workflow state transitions, but no
      code in ProcessManagerEJB actually uses them. It is unclear whether: (1) these
      transition delegates are invoked by external callers of ProcessManagerEJB, (2)
      they are a vestigial framework that is no longer used, or (3) they are meant to
      be integrated but were never wired in. The relationship between ProcessManagerEJB
      and the transition framework needs clarification.
