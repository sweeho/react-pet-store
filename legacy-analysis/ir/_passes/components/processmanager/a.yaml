    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.processmanager.ejb.ProcessManagerEJB"
      ejb.transaction: "Required"

  - record_key: ORDERFULFILL-BIZ-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      All order fulfillment workflow operations (create, update, query, retrieve)
      SHALL execute within a Required transaction context, ensuring that each
      workflow state change either commits fully or rolls back completely.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares container-transaction entries with trans-attribute
      "Required" for all methods on ProcessManagerEJB (createManager, updateStatus,
      getStatus, getOrdersByStatus) and ManagerEJB (create, findByPrimaryKey,
      findOrdersByStatus, setStatus, getStatus).
    risk_class: operational
    basis: >
      The assembly-descriptor section in ejb-jar.xml lines 262-390 explicitly declares
      container-transaction elements with trans-attribute "Required" for all workflow
      management methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 346
        line_end: 367
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ProcessManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>createManager</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <container-transaction>
            <method>
              <ejb-name>ProcessManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>updateStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
