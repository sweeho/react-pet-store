  - record_key: ua-business-rule-0001
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      When a new Customer is created, the system SHALL automatically create an
      associated Account with status "active" and an associated Profile with
      default preference values.
    confidence: high
    confidence_basis: >
      The CustomerEJB ejbPostCreate method contains the explicit logic to create
      both Account and Profile entities, looking them up from JNDI and invoking
      their create methods with the default values. This is reinforced by the
      relationship configuration in ejb-jar.xml declaring one-to-one associations
      with cascade delete.
    risk_class: operational
    basis: >
      The CustomerEJB.ejbPostCreate(String userId) method (invoked after
      ejbCreate) performs JNDI lookups to obtain AccountLocalHome and
      ProfileLocalHome, then creates instances of each. The Account is created
      with status "active" (using AccountLocalHome.Active constant), and the
      Profile is created with default values retrieved from ProfileLocalHome
      constants.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);

              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);
              } catch (NamingException ne) {
                  throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
              }
          }
    stack_metadata:
      ejb.bean: CustomerEJB

  - record_key: ua-business-rule-0002
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      When an Account is created, the system SHALL automatically create
      associated ContactInfo and CreditCard entities.
    confidence: high
    confidence_basis: >
      The AccountEJB ejbPostCreate method contains explicit logic to create both
      ContactInfo and CreditCard entities via JNDI lookup and creation. The
      relationship configuration in ejb-jar.xml declares one-to-one associations
      with cascade delete from Account to both entities.
    risk_class: operational
    basis: >
      The AccountEJB class provides two create methods. The ejbPostCreate(String
      status) method performs JNDI lookups for ContactInfoLocalHome and
      CreditCardLocalHome, then creates instances of each and associates them
      with the Account.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 94
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
              setStatus(status);
              try {
                  InitialContext ic = new InitialContext();
                  ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                  ContactInfoLocal contactInfo = cih.create();
                  setContactInfo(contactInfo);
                  CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                  CreditCardLocal creditCard = cch.create();
                  setCreditCard(creditCard);
              } catch (javax.naming.NamingException ne) {
                  throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
              }
          }
    stack_metadata:
      ejb.bean: AccountEJB

