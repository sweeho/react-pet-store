  - record_key: ua-entity-0006
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL maintain CreditCard entities with fields for card type,
      card number, and expiry date.
    confidence: high
    confidence_basis: >
      CreditCard is declared as an EJB entity in ejb-jar.xml with three CMP
      fields. Additional methods in the declarative configuration (getExpiryMonth,
      getExpiryYear, getData) suggest the expiry date field is parsed or derived.
      The declarative configuration provides highest confidence evidence.
    risk_class: financial
    basis: >
      The CreditCard EJB entity in ejb-jar.xml declares three CMP fields:
      cardType, expiryDate, cardNumber. The relationship to Account is
      one-to-one with cascade delete. Container-managed persistence is used.
      The method-permission section references getExpiryMonth, getExpiryYear,
      and getData methods that are not in the CMP fields, indicating derived
      or computed properties from expiryDate.
