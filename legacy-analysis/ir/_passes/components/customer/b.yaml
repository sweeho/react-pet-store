findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      The expiryDate field in CreditCard is stored as a String, but methods
      like getExpiryMonth and getExpiryYear are referenced in the declarative
      configuration. The format of the expiryDate string and the parsing logic
      for these derived methods are not visible in this component's source code
      and may be defined in the creditcard component. Clarification needed on
      the date format and parsing behavior.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
    description: >
      The Account entity supports two different create methods - one that takes
      only a status, and one that takes status plus ContactInfo and CreditCard
      objects. However, the ejbPostCreate(String status) method always creates
      new empty ContactInfo and CreditCard instances, potentially overwriting
      any provided in the alternative create signature. The intended usage
      pattern between these two create methods is unclear.
