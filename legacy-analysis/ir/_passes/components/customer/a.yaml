  - record_key: user-accounts-business-rule-0001
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      GIVEN a new Customer is being created with userId, WHEN the Customer entity
      is persisted, THEN an Account entity SHALL be automatically created with
      status "active", and the Customer-Account relationship SHALL be established.
    confidence: high
    confidence_basis: >
      The ejbPostCreate method in CustomerEJB.java explicitly creates an Account
      with AccountLocalHome.Active status. The code is declarative and directly
      traceable. Both code and configuration agree.
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate (lines 74-89) looks up AccountLocalHome via JNDI,
      creates an Account with status "active" (AccountLocalHome.Active constant),
      and establishes the relationship. This is guaranteed by the EJB container
      to execute after entity creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              // ... Profile creation follows
    stack_metadata:
