  - record_key: ORDER-WRK-0001
    kind: workflow
    capability_key: order-placement
    requirement: >
      GIVEN a PurchaseOrder value object with all required customer,
      billing, shipping, payment, and line item information, WHEN the
      system creates a new PurchaseOrder, THEN the ejbCreate method
      SHALL set the core PO fields, and the ejbPostCreate method SHALL
      atomically create associated ContactInfo, CreditCard, and LineItem
      entities via their respective local home interfaces and establish
      relationships via CMR fields.
    confidence: high
    confidence_basis: >
      The creation workflow is clearly implemented in two phases across
      PurchaseOrderEJB.ejbCreate (lines 197-205) and ejbPostCreate
      (lines 211-238). The code shows explicit lookup of local home
      interfaces via ServiceLocator and iterative creation of line items.
      Both methods are part of the EJB lifecycle contract.
    risk_class: operational
    basis: >
      PurchaseOrderEJB.java lines 197-238 implement the complete creation
      workflow. ejbCreate sets poId, poUserId, poEmailId, poDate, poLocale,
      and poValue. ejbPostCreate uses ServiceLocator to obtain references
      to related EJB homes, creates ContactInfo and CreditCard entities,
      then iterates through provided line items creating each one and
      adding to the PO.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 238
        excerpt: |
          /**
           * the ejb create method
           * @param <Code>purchaseOrder</Code> the Purchase Order details
           */
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                setPoId(purchaseOrder.getOrderId());
                setPoUserId(purchaseOrder.getUserId());
                setPoEmailId(purchaseOrder.getEmailId());
                setPoDate(purchaseOrder.getOrderDate().getTime());
                setPoLocale(purchaseOrder.getLocale().toString());
                setPoValue(purchaseOrder.getTotalPrice());
                return null;
          }

          /**
           * the ejb create method
           * @param <Code>purchaseOrder</Code> the Purchase Order details
           */
          public void ejbPostCreate(PurchaseOrder purchaseOrder)
                                                   throws CreateException {
              try {
                  ServiceLocator serviceLocator = new ServiceLocator();
                  ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
                  ContactInfoLocal cinfoloc = (ContactInfoLocal)
                      cinforef.create(purchaseOrder.getShippingInfo());
                  setContactInfo(cinfoloc);
                  CreditCardLocalHome cardref = (CreditCardLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CARD_EJB);
                  CreditCardLocal cardloc = (CreditCardLocal)
                      cardref.create(purchaseOrder.getCreditCard());
                  setCreditCard(cardloc);
                  LineItemLocalHome lineItemref = (LineItemLocalHome)
                      serviceLocator.getLocalHome(JNDINames.LI_EJB);
                  Collection litems = purchaseOrder.getLineItems();
                  Iterator it = litems.iterator();
                  while((it != null) && (it.hasNext())) {
                      LineItem li = (LineItem) it.next();
                      LineItemLocal lineItemloc = (LineItemLocal)
                          lineItemref.create(li, 0);
                      addLineItem(lineItemloc);
                  }
              } catch(ServiceLocatorException ne) {
                  throw new CreateException("ServiceLocator Ex while persisting PO CMR :" + ne.getMessage());
              }
          }
    stack_metadata:
      lifecycle.phase: create, post_create
      relationship.assembly: ServiceLocator_based

