  # Business Rules - Fulfillment
  - record_key: ORDER-FUL-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order with line items, WHEN invoice information
      is received from the supplier, THEN the system SHALL update the
      quantityShipped field for each line item and determine if the
      order is completely fulfilled by checking if all line items have
      quantity equals quantityShipped.
    confidence: high
    confidence_basis: >
      The fulfillment logic is explicitly implemented in
      PurchaseOrderHelper.processInvoice() method with clear control
      flow. The method iterates through line items, updates quantityShipped
      cumulatively, and checks completion status using field-level
      comparison.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java lines 80-103 implement the complete
      fulfillment process. The method receives a map of lineItemIds to
      shipped quantities, iterates through PO line items, and for each
      matching item, adds the shipped quantity to quantityShipped.
      The completion check loops through all line items comparing
      quantity to quantityShipped.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }//end while

            // now loop through all LIs and see if all are shipped completely
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                  return false;
                  }
            }//end while
            return true;
          }
    stack_metadata:
      method.name: processInvoice
      method.params: PurchaseOrderLocal, Map

  - record_key: ORDER-FUL-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL accumulate quantityShipped from multiple shipments
      by adding new shipped quantities to the existing quantityShipped
      value rather than replacing it.
    confidence: high
    confidence_basis: >
      The code explicitly uses addition operator (+=) in the processInvoice
      method at line 89, and the right operand retrieves the current
      quantityShipped before addition. This pattern is unambiguous and
      prevents loss of partial shipment data.
    risk_class: financial
    basis: >
      PurchaseOrderHelper.java line 89 shows:
      li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
      This pattern retrieves the existing value and adds to it, confirming
      cumulative tracking.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 85
        line_end: 91
        excerpt: |
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(lineItemIds.containsKey(li.getItemId())) {
                        Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                }
          }
    stack_metadata:
      operation.type: cumulative_update
      field.name: quantityShipped

