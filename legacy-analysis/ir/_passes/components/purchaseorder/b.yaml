  - record_key: order-placement-xml-serialization-0001
    kind: business-rule
    capability_key: order-placement
    requirement: |
      PurchaseOrder value objects SHALL support bidirectional XML serialization.
      Orders SHALL be serialized to XML documents conforming to PurchaseOrder.dtd.
      XML documents SHALL be deserialized back to PurchaseOrder value objects with
      locale defaulting to en_US if not specified.
    confidence: medium
    confidence_basis: |
      XML methods are implemented in PurchaseOrder.java (toXML/fromXML/toDOM/fromDOM at
      lines 194-320), but these are utility methods on a value object, not entity
      persistence. No requirement enforces when or how this serialization is used. The
      DTD exists and defines the schema, but reachability from core order flow is unclear.
    risk_class: operational
    basis: |
      PurchaseOrder class provides toXML() returning String, toXML(Result) for streaming,
      fromXML(Source) static factory, and DOM conversion methods. DTD at
      PurchaseOrder.dtd defines root element with locale attribute (default en_US) and
      child elements for all PO fields. SimpleDateFormat uses yyyy-MM-dd format.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
