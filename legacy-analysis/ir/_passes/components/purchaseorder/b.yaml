records:
  - record_key: order-placement-entity-0001
    kind: entity
    capability_key: order-placement
    requirement: |
      The system SHALL persist a PurchaseOrder entity with the following attributes:
      unique identifier (poId), user identifier (poUserId), user email (poEmailId),
      order date (poDate), locale (poLocale), and total monetary value (poValue).
    confidence: high
    confidence_basis: |
      Multiple independent declarations: (1) CMP field definitions in ejb-jar.xml lines 60-83
      establish these fields as persistent; (2) PurchaseOrderEJB accessor/mutator methods
      (lines 79-145) provide programmatic enforcement; (3) PurchaseOrder value object
      (lines 74-84 in PurchaseOrder.java) mirrors schema confirming the contract.
    risk_class: operational
    basis: |
      ejb-jar.xml defines PurchaseOrderEJB as a CMP 2.x entity with abstract schema
      "PurchaseOrder" and six CMP fields: poId (primary key), poUserId, poEmailId, poDate,
      poLocale, and poValue. The primary key is type String.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 48
        line_end: 84
        excerpt: |
          <entity>
            <description>PurchaseOrder CMP EJB</description>
            <display-name>PurchaseOrderEB</display-name>
            <ejb-name>PurchaseOrderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.purchaseorder.ejb.PurchaseOrderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.purchaseorder.ejb.PurchaseOrderLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.purchaseorder.ejb.PurchaseOrderEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>PurchaseOrder</abstract-schema-name>
            <cmp-field><field-name>poId</field-name></cmp-field>
            <cmp-field><field-name>poUserId</field-name></cmp-field>
            <cmp-field><field-name>poEmailId</field-name></cmp-field>
            <cmp-field><field-name>poDate</field-name></cmp-field>
            <cmp-field><field-name>poLocale</field-name></cmp-field>
            <cmp-field><field-name>poValue</field-name></cmp-field>
            <primkey-field>poId</primkey-field>
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      ejb.transaction: Required (declarative)
      orm.persistence: CMP 2.x

  - record_key: order-placement-relationship-0001
    kind: business-rule
    capability_key: order-placement
    requirement: |
      Each PurchaseOrder SHALL have exactly one associated ContactInfo containing
      customer contact and address information, with cascade-delete enforced on
      the ContactInfo side of the relationship.
    confidence: high
    confidence_basis: |
      The relationship is declared in ejb-jar.xml with both UML multiplicity
      (One:One) and cascade-delete semantics explicitly marked. This is declarative
      enforcement with no ambiguity.
    risk_class: operational
    basis: |
      ejb-jar.xml defines a ONE-TO-ONE unidirectional relationship "PurchaseOrder-ContactInfo"
      at lines 286-310. PurchaseOrderEJB has a CMR field contactInfo; cascade-delete is
      applied to the ContactInfoEJB side, ensuring referential integrity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 283
        line_end: 310
        excerpt: |
          <!--
           ONE-TO-ONE Relationship between PurchaseOrder and ContactInfo.
           Every PO has one customer address related to it. This is uni-directional
          -->
          <ejb-relation>
          <ejb-relation-name>PurchaseOrder-ContactInfo</ejb-relation-name>
          <ejb-relationship-role>
            <ejb-relationship-role-name>purchaseorder-has-contactinfo</ejb-relationship-role-name>
            <multiplicity>One</multiplicity>
            <relationship-role-source>
              <ejb-name>PurchaseOrderEJB</ejb-name>
            </relationship-role-source>
            <cmr-field>
              <cmr-field-name>contactInfo</cmr-field-name>
            </cmr-field>
          </ejb-relationship-role>
          <ejb-relationship-role>
            <ejb-relationship-role-name>contactinfo-for-purchaseorder</ejb-relationship-role-name>
            <multiplicity>One</multiplicity>
            <cascade-delete />
            <relationship-role-source>
              <ejb-name>ContactInfoEJB</ejb-name>
            </relationship-role-source>
          </ejb-relationship-role>
        </ejb-relation>
    stack_metadata:
      ejb.relationship: PurchaseOrder-ContactInfo (ONE:ONE)
      cascade.delete: true

