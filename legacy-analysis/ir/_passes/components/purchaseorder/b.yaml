findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: |
      Line 268 in PurchaseOrderEJB.getData() contains a comment "// XXX" next to the
      assignment of billingInfo to shippingInfo. The intent is unclear: is this
      intentionally setting both addresses to be identical, or is this a TODO/defect?
      The PurchaseOrder.dtd shows separate ShippingInfo and BillingInfo elements
      (lines 52-54), suggesting they should differ. No validation prevents them from
      diverging after assignment, and no documented business rule establishes when
      they should or shouldn't match.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
    description: |
      Lines 286-310 define a ONE-TO-ONE relationship, but the relationship element
      at line 316 for ContactInfo-Address is missing the ejb-relation-name. This
      makes it syntactically odd. The DTD would allow this, but a name would improve
      traceability. No functional impact expected, but unusual enough to flag.
