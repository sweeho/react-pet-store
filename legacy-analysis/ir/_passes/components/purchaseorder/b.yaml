      cascade.delete: true

  - record_key: order-placement-creation-0001
    kind: requirement
    capability_key: order-placement
    requirement: |
      The system SHALL create a new PurchaseOrder from a PurchaseOrder value object,
      persisting all CMP fields and then establishing relationships to a ContactInfo,
      CreditCard, and zero or more LineItem entities in post-creation phase.
    confidence: high
    confidence_basis: |
      Dual-phase creation is evident in PurchaseOrderEJB ejbCreate (lines 197-205) and
      ejbPostCreate (lines 211-238). Both are required lifecycle methods with distinct
      responsibilities. No conflicting behavior observed.
    risk_class: operational
    basis: |
      PurchaseOrderEJB.ejbCreate takes a PurchaseOrder value object and sets all six
      CMP fields from it. ejbPostCreate then locates related EJBs via ServiceLocator and
      establishes CMR relationships. This separation enforces transactional consistency.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 238
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                setPoId(purchaseOrder.getOrderId());
                setPoUserId(purchaseOrder.getUserId());
                setPoEmailId(purchaseOrder.getEmailId());
                setPoDate(purchaseOrder.getOrderDate().getTime());
                setPoLocale(purchaseOrder.getLocale().toString());
                setPoValue(purchaseOrder.getTotalPrice());
                return null;
          }

          public void ejbPostCreate(PurchaseOrder purchaseOrder)
                                                 throws CreateException {
              try {
                  ServiceLocator serviceLocator = new ServiceLocator();
                  ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
                  ContactInfoLocal cinfoloc = (ContactInfoLocal)
                      cinforef.create(purchaseOrder.getShippingInfo());
                  setContactInfo(cinfoloc);
                  CreditCardLocalHome cardref = (CreditCardLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CARD_EJB);
                  CreditCardLocal cardloc = (CreditCardLocal)
                      cardref.create(purchaseOrder.getCreditCard());
                  setCreditCard(cardloc);
                  LineItemLocalHome lineItemref = (LineItemLocalHome)
                      serviceLocator.getLocalHome(JNDINames.LI_EJB);
                  Collection litems = purchaseOrder.getLineItems();
                  Iterator it = litems.iterator();
                  while((it != null) && (it.hasNext())) {
                      LineItem li = (LineItem) it.next();
                      LineItemLocal lineItemloc = (LineItemLocal)
                          lineItemref.create(li, 0);
                      addLineItem(lineItemloc);
                  }
              } catch(ServiceLocatorException ne) {
                  throw new CreateException("ServiceLocator Ex while persisting PO CMR :" + ne.getMessage());
              }
          }
    stack_metadata:
      ejb.lifecycle: ejbCreate + ejbPostCreate
      ejb.transaction: Required

  - record_key: order-fulfillment-invoice-processing-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: |
      The system SHALL process invoice information received from a supplier by updating
      line item quantity_shipped fields. When all line items for a purchase order are
      completely shipped (quantity_shipped == quantity for all items), the system SHALL
      return true; otherwise false.
    confidence: high
    confidence_basis: |
      PurchaseOrderHelper.processInvoice is a dedicated business method with clear
      logic: iterate line items, update shipped quantities from a map, then loop again
      to check if all are fulfilled. Logic is unambiguous and single-sourced.
    risk_class: operational
    basis: |
      PurchaseOrderHelper.processInvoice (lines 80-103) takes a PurchaseOrderLocal and
      a Map of lineItemId->quantityShipped. It updates each line item's quantityShipped
      by the received amount, then checks ALL line items. Returns true only if every
      line item's quantity == quantityShipped.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 68
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }//end while

            // now loop through all LIs and see if all are shipped completely
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                  return false;
                  }
            }//end while
            return true;
          }
    stack_metadata:
      helper.class: PurchaseOrderHelper
      logic.pattern: process-and-validate

  - record_key: order-tracking-date-range-query-0001
