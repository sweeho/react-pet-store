  - record_key: order-placement-shipping-billing-info-0001
    kind: business-rule
    capability_key: order-placement
    requirement: |
      A PurchaseOrder SHALL contain both shipping and billing contact information.
      The current implementation uses the same ContactInfo object for both
      (billingInfo assigned from shippingInfo in getData method), indicating that
      shipping and billing addresses are currently identical.
    confidence: low
    confidence_basis: |
      The getData() method at line 268 contains a suspicious assignment:
      purchaseOrder.setShippingInfo(purchaseOrder.getBillingInfo()); with a comment "// XXX"
      suggesting uncertainty. This is the only place where the relationship is set.
      No validation or business logic prevents them from diverging, but the code
      suggests intentional identity mapping.
    risk_class: operational
    basis: |
      PurchaseOrderEJB.getData() line 268 assigns billingInfo to shippingInfo after
      getting contactInfo. The comment "// XXX" on the same line suggests this may be
      a placeholder or TODO. No field-level validation prevents overriding this.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 259
        line_end: 276
        excerpt: |
          public PurchaseOrder getData() {
            PurchaseOrder purchaseOrder = new PurchaseOrder();
            purchaseOrder.setOrderId(getPoId());
            purchaseOrder.setUserId(getPoUserId());
            purchaseOrder.setEmailId(getPoEmailId());
            purchaseOrder.setOrderDate(new Date(getPoDate()));
            purchaseOrder.setLocale(getPoLocale());
            purchaseOrder.setTotalPrice(getPoValue());
            purchaseOrder.setBillingInfo(getContactInfo().getData());
            purchaseOrder.setShippingInfo(purchaseOrder.getBillingInfo()); // XXX
            purchaseOrder.setCreditCard(getCreditCard().getData());
            Collection lineItems = getLineItems();
            for (Iterator iterator = lineItems.iterator(); iterator.hasNext();) {
              LineItemLocal lineItem = (LineItemLocal) iterator.next();
              purchaseOrder.addLineItem(lineItem.getData());
            }
            return purchaseOrder;
          }
    stack_metadata:
      suspicious.pattern: duplicate-reference
      comment: "// XXX suggests this may be unfinished logic"

  - record_key: order-placement-data-retrieval-0001
    kind: requirement
    capability_key: order-placement
    requirement: |
      The system SHALL provide a method to retrieve a complete PurchaseOrder value
      object containing all CMP fields and related objects (ContactInfo, CreditCard,
      and LineItems), converting managed objects to value objects for use outside
      transaction boundaries.
    confidence: high
    confidence_basis: |
      PurchaseOrderEJB.getData() and PurchaseOrderEJB.getAllItems() are explicit
      methods for this purpose. Purpose is documented in getAllItems javadoc
      (line 244-245): "required because managed objects cant be accessed outside
      transaction boundaries".
    risk_class: operational
    basis: |
      PurchaseOrderEJB provides getData() which constructs a complete value object
      from entity state, and getAllItems() which iterates line items and calls
      LineItemLocal.getData() to convert them. This is a standard J2EE pattern
      for externalizing transactional state.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 244
        line_end: 257
        excerpt: |
          /**
           * This gets all line items for this po and returns a collection of
           * Value objects. This is required because managed objects cant be accessed
           * outside transaction bounsaries
           * @return <Code>Collection</Code> of <Code>LineItem</Code> value objects
           */
          public Collection getAllItems() {
              Collection liColl = getLineItems();
              if(liColl == null)
                  return(null);
              ArrayList retVal = new ArrayList();
              Iterator it = liColl.iterator();
              while((it!=null) && (it.hasNext())) {
                  LineItemLocal loc = (LineItemLocal) it.next();
                  retVal.add(loc.getData());
              }
              return(retVal);
          }
    stack_metadata:
      pattern: value-object-conversion

  - record_key: order-placement-transaction-consistency-0001
    kind: business-rule
    capability_key: order-placement
    requirement: |
      All container-managed methods on PurchaseOrderEJB SHALL execute within a Required
