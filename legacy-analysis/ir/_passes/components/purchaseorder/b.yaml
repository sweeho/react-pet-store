  - record_key: order-placement-lineitems-0001
    kind: business-rule
    capability_key: order-placement
    requirement: |
      Each PurchaseOrder SHALL contain one or more LineItem entities representing
      ordered items, with cascade-delete enforced on the LineItem side of the
      relationship.
    confidence: high
    confidence_basis: |
      Both declarative (ejb-jar.xml lines 368-397) and programmatic evidence
      (PurchaseOrderEJB.addLineItem, PurchaseOrder.fromDOM/toDOM) confirm ONE:MANY
      cardinality and cascade semantics.
    risk_class: operational
    basis: |
      ejb-jar.xml defines ONE-TO-MANY unidirectional relationship "PurchaseOrder-LineItem"
      with PurchaseOrderEJB having CMR field lineItems of type java.util.Collection.
      Cascade-delete on LineItemEJB side ensures line items are removed with order.
      DTD at line 38 enforces "LineItem+" (one or more).
    traces:
