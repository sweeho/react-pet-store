      transaction_scope: Container

  - record_key: SUPMGMT-BUSINESS-0004
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      The system SHALL support converting a SupplierOrder to and from XML
      representation, including serialization to XML with DTD validation
      and deserialization from XML strings or DOM structures.
    confidence: medium
    confidence_basis: >
      The SupplierOrder class provides XML serialization methods (toXML,
      fromXML, toDOM, fromDOM) and declares DTD public/system IDs. However,
      XML handling appears to be a data transfer concern separate from the
      EJB entity model, and is not enforced at the container level. This is
      a single-source requirement (the SupplierOrder class).
    risk_class: operational
    basis: >
      SupplierOrder class defines toXML(), fromXML(), toDOM(), and fromDOM()
      methods. Constants DTD_PUBLIC_ID and DTD_SYSTEM_ID reference a SupplierOrder.dtd.
      XML serialization includes orderDate formatting via SimpleDateFormat.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 57
        line_end: 66
        excerpt: |
          public static final boolean TRACE = true;
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD SupplierOrder 1.1//EN";
          public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/supplierpo/rsrc/schemas/SupplierOrder.dtd";
          public static final boolean VALIDATING = true;
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 120
        line_end: 152
        excerpt: |
          public void toXML(Result result) throws XMLDocumentException {
            toXML(result, null);
            return;
          }
          public String toXML() throws XMLDocumentException {
            return toXML((URL) null);
          }
          public void toXML(Result result, URL entityCatalogURL)
            throws XMLDocumentException {
              if (entityCatalogURL != null) {
                XMLDocumentUtils.toXML(toDOM(), DTD_PUBLIC_ID, entityCatalogURL,
                                       XMLDocumentUtils.DEFAULT_ENCODING, result);
              } else {
                XMLDocumentUtils.toXML(toDOM(), DTD_PUBLIC_ID, DTD_SYSTEM_ID,
                                       XMLDocumentUtils.DEFAULT_ENCODING, result);
              }
              return;
          }
    stack_metadata:
      implementation_layer: data-transfer-object

  - record_key: SUPMGMT-BUSINESS-0005
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      When accessing line items through the SupplierOrder interface, the
      system SHALL provide an getAllItems() method that returns line item
      data without exposing container-managed relationship (CMR) field
      references. This allows web-tier access to line items outside of
      a transactional context.
    confidence: high
    confidence_basis: >
      The getAllItems() method is explicitly implemented in SupplierOrderEJB
      with a comment explaining the constraint: "web tier cannot access CMR
      fields that return managed objects without a transaction". The method
      iterates over CMR fields and returns detached LineItem data objects.
    risk_class: operational
    basis: >
      SupplierOrderEJB.getAllItems() method comment states that web tier
      cannot access CMR fields without a transaction, and the method
      converts LineItemLocal objects to LineItem data objects via
      loc.getData() before returning.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 186
        line_end: 203
        excerpt: |
          /**
           * Method gets a collection of all line items for this PO. This is required
           * because web tier cannot access CMR fields that return managed objects
           * without a transaction
           * @return <Code>Collection</Code> Colleciton of lineitems
           */
          public Collection getAllItems() {
            Collection liColl = getLineItems();
            if(liColl == null)
              return(null);
            ArrayList retVal = new ArrayList();
            Iterator it = liColl.iterator();
            while((it!=null) && (it.hasNext())) {
              LineItemLocal loc = (LineItemLocal) it.next();
              retVal.add(loc.getData());
            }
            return(retVal);
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      pattern: data-transfer-object

  - record_key: SUPMGMT-BUSINESS-0006
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      The system SHALL provide a getData() method on SupplierOrder that
      returns a complete data transfer object (SupplierOrder POJO) containing
      all order information: identifier, date, shipping contact, and all
      associated line items. All data conversions from EJB-managed types
      to serializable POJOs SHALL be performed by this method.
    confidence: high
    confidence_basis: >
      Both the EJB interface (SupplierOrderLocal) and implementation
      (SupplierOrderEJB) declare the getData() method. The implementation
      shows explicit marshalling of all fields into a SupplierOrder object.
    risk_class: operational
    basis: >
      SupplierOrderEJB.getData() method creates a new SupplierOrder object
      and populates it with values from the EJB's CMP and CMR fields,
      converting longs back to Date and LineItemLocal to LineItem.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 216
        excerpt: |
          public SupplierOrder getData() {
            SupplierOrder supplierOrder = new SupplierOrder();
            supplierOrder.setOrderId(getPoId());
            supplierOrder.setOrderDate(new Date(getPoDate()));
            supplierOrder.setShippingInfo(supplierOrder.getShippingInfo());
            Collection lineItems = getLineItems();
            for (Iterator iterator = lineItems.iterator(); iterator.hasNext();) {
              LineItemLocal lineItem = (LineItemLocal) iterator.next();
              supplierOrder.addLineItem(lineItem.getData());
            }
            return supplierOrder;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      pattern: data-transfer-object

