      The ejb-jar.xml relationships section explicitly declares a one-to-one
      uni-directional relationship with CMR field contactInfo on SupplierOrderEJB
      and cascade-delete on the ContactInfoEJB side. The deployment descriptor
      shows the multiplicity and role names. The local interface declares the
      accessor method. The value object class SupplierOrder.java has a shippingInfo
      field of type ContactInfo.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 234-258 declare the SupplierOrder-ContactInfo relationship
      with one-to-one multiplicity and unidirectional flow. SupplierOrderLocal.java
      lines 63-64 show the accessor methods. SupplierOrder.java line 69 declares
