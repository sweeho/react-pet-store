  - record_key: SUPLYMGMT-LIFECYCLE-0001
    kind: business-rule
    capability_key: supplier-management
    requirement: >
      When a new Supplier Order is created, the system SHALL automatically initialize
      the order status to PENDING, capture the order creation timestamp, and create
      associated ContactInfo and LineItem entities in a single transactional operation.
      If any part of the creation fails, the entire operation SHALL be rolled back.
    confidence: high
    confidence_basis: >
      The ejbCreate and ejbPostCreate methods show the creation workflow. All methods
      are marked with container-transaction Required attribute in the deployment
      descriptor, ensuring transactional atomicity. The create method calls setPoStatus
      with PENDING constant. The ejbPostCreate creates related entities via service
      locator. The deployment descriptor shows container-managed transactions on all
      create methods.
    risk_class: operational
    basis: >
      SupplierOrderEJB.java lines 151-184 show the ejbCreate and ejbPostCreate sequence.
      OrderStatusNames.java line 51 defines PENDING as the initial status. ejb-jar.xml
      lines 445-455 declare create method with Required transaction attribute.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 148
        line_end: 184
        excerpt: |
          /**
           * the ejbCreate method
           * @param <code>supplierOrder</code>
           */
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }

          /**
           * the ejbPostCreate method
           * @param <code>supplierOrder</code>
           */
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                      throws CreateException {
          try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
            } catch(ServiceLocatorException ne) {
              throw new CreateException("ServiceLocator Ex while persisting PO CMR :" +
                                        ne.getMessage());
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 445
        line_end: 455
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>SupplierOrderEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>create</method-name>
              <method-params>
                <method-param>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrder</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.lifecycle: ejbCreate/ejbPostCreate
      ejb.transaction: Required
      cascade_operations: true

