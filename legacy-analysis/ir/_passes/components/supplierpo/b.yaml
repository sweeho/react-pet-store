  - record_key: SUPLYMGMT-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL implement a Supplier Order status workflow with the following
      valid states: PENDING, APPROVED, DENIED, COMPLETED. New orders start in the
      PENDING state. An order may transition from PENDING to either APPROVED or DENIED.
      An APPROVED order may transition to COMPLETED.
    confidence: high
    confidence_basis: >
      The status names are defined as public static constants in OrderStatusNames.java
      with explicit comments describing the state transitions. The initial state is
      set in SupplierOrderEJB.ejbCreate() at line 154, and the setPoStatus() method
      allows status updates. The workflow is documented in code comments with clear
      transition paths: "pending->approved->completed or pending->denied".
    risk_class: operational
    basis: >
      OrderStatusNames.java lines 44-61 define the four valid status constants with
      comments describing transitions. SupplierOrderEJB.java line 154 sets initial
      status to PENDING on creation. The abstract schema name and query in ejb-jar.xml
      lines 95-104 show status is a queryable field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 62
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";
              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";
              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";
              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
          }
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      db.object: SupplierOrder (abstract schema)
      status_field: poStatus

