  - record_key: SLOC-REQ-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      ServiceLocatorException SHALL support three construction forms: with message only,
      with wrapped exception only, and with both message and wrapped exception. The class
      SHALL provide getException() to retrieve the wrapped exception and getRootCause()
      to recursively unwrap chains of nested ServiceLocatorException instances.
    confidence: high
    confidence_basis: >
      All three constructors are explicitly defined and the exception retrieval methods
      are clearly implemented. The recursive root cause logic in getRootCause() is
      unambiguous.
    risk_class: operational
    basis: >
      ServiceLocatorException class defines three constructors at lines 54-76 of
      ServiceLocatorException.java: one with message and exception, one with message
      only, one with exception only. getException() at lines 83-85 and getRootCause()
      at lines 92-97 provide retrieval and recursive unwrapping.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 54
        line_end: 97
        excerpt: |
          public ServiceLocatorException(String message, Exception exception) {
            super(message);
            this.exception = exception;
            return;
          }

          public ServiceLocatorException(String message) {
            this(message, null);
            return;
          }

          public ServiceLocatorException(Exception exception) {
            this(null, exception);
            return;
          }

          public Exception getException() {
            return exception;
          }

          public Exception getRootCause() {
            if (exception instanceof ServiceLocatorException) {
              return ((ServiceLocatorException) exception).getRootCause();
            }
            return exception == null ? this : exception;
          }

  - record_key: SLOC-REQ-0004
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide methods to look up EJB local homes by JNDI name,
      returning EJBLocalHome references that callers must cast to their specific
      EJB home interface type.
    confidence: high
    confidence_basis: >
      The getLocalHome() method is present in both EJB and web tier implementations
      with identical signatures and behavior. The pattern is consistent and
      straightforward.
    risk_class: operational
    basis: >
      getLocalHome() method defined at lines 83-93 of ejb/ServiceLocator.java and
      lines 106-121 of web/ServiceLocator.java. Both take a jndiHomeName parameter
      and return EJBLocalHome after JNDI lookup.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 78
        line_end: 93
        excerpt: |
          /**
           * will get the ejb Local home factory.
           * clients need to cast to the type of EJBHome they desire
           *
           * @return the Local EJB Home corresponding to the homeName
           */
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }

  - record_key: SLOC-REQ-0005
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide methods to look up remote EJB homes by JNDI name and
      class type. The JNDI object reference SHALL be narrowed using
      PortableRemoteObject.narrow() to the specified class before returning as EJBHome.
    confidence: high
    confidence_basis: >
      The getRemoteHome() method is explicitly implemented in both tiers with the
      PortableRemoteObject.narrow() pattern clearly visible. This is a required J2EE
      pattern for remote EJB access.
    risk_class: operational
    basis: >
      getRemoteHome() at lines 101-113 of ejb/ServiceLocator.java and lines 129-147
      of web/ServiceLocator.java. Lines 104-106 in ejb version show the narrowing
      pattern: Object objref = ic.lookup(), Object obj = PortableRemoteObject.narrow(),
      then cast to EJBHome.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }

