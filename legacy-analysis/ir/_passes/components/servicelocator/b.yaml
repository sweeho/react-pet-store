  - record_key: SLOC-REQ-0018
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      On each JNDI resource lookup request in the web tier, the system SHALL first
      check the cache using containsKey() with the JNDI name as key. If the resource
      is cached, it SHALL return the cached instance without performing a new JNDI lookup.
    confidence: high
    confidence_basis: >
      The cache-check pattern is consistently implemented across all resource lookup
      methods in web/ServiceLocator.java. Every method that uses caching exhibits
      this pattern uniformly.
    risk_class: operational
    basis: >
      Methods like getLocalHome() (lines 109-114), getRemoteHome() (lines 132-139),
      getQueueConnectionFactory() (lines 157-161), getQueue() (lines 178-182), and
      getTopic() (lines 222-226) all check cache.containsKey() before JNDI lookup
      and return cached value if present.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }

