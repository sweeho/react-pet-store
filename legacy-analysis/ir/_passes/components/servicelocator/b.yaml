  - record_key: SLOC-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL implement a Service Locator pattern to abstract JNDI lookups
      and provide a single point of access for resolving enterprise resources (EJB homes,
      JMS destinations, connection factories, data sources, and configuration entries).
    confidence: high
    confidence_basis: >
      This is the primary architectural pattern of the component. Both the EJB and web
      tier implementations explicitly document and implement this pattern. The class-level
      comments make this requirement unambiguous.
    risk_class: operational
    basis: >
      ServiceLocator javadoc comments at lines 56-58 of ejb/ServiceLocator.java and
      lines 59-65 of web/ServiceLocator.java both state the class implements the
      Service Locator pattern for looking up resources.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 56
        line_end: 59
        excerpt: |
          /**
           *  This class is an implementation of the Service Locator pattern. It is
           *  used to looukup resources such as EJBHomes, JMS Destinations, etc.
           */
    stack_metadata:
      framework: J2EE
      pattern: Service Locator

  - record_key: SLOC-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL wrap all lower-level JNDI exceptions (NamingException and generic
      Exception) in ServiceLocatorException to provide a unified exception interface for
      JNDI resource lookup failures.
    confidence: high
    confidence_basis: >
      This exception wrapping pattern is implemented consistently across all methods in
      both the EJB and web tier implementations. Every single method exhibits this pattern
      with identical try-catch structure catching both NamingException and Exception.
    risk_class: operational
    basis: >
      All lookup methods follow the same pattern of catching NamingException and Exception
      and wrapping them in ServiceLocatorException. Constructor at lines 67-73 of
      ejb/ServiceLocator.java demonstrates this pattern; it is replicated in all lookup methods.
    traces:
