  - record_key: ORDF-REQ-0019
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The web tier ServiceLocator implementation SHALL cache EJB homes (both local and remote),
      JMS destinations (queues and topics), and JMS connection factories to optimize performance.
      URL, boolean, and string environment entries SHALL NOT be cached.
    confidence: medium
    confidence_basis: >
      Caching is explicitly implemented for EJB homes and JMS resources in web tier.
      However, getUrl(), getBoolean(), and getString() methods in web/ServiceLocator.java
      do NOT use cache.containsKey() checks. The reason for this distinction is not
      documented, so confidence is medium rather than high.
    risk_class: operational
    basis: >
      Lines 261-272 (getUrl) and 278-288 (getBoolean) and 294-304 (getString) in
      web/ServiceLocator.java perform direct lookups without cache checks, unlike
      the resource methods above. This intentional design choice has no documented rationale.
    traces:
