  - record_key: ORDF-REQ-0016
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The web tier ServiceLocator SHALL use a synchronized HashMap to cache JNDI lookup
      results for performance optimization. The cache SHALL hold references to
      EJBHomes, JMS resources, and DataSources for re-use without repeated lookups.
    confidence: high
    confidence_basis: >
      Explicitly implemented in web/ServiceLocator.java with Collections.synchronizedMap()
      at line 86. Cache usage is consistent across all resource lookup methods
      (lines 109-113, 132-138, 157-161, etc.). This is a significant architectural
      difference from EJB tier that both passes will identify.
    risk_class: operational
    basis: >
      Cache declared at line 70 as private Map. Initialized at line 86 with
      Collections.synchronizedMap(new HashMap()). Caching logic appears in all
      getXxx() methods checking cache before lookup and storing after.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 69
        line_end: 92
        excerpt: |
          private InitialContext ic;
          private Map cache; //used to hold references to EJBHomes/JMS Resources for re-use

          private static ServiceLocator me;

          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          private ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
          }

  - record_key: ORDF-REQ-0017
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      On each JNDI resource lookup in the web tier, the system SHALL first check
      if the resource is already in the cache by JNDI name. If present, SHALL return
      the cached instance without re-querying JNDI.
    confidence: high
    confidence_basis: >
      Caching check-before-lookup pattern is consistently implemented across all
      resource methods in web/ServiceLocator.java. Both passes will observe this
      pattern in every getXxx() method.
    risk_class: operational
    basis: >
      Every method in web/ServiceLocator checks cache.containsKey() before lookup
      and returns cached value if present. Example: lines 109-114 in getLocalHome(),
      lines 132-139 in getRemoteHome(), lines 157-161 in getQueueConnectionFactory().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }

