    confidence: high
    confidence_basis: >
      This pattern is consistently applied across all methods in both implementations.
      Every catch block wraps NamingException and Exception in ServiceLocatorException.
      Both passes will observe this enforced pattern.
    risk_class: operational
    basis: >
      Every method in both ServiceLocator implementations catches NamingException and
      generic Exception, wrapping them in ServiceLocatorException. Example: lines
      87-91 in ejb/ServiceLocator.java.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
