  - record_key: ORDF-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide a Service Locator utility to enable components to look up
      enterprise resources via JNDI without hardcoding resource names.
    confidence: high
    confidence_basis: >
      Both pass A and pass B will encounter this pattern in the source code. The class
      documentation explicitly states it implements the Service Locator pattern for
      looking up resources. This is enforced in both EJB and web tier implementations.
    risk_class: operational
    basis: >
      Class documentation (lines 57-58 of ejb/ServiceLocator.java) states "This class
      is an implementation of the Service Locator pattern. It is used to lookup
      resources such as EJBHomes, JMS Destinations, etc."
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 57
        line_end: 59
        excerpt: |
          /**
           *  This class is an implementation of the Service Locator pattern. It is
           *  used to looukup resources such as EJBHomes, JMS Destinations, etc.
           */
    stack_metadata:
      framework: J2EE
      pattern: Service Locator

