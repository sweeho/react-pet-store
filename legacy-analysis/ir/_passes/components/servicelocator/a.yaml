  - record_key: ORDF-REQ-0004
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support looking up remote EJB homes via JNDI by name and class
      type. The returned remote reference SHALL be narrowed using PortableRemoteObject.narrow()
      to the specified class before being cast to EJBHome.
    confidence: high
    confidence_basis: >
      This is explicitly implemented in both ServiceLocator variants. The narrowing
      pattern is consistent and both passes will find it. This is a J2EE standard
      pattern that both versions enforce identically.
    risk_class: operational
    basis: >
      Method getRemoteHome() takes jndiHomeName and className parameters. Lines 104-106
      in ejb/ServiceLocator.java and lines 135-137 in web/ServiceLocator.java show
      PortableRemoteObject.narrow() being used before casting to EJBHome.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 95
        line_end: 113
        excerpt: |
          /**
           * will get the ejb Remote home factory.
           * clients need to cast to the type of EJBHome they desire
           *
           * @return the EJB Home corresponding to the homeName
           */
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }

