  - record_key: NOTIF-WORKFLOW-0017
    kind: workflow
    capability_key: notifications
    requirement: >
      The email dispatch workflow SHALL follow this sequence: (1) MailerMDB.onMessage() receives a JMS TextMessage containing XML; (2) Mail.fromXML() parses and validates the XML against the DTD; (3) Mail object is extracted from XML; (4) MailHelper.createAndSendMail() is invoked with the address, subject, content, and locale; (5) MailHelper looks up the mail session via JNDI; (6) MimeMessage is constructed, recipients and content set, headers added; (7) Transport.send() transmits the message.
    confidence: high
    confidence_basis: >
      The MailerMDB.onMessage() method implements this exact sequence in order (lines 74-91). Each step is visible in the code flow. The Mail class deserialization, MailHelper invocation, and Transport.send() are all sequenced consistently.
    risk_class: operational
    basis: >
      MailerMDB.java lines 74-91 implement the complete workflow sequence.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 91
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage textMessage = null;
            String xmlMailMessage = null;
            Mail recMail = null;
            try {
              textMessage = (TextMessage)recvMsg;
              xmlMailMessage = textMessage.getText();
              recMail = Mail.fromXML(xmlMailMessage);
              sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
            } catch (MailerAppException me) {
              //throw new EJBException("MailerMDB.onMessage" + me);
              //ignore since user probably forgot to set up mail server
            } catch (XMLDocumentException xde) {
              throw new EJBException("MailerMDB.onMessage" + xde);
            } catch(JMSException je) {
              throw new EJBException("MailerMDB.onMessage" + je);
            }
          }
    stack_metadata:
      ejb.bean: MailerMDB

