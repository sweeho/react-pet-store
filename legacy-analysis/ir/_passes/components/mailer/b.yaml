      The system SHALL process mail messages containing three mandatory XML elements in sequence: Address (recipient email), Subject (message subject), and Content (message body), as defined in the Mail DTD schema.
    confidence: high
    confidence_basis: >
      The Mail.dtd file declares an ordered element structure. The Mail class implements this structure with three private fields and corresponding getters. The MailerMDB.onMessage() method explicitly extracts all three fields in order. Both code and schema evidence are consistent.
    risk_class: operational
    basis: >
      Mail.dtd defines strict element order; Mail.java implements typed fields with getters; MailerMDB validates and extracts each field.
    traces:
