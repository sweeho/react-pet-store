records:
  - record_key: NOTIF-INTEGRATION-0001
    kind: integration
    capability_key: notifications
    requirement: >
      The system SHALL receive email dispatch requests from a JMS Queue via a Message-Driven Bean (MailerMDB) that implements the MessageListener interface.
    confidence: high
    confidence_basis: >
      The MailerMDB class explicitly implements MessageDrivenBean and MessageListener, with the onMessage() method processing javax.jms.Message objects. The ejb-jar.xml declarative configuration specifies message-driven-destination with destination-type Queue. This is enforced at both the code and deployment descriptor level.
    risk_class: operational
    basis: >
      MailerMDB.java implements MessageListener interface; ejb-jar.xml declares message-driven bean with Queue destination-type.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 56
        line_end: 56
        excerpt: |
          public class MailerMDB implements MessageDrivenBean, MessageListener {
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 56
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>MailerMDB</display-name>
            <ejb-name>MailerMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
    stack_metadata:
      ejb.bean: MailerMDB
      jms.queue: true

  - record_key: NOTIF-REQUIREMENT-0002
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL process mail messages that contain three elements: recipient email Address (required), message Subject (required), and message Content (required), in that order.
    confidence: high
    confidence_basis: >
      The Mail.dtd schema explicitly declares the element sequence. The Mail class provides typed getters for each field. The MailerMDB onMessage() method extracts these fields in sequence. All three elements are present in both the schema and the processing logic.
    risk_class: operational
    basis: >
      Mail.dtd defines ELEMENT structure; Mail.java defines private fields and getters; MailerMDB.onMessage extracts address, subject, content fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 59
        line_end: 61
        excerpt: |
          private String address = null;
          private String subject  = null;
          private String content = null;
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 81
        line_end: 82
        excerpt: |
          recMail = Mail.fromXML(xmlMailMessage);
          sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
    stack_metadata:
      db.object: Mail

  - record_key: NOTIF-REQUIREMENT-0003
