    capability_key: notifications
    requirement: >
      When the MailHelper encounters an exception during mail creation or sending, the system SHALL catch the exception, log it to System.err, and throw a MailerAppException with the message "Failure while sending mail".
    confidence: high
    confidence_basis: >
      The catch block in MailHelper.createAndSendMail() explicitly catches all exceptions, prints to System.err, and throws MailerAppException. The error message is hardcoded and always used regardless of the underlying exception type.
    risk_class: operational
    basis: >
      MailHelper.java catch block at lines 86-89 shows exception handling and MailerAppException construction.
    traces:
