  - record_key: NOTIF-REQUIREMENT-0004
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL send emails to the specified recipient email address with the provided subject line and HTML-formatted message content using the J2EE Mail Session resource.
    confidence: high
    confidence_basis: >
      The MailHelper.createAndSendMail() method explicitly uses javax.mail APIs to construct a MimeMessage, set recipients via InternetAddress.parse(), set subject, and send via Transport.send(). The mail session is obtained from JNDI lookup. Content type is hardcoded to "text/html".
    risk_class: operational
    basis: >
      MailHelper.java uses JavaMail APIs (MimeMessage, InternetAddress, Transport.send); sets contentType to "text/html"; looks up mail session via JNDI.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 70
        line_end: 90
        excerpt: |
          public void createAndSendMail(String emailAddress, String subject, String mailContent, Locale locale) throws MailerAppException {
              try {
                  InitialContext ic = new InitialContext();
                  Session session = (Session) ic.lookup(JNDINames.MAIL_SESSION);
              Message msg = new MimeMessage(session);
                  msg.setFrom();
                  msg.setRecipients(Message.RecipientType.TO,
                           InternetAddress.parse(emailAddress, false));
                  msg.setSubject(subject);
                  String contentType = "text/html";
                      StringBuffer sb = new StringBuffer(mailContent);
                    msg.setDataHandler(new DataHandler(
                                        new ByteArrayDataSource(sb.toString(), contentType)));
                  msg.setHeader("X-Mailer", "JavaMailer");
                  msg.setSentDate(new Date());
                  Transport.send(msg);

  - record_key: NOTIF-REQUIREMENT-0005
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL use container-managed transactions with the "Required" transaction attribute for the MailerMDB.onMessage() method, ensuring message processing occurs within a transaction boundary.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor explicitly declares a container-transaction element with trans-attribute "Required" for the MailerMDB.onMessage() method. This is enforced at deployment time and cannot be overridden at runtime. The transaction-type in the bean declaration is also "Container".
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor specifies container-transaction with trans-attribute "Required" for MailerMDB.onMessage(); transaction-type is "Container".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 53
        line_end: 53
        excerpt: |
          <transaction-type>Container</transaction-type>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 70
        line_end: 80
        excerpt: |
          <assembly-descriptor>
            <container-transaction>
              <method>
                <ejb-name>MailerMDB</ejb-name>
                <method-name>onMessage</method-name>
                <method-params>
                  <method-param>javax.jms.Message</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>

