    requirement: >
      The system SHALL accept email messages in XML format conforming to the Mail DTD schema, with DTD public identifier "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN".
    confidence: high
    confidence_basis: >
      The Mail class contains the DTD public ID as a static constant and uses it throughout the fromXML() deserialization methods. The Mail.dtd file is the authoritative schema. Both the Mail class and the DTD are explicitly versioned as 1.0.
    risk_class: operational
    basis: >
      Mail.java defines DTD_PUBLIC_ID constant and uses it in validation; Mail.dtd exists at the specified resource path.
    traces:
