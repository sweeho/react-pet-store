findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
    description: >
      The fromDOM method (lines 154-155) contains a commented-out false value for the Email
      field optional parameter: getContentAsString(child, true /*false*/). The code uses true
      (optional), but the comment suggests false was intended. The DTD declares Email as
      required (line 38), but the implementation treats it as optional. This discrepancy
      suggests either: (1) the schema intent and implementation diverged, or (2) the comment
      represents a known issue that was never resolved. The current implementation permits
      ContactInfo records without email, contrary to the DTD specification.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      The primary key class is declared as java.lang.Object (line 53), which is unusual.
      Typically, EJB entity beans have either an Integer, Long, or a custom compound primary
      key class. Using Object as the primary key class suggests the primary key generation
      strategy and its type are determined by the application server at deployment time. This
      deployment-specific detail is not visible in the source code and should be confirmed
      in the deployment descriptor or documentation.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
