  - record_key: CONT-XML-0001
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      ContactInfo entities SHALL be serializable to DOM (Document Object Model) XML representation
      following the ContactInfo DTD schema, with nested Address serialization.
    confidence: high
    confidence_basis: >
      toDOM() method is implemented in ContactInfo.java (lines 133-141) and creates XML
      elements matching the DTD structure. The method appends the address node via
      address.toDOM(document) (line 137), ensuring proper nested serialization.
    risk_class: operational
    basis: >
      toDOM method in ContactInfo.java (lines 133-141) creates a ContactInfo element and
      appends child elements for each field according to DTD order: FamilyName, GivenName,
      Address, Email, Phone. The Address element is serialized by calling address.toDOM()
      (line 137). Matches DTD (ContactInfo.dtd line 38).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 133
        line_end: 141
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CONTACTINFO);
            XMLDocumentUtils.appendChild(document, root, XML_FAMILY_NAME, familyName);
            XMLDocumentUtils.appendChild(document, root, XML_GIVEN_NAME, givenName);
            root.appendChild(address.toDOM(document));
            XMLDocumentUtils.appendChild(document, root, XML_EMAIL, email);
            XMLDocumentUtils.appendChild(document, root, XML_PHONE, phone);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
