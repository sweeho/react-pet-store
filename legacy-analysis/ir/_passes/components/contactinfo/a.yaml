  - record_key: CONT-REL-0001
    kind: entity
    capability_key: user-accounts
    requirement: >
      ContactInfo entities SHALL maintain a one-to-one relationship with Address entities
      via a container-managed relationship (CMR) field, with cascading delete enabled on the
      Address side.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationships section (lines 126-148) explicitly defines a one-to-one
      relationship between ContactInfoEJB and AddressEJB. The ContactInfoEJB declares a CMR
      field (lines 135-137) and the AddressEJB side has cascade-delete enabled (line 142).
      ContactInfoEJB.java abstract methods (lines 72-73) declare the relationship field.
    risk_class: operational
    basis: >
      Relationship definition in ejb-jar.xml (lines 126-148) declares one-to-one relationship.
      ContactInfoEJB has multiplicity One (line 131) with CMR field "address" (lines 135-137).
      AddressEJB has multiplicity One with cascade-delete (line 142), ensuring related
      addresses are deleted when contact info is deleted.
