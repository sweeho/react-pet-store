  - record_key: CC-REQUIREMENT-0003
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL support serialization and deserialization of credit card
      data to and from XML DOM representation conforming to the CreditCard DTD.
    confidence: high
    confidence_basis: >
      The CreditCard.java class implements two XML serialization methods (toDOM()
      at lines 108-114 and fromDOM() at lines 116-130) with corresponding DTD
      defined in CreditCard.dtd (lines 38-41). Both methods are concrete
      implementations in a production class.
    risk_class: operational
    basis: >
      CreditCard.java defines toDOM() and fromDOM() methods that handle XML
      serialization. The CreditCard.dtd file explicitly defines the XML document
      structure with CreditCard as root element containing CardNumber, CardType,
      and ExpiryDate child elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 114
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CREDITCARD);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
            XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>

  - record_key: CC-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      WHEN extracting the expiry month from the stored expiryDate, the system
      SHALL parse the substring before the "/" character and return it as a
      String. GIVEN expiryDate is null or contains no "/" character, the system
      SHALL return "01".
    confidence: medium
    confidence_basis: >
      The getExpiryMonth() method in CreditCardEJB.java (lines 88-96) implements
      this logic with conditional branches. However, the default value "01" is a
      bare literal with no documentation, configuration, or test visible in the
      source. The logic is enforced in code but the rationale for the default
      is undocumented.
    risk_class: financial
    basis: >
      The getExpiryMonth() method searches for "/" via indexOf(), extracts the
      substring before it, and returns "01" if the date is null or no slash is
      found. This is the only implementation visible; no test cases or
      documentation justify the "01" default.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 96
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }

  - record_key: CC-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      WHEN extracting the expiry year from the stored expiryDate, the system
      SHALL parse the substring after the "/" character and return it as a
      String. GIVEN expiryDate is null or contains no "/" character, the system
      SHALL return "2010".
    confidence: medium
    confidence_basis: >
      The getExpiryYear() method in CreditCardEJB.java (lines 98-107) implements
      this logic with conditional branches. The default year "2010" is a bare
      literal with no documentation or test visible in the source. The logic is
      enforced but the rationale for this specific year is undocumented.
    risk_class: financial
    basis: >
      The getExpiryYear() method searches for "/" via indexOf(), extracts the
      substring after it, and returns "2010" if the date is null or no slash is
      found. This hardcoded default appears to be a placeholder or legacy value
      with no supporting evidence.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 98
        line_end: 107
        excerpt: |
          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }

  - record_key: CC-REQUIREMENT-0004
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL support retrieving a CreditCard value object containing
      the current state of cardNumber, cardType, and expiryDate via the getData()
      method.
    confidence: high
    confidence_basis: >
      The getData() method is declared in the CreditCardLocal interface (line 54)
      and implemented in CreditCardEJB.java (lines 109-115). The implementation
      is straightforward and consistent across both files.
    risk_class: operational
    basis: >
      CreditCardLocal.java declares the getData() method that returns a
      CreditCard object. CreditCardEJB.java implements it by creating a new
      CreditCard instance and populating it with the current field values.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardLocal.java
        line_start: 54
        line_end: 54
        excerpt: |
          public CreditCard getData();
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 109
        line_end: 115
        excerpt: |
          public CreditCard getData() {
            CreditCard creditCard = new CreditCard();
            creditCard.setCardNumber(getCardNumber());
            creditCard.setCardType(getCardType());
            creditCard.setExpiryDate(getExpiryDate());
            return creditCard;
          }

  - record_key: CC-REQUIREMENT-0005
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL require that all credit card operations (creation,
      retrieval, modification, and removal) execute within a transaction context
      with the Required transaction attribute, which creates a new transaction if
      one does not already exist.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor section (lines 83-233) contains
      container-transaction declarations for all relevant methods with
      trans-attribute set to Required. This is declarative, container-enforced
      configuration.
    risk_class: financial
    basis: >
      Every business method in the ejb-jar.xml (lines 84-233) is configured with
      trans-attribute set to Required. This includes create, remove, getter,
      setter, and finder methods. The declarative nature of this configuration
      makes it binding for the EJB container.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 83
        line_end: 93
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CreditCardEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>remove</method-name>
              <method-params>
                <method-param>java.lang.Object</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: CC-REQUIREMENT-0006
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL allow all credit card operations to be accessed without
      role-based authorization checks; access is unchecked and available to all
      callers.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml method-permission element (lines 76-82) uses an unchecked
