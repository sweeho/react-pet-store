    risk_class: financial
    basis: >
      The assembly-descriptor method-permission section contains a single
      unchecked element that applies to all methods (method-name="*") of
      CreditCardEJB. No role-based method-permission entries are present.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 76
        line_end: 82
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>CreditCardEJB</ejb-name>
