records:
  - record_key: CC-ENTITY-0001
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL store credit card information as a persistent entity with
      the following attributes: cardNumber (String), cardType (String), and
      expiryDate (String in MM/YYYY format).
    confidence: high
    confidence_basis: >
      Both the ejb-jar.xml declarative configuration (lines 57-68) and the
      CreditCardEJB.java implementation (lines 50-57) consistently define these
      three CMP fields. CMP fields are enforced by the container and mapped to
      the database schema, making this high-confidence evidence.
    risk_class: financial
    basis: >
      The ejb-jar.xml declares three cmp-field elements for expiryDate, cardType,
      and cardNumber. The CreditCardEJB.java class defines abstract getter and
      setter methods for each field. The CreditCard.java class confirms the field
      structure with private variables and accessor methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 57
        line_end: 68
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>expiryDate</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardType</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardNumber</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
          public abstract String getCardNumber();
          public abstract void setCardNumber(String cardNumber);
          public abstract String getCardType();
          public abstract void setCardType(String cardType);
          public abstract String getExpiryDate();
          public abstract void setExpiryDate(String expiryDate);
    stack_metadata:
      ejb.bean: entity
      cmp_version: "2.x"
      persistence_type: Container

  - record_key: CC-REQUIREMENT-0001
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL support creating credit card instances with three creation
      methods: (a) parameterless, (b) with cardNumber, cardType, and expiryDate
      as String parameters, and (c) with a CreditCard value object parameter.
    confidence: high
    confidence_basis: >
      The CreditCardLocalHome interface explicitly declares three overloaded
      create() methods (lines 45-47). The CreditCardEJB.java implementation
      provides corresponding ejbCreate() methods (lines 62-86) that initialize
      the fields.
    risk_class: financial
    basis: >
      CreditCardLocalHome.java defines three create() method signatures. Each is
      implemented in CreditCardEJB.java with corresponding ejbCreate() and
      ejbPostCreate() methods that initialize the CMP fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardLocalHome.java
        line_start: 45
        line_end: 47
        excerpt: |
          public CreditCardLocal create() throws CreateException;
          public CreditCardLocal create(String cardNumber, String cardType, String expiryDate) throws CreateException;
          public CreditCardLocal create(CreditCard creditCard) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 86
        excerpt: |
          public Object ejbCreate(String cardNumber, String cardType,
                                  String expiryDate) throws CreateException {
                                    setCardNumber(cardNumber);
                                    setCardType(cardType);
                                    setExpiryDate(expiryDate);
                                    return null;
          }
          public void ejbPostCreate(String cardNumber, String cardType,
                                    String expiryDate) throws CreateException { }
          public Object ejbCreate(CreditCard creditCard) throws CreateException {
            setCardNumber(creditCard.getCardNumber());
            setCardType(creditCard.getCardType());
            setExpiryDate(creditCard.getExpiryDate());
            return null;
          }
          public void ejbPostCreate(CreditCard creditCard) throws CreateException { }
          public Object ejbCreate() throws CreateException {
            return null;
          }
          public void ejbPostCreate() throws CreateException { }

