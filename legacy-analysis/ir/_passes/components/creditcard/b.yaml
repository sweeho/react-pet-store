  - record_key: CC-ENTITY-0002
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL store the credit card entity as a Container-Managed
      Persistence (CMP) entity bean version 2.x with non-reentrant semantics.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declaratively specifies persistence-type as "Container",
      cmp-version as "2.x", and reentrant as "False" (lines 52-55). This is
      binding container configuration.
    risk_class: operational
    basis: >
      Lines 52-55 of ejb-jar.xml explicitly declare the persistence model and
      reentrancy constraint. These settings control how the EJB container
      manages the entity bean lifecycle and data persistence.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 52
        line_end: 55
        excerpt: |
          <persistence-type>Container</persistence-type>
          <prim-key-class>java.lang.Object</prim-key-class>
          <reentrant>False</reentrant>
          <cmp-version>2.x</cmp-version>

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      The getExpiryMonth() and getExpiryYear() methods return hardcoded default
      values ("01" and "2010" respectively) when expiryDate is null or does not
      contain a slash. No documentation, configuration, or test cases explain why
      these specific defaults were chosen. A future agent should determine whether
      these are intentional sensible defaults, legacy placeholders, or a contract
      that needs revision.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
    description: >
      The expiryDate field is stored as a String in MM/YYYY format, but no
      validation rules (length, format, allowed values) are visible in the
      declarative configuration (validation.xml not present) or in code. The
      substring parsing in getExpiryMonth/Year assumes "/" is present but does
      not validate the format. A future agent should determine whether client-side
      validation, server-side validation, or a stricter data type (e.g.,
      LocalDate) should be required.
