      findByPrimaryKey(Object key) (line 49). The ejb-jar.xml contains a
      container-transaction configuration for this method with Required attribute
      (lines 143-142), confirming it is a declared operation.
    risk_class: financial
    basis: >
      CreditCardLocalHome.java declares the findByPrimaryKey() method. The
      ejb-jar.xml declaratively configures transactional behavior for this
      method, indicating it is an expected operation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardLocalHome.java
        line_start: 49
        line_end: 49
        excerpt: |
