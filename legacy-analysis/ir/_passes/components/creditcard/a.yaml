  - record_key: PAYPROC-BIZ-0001
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      GIVEN an expiryDate stored as a string, WHEN the system invokes getExpiryMonth()
      or getExpiryYear(), THEN the system SHALL parse the string and extract the
      month (substring before slash) or year (substring after slash), with defaults
      of "01" and "2010" respectively if parsing fails.
    confidence: medium
    confidence_basis: >
      The CreditCardEJB implements getExpiryMonth() and getExpiryYear() by parsing
      the expiryDate string on a "/" delimiter. The defaults (01 and 2010) are
      hardcoded in the implementation. However, no configuration, documentation, or
      test confirms these defaults are intentional rather than placeholder values.
    risk_class: financial
    basis: >
      CreditCardEJB.getExpiryMonth() lines 88-96 search for "/" and return the
      substring before it, or "01" if not found. getExpiryYear() lines 98-107
      return the substring after "/" or "2010" if not found.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }
    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.creditcard.ejb.CreditCardEJB"

  - record_key: PAYPROC-BIZ-0002
