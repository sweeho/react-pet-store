    confidence: high
    confidence_basis: >
      The CreditCardLocalHome interface shows a three-parameter create() method.
      The CreditCardEJB.ejbCreate() method lines 62-68 explicitly implements the
      initialization sequence, setting all three fields from parameters.
    risk_class: financial
    basis: >
      CreditCardEJB declares public Object ejbCreate(String cardNumber, String cardType,
      String expiryDate) which calls setCardNumber(), setCardType(), and setExpiryDate()
      in sequence.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 68
