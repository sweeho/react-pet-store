      and expiryDate values.
    confidence: high
    confidence_basis: >
      The CreditCardLocal interface declares getData() method. The CreditCardEJB
      implements it by instantiating a new CreditCard DTO and populating it from
      the entity's fields.
    risk_class: operational
    basis: >
      CreditCardEJB.getData() lines 109-115 creates a new CreditCard object,
      populates it from the entity's CMP fields, and returns it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 109
        line_end: 115
