            return null;
          }
    stack_metadata:
      ejb.bean: "com.sun.j2ee.blueprints.creditcard.ejb.CreditCardEJB"

  - record_key: PAYPROC-BIZ-0004
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      The system SHALL provide a getData() method that returns a CreditCard data
