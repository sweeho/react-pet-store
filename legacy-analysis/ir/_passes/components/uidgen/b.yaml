records:
  - record_key: UIDGEN-REQ-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL generate unique identifiers by combining a provided prefix
      with an incremented counter value and return the combined string.
    confidence: high
    confidence_basis: >
      The core logic is clearly visible in UniqueIdGeneratorEJB.getUniqueId() which
      delegates to CounterEJB.getNextValue(), and CounterEJB's implementation shows
      the counter is incremented and concatenated with the name prefix. Both Java
      source and declarative configuration (ejb-jar.xml) confirm this behavior is
      the primary business method.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB provides the public business method getUniqueId(String idPrefix)
      which retrieves or creates a Counter entity and calls getNextValue(). CounterEJB
      increments an integer counter field and returns "name + String.valueOf(count)" where
      name is the prefix.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 69
        excerpt: |
          public String getUniqueId(String idPrefix) {
              return getCounter(idPrefix).getNextValue();
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      framework: J2EE EJB 2.0

  - record_key: UIDGEN-REQ-0002
