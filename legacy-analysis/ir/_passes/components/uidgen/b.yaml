  - record_key: UIDGEN-REQ-0006
    kind: requirement
    capability_key: order-placement
    requirement: >
      The UniqueIdGenerator service SHALL be provided as a stateless session bean
      with no stored state, allowing concurrent requests from multiple clients.
    confidence: high
    confidence_basis: >
      ejb-jar.xml explicitly declares session-type=Stateless for UniqueIdGeneratorEJB.
      The implementation in UniqueIdGeneratorEJB contains no instance variables that
      store caller state, only infrastructure references (InitialContext, CounterLocalHome).
    risk_class: operational
    basis: >
      The ejb-jar.xml configuration declares the UniqueIdGeneratorEJB as a stateless
      session bean. The implementation confirms this: it stores only InitialContext
      and Counter home references, not user-specific state.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 71
        line_end: 78
        excerpt: |
          <session>
            <display-name>UniqueIdGeneratorEB</display-name>
            <ejb-name>UniqueIdGeneratorEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 51
        line_end: 63
        excerpt: |
          public class UniqueIdGeneratorEJB implements javax.ejb.SessionBean {

              private  InitialContext ic;
              private  CounterLocalHome clh;

              public void ejbCreate() {
                try {
                  ic = new InitialContext();
                  clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
                } catch (NamingException ne) {
                   throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
                }
              }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      ejb.session.type: Stateless

