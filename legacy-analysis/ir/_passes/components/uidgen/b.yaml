      The system SHALL persist counter values in a persistent store using
      container-managed entity beans with a string primary key (the prefix).
    confidence: high
    confidence_basis: >
      Both Java code and declarative configuration consistently show CounterEJB as
      a CMP entity bean with persistence-type="Container", prim-key-class=String,
      and primkey-field=name. The abstract accessor methods for CMP fields are
      defined in the EJB source.
    risk_class: operational
    basis: >
      CounterEJB is declared in ejb-jar.xml as an entity bean with CMP version 2.x,
      persistence-type="Container", primary key class java.lang.String, and primkey-field "name".
      Abstract methods in CounterEJB.java define getCounter/setCounter and getName/setName
      as CMP fields.
