  - record_key: UIDGEN-BIZ-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The idPrefix parameter for getUniqueId() MUST NOT be null; a null prefix
      results in an exception being thrown (documented in the interface Javadoc).
    confidence: medium
    confidence_basis: >
      The interface Javadoc explicitly states "It must not be null" for the parameter,
      but no programmatic validation code is visible in the implementation. The
      behavior when null is passed would be a NullPointerException from String concatenation,
      which would propagate as an EJBException. This is documented intent without
      explicit enforcement visible in code.
    risk_class: operational
    basis: >
      UniqueIdGeneratorLocal interface includes a Javadoc comment stating the idPrefix
      must not be null. Implementation would fail at runtime if null is passed due to
      string operations in CounterEJB.getNextValue().
    traces:
