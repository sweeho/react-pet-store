  - record_key: UIDGEN-REQ-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL automatically create a new counter entity when a requested
      prefix does not exist; the initial counter value SHALL be 0 before the first
      increment.
    confidence: high
    confidence_basis: >
      The getCounter() private method in UniqueIdGeneratorEJB explicitly catches
      FinderException and calls clh.create(name) in response. CounterEJB.ejbCreate()
      sets the counter to 0 immediately. Both implementations are visible and
      confirmed by the caller's logic.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getCounter() catches FinderException from
      findByPrimaryKey(name) and creates a new counter. CounterEJB.ejbCreate()
      initializes the counter field to 0. The first call to getNextValue() will
      then increment to 1.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 58
        line_end: 62
        excerpt: |
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }
    stack_metadata:
      ejb.bean: CounterEJB

  - record_key: UIDGEN-REQ-0004
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL increment the counter by exactly 1 each time getNextValue()
      is called, before returning the new ID string.
    confidence: high
    confidence_basis: >
      The CounterEJB.getNextValue() method has explicit code that reads the current
      counter, adds 1, stores the result, and returns the string representation of
      the new value. No configuration or alternate paths exist.
    risk_class: operational
    basis: >
      CounterEJB.getNextValue() shows direct integer arithmetic: counter is read,
      1 is added, the result is stored back, and then used to form the return string.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }
    stack_metadata:
      ejb.bean: CounterEJB

  - record_key: UIDGEN-REQ-0005
    kind: business-rule
    capability_key: order-placement
    requirement: >
      All calls to getUniqueId() SHALL execute within a container-managed transaction
      with Required transaction attribute to ensure counter consistency.
    confidence: high
    confidence_basis: >
      ejb-jar.xml explicitly declares container-transaction directives with
      trans-attribute=Required for both the UniqueIdGeneratorEJB.getUniqueId() method
      and the CounterEJB methods (create, getNextValue, remove). The session bean
      also declares transaction-type=Container.
    risk_class: operational
    basis: >
      Container-managed transactions with Required attribute are declared in the
      assembly-descriptor section of ejb-jar.xml, ensuring that each ID generation
      participates in a transaction boundary.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 203
        line_end: 242
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CounterEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>remove</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <container-transaction>
            <method>
              <ejb-name>CounterEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
