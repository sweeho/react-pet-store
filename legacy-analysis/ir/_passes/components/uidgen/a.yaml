  - record_key: ORDP-REQ-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL provide a UniqueIdGenerator stateless session bean service that generates
      unique identifiers by prefixing a sequential counter value with a caller-supplied prefix string.
    confidence: high
    confidence_basis: >
      The UniqueIdGenerator is explicitly declared as a stateless session bean in ejb-jar.xml with
      the business method getUniqueId(String) published via the UniqueIdGeneratorLocal interface.
      The implementation in UniqueIdGeneratorEJB.getUniqueId() is straightforward and deterministic.
    risk_class: operational
    basis: >
      ejb-jar.xml declares UniqueIdGeneratorEJB as a session bean with session-type Stateless.
      UniqueIdGeneratorLocal.java defines the public interface with getUniqueId(String idPrefix) method.
      UniqueIdGeneratorEJB.getUniqueId() (lines 67-68) delegates to a counter's getNextValue() method.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 71
        line_end: 90
        excerpt: |
          <session>
            <display-name>UniqueIdGeneratorEB</display-name>
            <ejb-name>UniqueIdGeneratorEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
            <ejb-local-ref>
              <ejb-ref-name>ejb/Counter</ejb-ref-name>
              <ejb-ref-type>Entity</ejb-ref-type>
              <local-home>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocalHome</local-home>
              <local>com.sun.j2ee.blueprints.uidgen.counter.ejb.CounterLocal</local>
              <ejb-link>CounterEJB</ejb-link>
            </ejb-local-ref>
          </session>
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 69
        excerpt: |
          public String getUniqueId(String idPrefix) {
              return getCounter(idPrefix).getNextValue();
          }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      ejb.session_type: Stateless
      ejb.transaction_type: Container

  - record_key: ORDP-REQ-0002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL accept an idPrefix parameter when requesting a unique identifier.
      The idPrefix MUST NOT be null and SHALL be used to identify and group sequences of generated IDs.
    confidence: high
    confidence_basis: >
      The method signature is defined in the published UniqueIdGeneratorLocal interface
      with documentation explicitly stating the parameter constraint. The parameter is
      consistently used to look up or create the corresponding Counter entity.
    risk_class: operational
    basis: >
      UniqueIdGeneratorLocal.java lines 42-43 documents the parameter: "param idPrefix is the
      prefix needed for each of the counter values. It must not be null." The implementation
      uses this parameter directly in getCounter(idPrefix) to look up the Counter by name.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorLocal.java
        line_start: 40
        line_end: 44
        excerpt: |
          public interface UniqueIdGeneratorLocal extends javax.ejb.EJBLocalObject {

              /** param idPrefix is the prefix needed for each of the counter values. It must not be null. */
              public String getUniqueId(String idPrfix);
          }

  - record_key: ORDP-REQ-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL automatically create a new Counter entity if one does not already exist
      for the given idPrefix. The lookup-or-create pattern MUST use findByPrimaryKey() to check
      existence; if a FinderException is raised (indicating the counter does not exist),
      a new Counter entity SHALL be created with that name.
    confidence: high
    confidence_basis: >
      The lookup-or-create logic is explicitly implemented in UniqueIdGeneratorEJB.getCounter() with
      both branches present in the source code. The try-catch structure clearly handles the FinderException.
      This pattern is deterministic and both passes will observe it.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getCounter() method (lines 74-86) first attempts findByPrimaryKey(name).
      If that raises FinderException, it falls through to create(name). The exception handling shows
      the two-step lookup-or-create pattern.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }
    stack_metadata:
      pattern: lookup-or-create

  - record_key: ORDP-REQ-0004
    kind: requirement
    capability_key: order-placement
    requirement: >
      When a Counter entity is created for a new idPrefix, the system SHALL initialize the counter
      field to 0 (zero), indicating the start of a new ID sequence.
    confidence: high
    confidence_basis: >
      The Counter creation is handled by CounterEJB.ejbCreate() which explicitly sets counter to 0
      before persistence. The method signature is called from the home interface and follows standard
      EJB entity bean lifecycle. This initialization is deterministic.
    risk_class: operational
    basis: >
      CounterEJB.ejbCreate() method (lines 58-62) is invoked when clh.create(name) is called.
      Line 60 explicitly calls setCounter(0), initializing the counter to zero. This is the
      standard EJB create lifecycle hook where initial values are set.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 58
        line_end: 62
        excerpt: |
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }
    stack_metadata:
      ejb.lifecycle: create

  - record_key: ORDP-REQ-0005
    kind: requirement
    capability_key: order-placement
    requirement: >
      Each call to Counter.getNextValue() SHALL increment the counter field by 1 and return
      a String consisting of the concatenation of the Counter's name field with the String
      representation of the newly incremented counter value.
    confidence: high
    confidence_basis: >
      The getNextValue() logic is explicitly implemented in CounterEJB with no ambiguity.
      The increment-then-return pattern is deterministic and will be observed by both passes.
      The String concatenation uses standard Java String.valueOf() and concatenation operator.
    risk_class: operational
    basis: >
      CounterEJB.getNextValue() (lines 67-71) reads the current counter, increments it,
      stores the new value back, and returns getName() + String.valueOf(count). This
      implements the sequence generation business logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 71
        excerpt: |
          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }

