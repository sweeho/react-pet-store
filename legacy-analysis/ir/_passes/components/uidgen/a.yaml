  - record_key: ORDP-REQ-0010
    kind: requirement
    capability_key: order-placement
    requirement: >
      The UniqueIdGenerator service SHALL use JNDI to look up the Counter entity home interface
      at initialization time. The JNDI name SHALL be resolved from the deployment descriptor
      env-entry "java:comp/env/ejb/Counter". If the lookup fails (NamingException or other
      exception), a ServiceLocatorException or EJBException SHALL be raised during bean instantiation.
    confidence: high
    confidence_basis: >
      The JNDI lookup is explicit in UniqueIdGeneratorEJB.ejbCreate() and the lookup name
      matches the deployment descriptor. The exception handling shows both NamingException
      and generic Exception being caught and wrapped.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.ejbCreate() (lines 57-62) performs InitialContext lookup of
      "java:comp/env/ejb/Counter" and caches the CounterLocalHome reference.
      Any NamingException is wrapped in an EJBException. The env reference matches ejb-jar.xml
      line 80 ejb-ref-name.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 56
        line_end: 62
        excerpt: |
          public void ejbCreate() {
            try {
              ic = new InitialContext();
              clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
            } catch (NamingException ne) {
               throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
            }
          }
    stack_metadata:
      jndi.lookup_name: java:comp/env/ejb/Counter

