      ejb-jar.xml declares CounterEJB as an entity bean with persistence-type Container and CMP 2.x.
      Lines 57-64 declare two cmp-field elements: counter and name. Line 65 declares name as primkey-field.
      CounterEJB.java lines 50-54 define abstract accessors for both fields.
