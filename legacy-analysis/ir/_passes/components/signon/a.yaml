  - record_key: USER-ACCOUNTS-WORKFLOW-0001
    kind: workflow
    capability_key: user-accounts
    requirement: >
      GIVEN an unauthenticated user requests a protected resource,
      WHEN the SignOnFilter processes the request,
      THEN the filter SHALL store the requested URL in session attribute 'j_signon_original_url',
      redirect to the sign-on page, and upon successful authentication,
      redirect the user to the originally requested URL.
    confidence: high
    confidence_basis: >
      Workflow is evident from three coordinated code points: (1) storing original URL
      (line 147), (2) sign-on page display on redirect (line 148), (3) retrieval and redirect
      on successful authentication (line 203-204). All layers agree on the flow.
    risk_class: operational
    basis: >
      SignOnFilter stores original URL in ORIGINAL_URL session attribute before forwarding
      to sign-on page. After successful authentication, the stored URL is retrieved and
      used in sendRedirect() call.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 145
        line_end: 151
        excerpt: |
          if (urlPattern.equals(targetURL)) {
              // put the orginal url in the session so others can access
              hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
              config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
              // Jump out of the filter and go to the next page
              return;
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 191
        line_end: 204
        excerpt: |
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              // redirect to the original destination
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
    stack_metadata:
      framework: ServletFilter
      session.scope: HttpSession

