records:
  - record_key: USER-ACCOUNTS-AUTH-0001
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL authenticate a user by accepting a username and password,
      verifying the password matches the stored password for that username, and
      returning success only if both match.
    confidence: high
    confidence_basis: >
      Direct implementation in both declarative and programmatic layers:
      SignOnEJB.authenticate() method (lines 71-78) calls UserLocal.matchPassword()
      which performs direct string equality check (line 89). The ejb-jar.xml declares
      the authenticate method unchecked (lines 235-243), confirming public access.
      No conflicting paths observed.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() method retrieves user by primary key and calls matchPassword.
      UserEJB.matchPassword() performs direct string comparison of the provided password
      against the stored password. FinderException during lookup causes authentication to fail.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
    stack_metadata:
      ejb.bean: SignOnEJB
      ejb.transaction: Required
      framework: EJB2

  - record_key: USER-ACCOUNTS-REG-0001
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL create a new user account when given a username and password,
      enforcing that the username is 25 characters or fewer, the password is less than
      a maximum length, the username does not contain '%' or '*' characters, and throwing
      a CreateException if any constraint is violated.
    confidence: high
    confidence_basis: >
      All constraints are explicitly enforced in UserEJB.ejbCreate() (lines 61-81) with
      dedicated validation blocks for each rule. Declarative layer confirms create method
      exists with transaction Required (lines 255-261). High confidence: rules are
      enforced and reachable from both programmatic and declarative pathways.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() validates username length (lines 64-67), password length (lines 68-71),
      and username character restrictions (lines 72-76), each throwing CreateException with
      specific message if violated. Transaction attribute Required ensures atomicity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 61
        line_end: 81
        excerpt: |
          public String ejbCreate(String userName, String password) throws CreateException {
              // check the input data
              if(userName.length() > UserLocal.MAX_USERID_LENGTH) {
                  throw new CreateException("User ID cant be more than " +
                  UserLocal.MAX_USERID_LENGTH + " chars long");
              }
              if(password.length() > UserLocal.MAX_PASSWD_LENGTH) {
                  throw new CreateException("Password cant be more than " +
                  UserLocal.MAX_PASSWD_LENGTH + " chars long");
              }
              if( (userName.indexOf('%') != -1) ||
              (userName.indexOf('*') != -1) ) {
                  throw new CreateException("User Id cannot " +
                  "have '%' or '*' characters");
              }
              setUserName(userName);
              setPassword(password);
              return null;
          }
    stack_metadata:
      ejb.bean: UserEJB
      ejb.transaction: Required
      framework: EJB2

