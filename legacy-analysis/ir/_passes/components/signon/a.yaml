  - record_key: USER-ACCOUNTS-AUTH-0002
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL enforce session-based authentication wherein a user's authenticated
      status is stored in the HTTP session under the attribute 'j_signon', and subsequent
      requests are allowed to access protected resources only if this session attribute is
      present and set to true.
    confidence: high
    confidence_basis: >
      Declarative session handling in SignOnFilter (lines 125-135) checks session attribute
      on every request, and programmatic session attribute setting on successful authentication
      (lines 193-201). This is the core authorization mechanism. Both reads and writes of the
      session attribute are consistent.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter() checks session attribute 'j_signon' (line 126) to determine
      if user is authenticated. On successful authenticate() call (line 191), the filter
      sets this attribute to Boolean.TRUE (line 201). Protected resources are defined in
      signon-config.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 125
        line_end: 135
        excerpt: |
          // check if the user is signed on
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          // jump to the resource if signed on
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 191
        line_end: 201
        excerpt: |
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
    stack_metadata:
      framework: ServletFilter
      session.scope: HttpSession

  - record_key: USER-ACCOUNTS-PROTECTED-0001
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL define protected resources that require authentication.
      When an unauthenticated user attempts to access a protected resource, the system
      SHALL redirect to a sign-on login page and store the original requested URL in
      the session for post-login redirection.
    confidence: high
    confidence_basis: >
      Protected resources are declared in signon-config.xml with specific URL patterns
      (customer.screen, customer.do, enter_order_information.screen, signon_welcome.screen).
      SignOnFilter enforces this by redirecting unauthenticated access to sign-on page
      (lines 145-151) and storing original URL. Both declarative and programmatic layers agree.
    risk_class: operational
    basis: >
      signon-config.xml defines security-constraint elements with url-pattern values.
      SignOnFilter.doFilter() checks URL pattern against protectedResources HashMap
      and redirects to sign-on page, storing the original URL in ORIGINAL_URL session attribute.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 50
        line_end: 80
        excerpt: |
          <!-- A Protected Resource-->
          <security-constraint>
            <web-resource-collection>
             <web-resource-name>Customer Screen</web-resource-name>
             <url-pattern>customer.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <!-- A Protected Resource-->
          <security-constraint>
            <web-resource-collection>
             <web-resource-name>Customer Action</web-resource-name>
             <url-pattern>customer.do</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <!-- A Protected Resource-->
          <security-constraint>
            <web-resource-collection>
             <web-resource-name>Enter Order Information Screen</web-resource-name>
             <url-pattern>enter_order_information.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>

          <!-- A Protected Resource-->
          <security-constraint>
            <web-resource-collection>
             <web-resource-name>Sign On Welcome SCreen</web-resource-name>
             <url-pattern>signon_welcome.screen</url-pattern>
            </web-resource-collection>
          </security-constraint>
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 136
        line_end: 151
        excerpt: |
          // find out if the patterns match the target URL
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();

              // now check agains the targetURL
              if (urlPattern.equals(targetURL)) {
                  // put the orginal url in the session so others can access
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  // Jump out of the filter and go to the next page
                  return;
              }
          }
    stack_metadata:
      framework: ServletFilter
      session.scope: HttpSession

  - record_key: USER-ACCOUNTS-PERSIST-0001
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      The system MAY optionally persist a username in a cookie named 'bp_signon' when
      the user checks the "Remember My User Name" checkbox. The cookie SHALL be set to
      expire after one month (2678400 seconds).
    confidence: high
    confidence_basis: >
      Cookie handling is explicit in SignOnFilter.validateSignOn() (lines 166-186).
      The logic is clear and unambiguous. MaxAge is set to 2678400 seconds. Only one source
      but the implementation is straightforward.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() reads REMEMBER_USERNAME parameter and if present,
      creates a cookie with username value and MaxAge of 2678400 (approximately 31 days).
      If not checked, existing cookie is removed by setting MaxAge to 0.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          // check if the user wants userName set in cookie
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }
    stack_metadata:
      framework: ServletFilter
      session.scope: HttpSession

