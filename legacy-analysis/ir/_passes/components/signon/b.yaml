    confidence: medium
    confidence_basis: >
      CreateUserServlet.doPost() handles the registration form submission and calls
      signOn.createUser(). The EJB layer throws CreateException (including
      DuplicateKeyException import suggests this), but the servlet-side error handling
      path is partially redacted and cannot be fully verified.
    risk_class: operational
    basis: >
      CreateUserServlet receives form parameters j_username and j_password, calls
      getSignOnEjb().createUser(), catches CreateException, and redirects to
      user_creation_error.jsp on failure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 59
        line_end: 75
        excerpt: |
          public void doPost(HttpServletRequest request, HttpServletResponse response)
              throws IOException, ServletException {
              String userName = request.getParameter(SignOnFilter.FORM_USER_NAME);
              String password = request.getParameter(SignOnFilter.FORM_PASSWORD);
              System.out.println("CreateUserServlet create user: username=" + userName);
              // ...redacted...
              try {
                  SignOnLocal signOn = getSignOnEjb();
                  signOn.createUser(userName, password);
                  String targetURL = "signon_welcome.screen";
                  response.sendRedirect(targetURL);
              } catch (CreateException ce) {
                  System.out.println("CreateUserServlet:: redirecting to user creation error");
                  response.sendRedirect("user_creation_error.jsp");
              }
          }
