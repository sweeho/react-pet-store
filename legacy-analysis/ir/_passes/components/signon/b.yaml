records:
  - record_key: AUTH-REQ-0001
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL authenticate a user by validating supplied username and password
      against stored user credentials and return authentication success or failure.
    confidence: high
    confidence_basis: >
      The authenticate() method is implemented in SignOnEJB (both passes A and B would
      see this), the method signature is declared in the interface, invoked from the filter,
      and is subject to container-managed transactions. Authentication succeeds only when
      both username matches an existing user and the password comparison returns true.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() implementation finds user by username and calls
      matchPassword() for comparison. SignOnFilter invokes this during the validation flow.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 188
        line_end: 210
        excerpt: |
          SignOnLocal signOn = getSignOnEjb();
          boolean authenticated = signOn.authenticate(userName, password);
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              // redirect to the original destination
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
              return;
          } else {
              hres.sendRedirect(signOnErrorPage);
              return;
          }
    stack_metadata:
      ejb.bean: SignOnEJB
      ejb.transaction: Required

  - record_key: AUTH-REQ-0002
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL protect access to designated resources by intercepting requests,
      checking if the user is authenticated (session attribute j_signon == true),
      and redirecting unauthenticated users to the sign-in page.
    confidence: high
    confidence_basis: >
      The filter pattern is explicitly implemented in SignOnFilter.doFilter() which
      checks session state on every request. The configuration mechanism is declarative
      (signon-config.xml) which provides high confidence. Both passes would observe the
      same filter and configuration loading logic.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter() checks if session attribute SIGNED_ON_USER (j_signon) is true.
      If false or missing, it loads protected resource patterns from signon-config.xml via
      SignOnDAO and redirects matching URLs to the sign-on page.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 108
        line_end: 155
        excerpt: |
          public void doFilter(ServletRequest request, ServletResponse response, FilterChain chain)
              throws IOException, ServletException {
              HttpServletRequest hreq = (HttpServletRequest)request;
              String currentURI = hreq.getRequestURL().toString();
              String currentURL = hreq.getRequestURI();
              // get everything after the context root
              int firstSlash = currentURL.indexOf("/",1);
              String targetURL = null;
              if (firstSlash != -1) targetURL = currentURL.substring(firstSlash + 1, currentURL.length());

              if ((targetURL != null) && targetURL.equals(FORM_SIGNON_URL)) {
                  validateSignOn(request, response, chain);
                  return;
              }

              // check if the user is signed on
              boolean signedOn = false;
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
              } else {
                  hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
              }
              // jump to the resource if signed on
              if (signedOn) {
                  chain.doFilter(request,response);
                  return;
              }
              // find out if the patterns match the target URL
              Iterator it = null;
              if (protectedResources != null) it = protectedResources.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String protectedName = (String)it.next();
                  ProtectedResource resource = (ProtectedResource)protectedResources.get(protectedName);
                  String urlPattern = resource.getURLPattern();
                  // now check against the targetURL
                  if (urlPattern.equals(targetURL)) {
                      hreq.getSession().setAttribute(ORIGINAL_URL, targetURL);
                      config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                      return;
                  }
              }
              // No matches if we made it to here
              chain.doFilter(request,response);
          }
    stack_metadata:
      framework: Servlet Filter

  - record_key: AUTH-REQ-0003
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL create new user accounts with username and password, enforcing
      that usernames do not exceed 25 characters and do not contain '%' or '*' characters.
    confidence: high
    confidence_basis: >
      UserEJB.ejbCreate() explicitly validates these constraints with thrown CreateExceptions
      with descriptive messages. The validation is enforced at the EJB layer. The constant
      MAX_USERID_LENGTH is declared in UserLocal interface.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() checks username length against UserLocal.MAX_USERID_LENGTH (25)
      and checks for disallowed characters using indexOf(). Violations result in
      CreateException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 61
        line_end: 81
        excerpt: |
          public String ejbCreate(String userName, String password) throws CreateException {
              // check the input data
              if(userName.length() > UserLocal.MAX_USERID_LENGTH) {
                  throw new CreateException("User ID cant be more than " +
                  UserLocal.MAX_USERID_LENGTH + " chars long");
              }
              if(password.length() > UserLocal.MAX_PASSWD_LENGTH) {
                  throw new CreateException("Password cant be more than " +
                  UserLocal.MAX_PASSWD_LENGTH + " chars long");
              }
              if( (userName.indexOf('%') != -1) ||
              (userName.indexOf('*') != -1) ) {
                  throw new CreateException("User Id cannot " +
                  "have '%' or '*' characters");
              }
              setUserName(userName);
              setPassword(password);
              return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserLocal.java
        line_start: 46
        line_end: 47
        excerpt: |
          public static final int MAX_USERID_LENGTH = 25;
    stack_metadata:
      ejb.bean: UserEJB

