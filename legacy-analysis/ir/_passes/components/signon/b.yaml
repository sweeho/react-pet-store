  - record_key: WFLOW-0002
    kind: workflow
    capability_key: user-accounts
    requirement: >
      GIVEN a user submits the sign-on form with username and password to j_signon_check,
      WHEN SignOnFilter.validateSignOn() is called,
      THEN the system invokes SignOnEJB.authenticate(), and on success sets session
      attributes j_signon=true and j_signon_username=<username>, then redirects to
      the original requested URL. On failure, the user is redirected to the error page.
    confidence: high
    confidence_basis: >
      The entire workflow is explicitly implemented in SignOnFilter.validateSignOn()
      with clear success and failure paths. Both passes would observe identical logic.
    risk_class: operational
    basis: >
      SignOnFilter intercepts requests to j_signon_check, extracts username and password
      from request parameters, calls SignOnEJB.authenticate(), and branches on result.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 157
        line_end: 210
        excerpt: |
          public void validateSignOn(ServletRequest request, ServletResponse response, FilterChain chain)
              throws IOException, ServletException {
              HttpServletRequest hreq = (HttpServletRequest)request;
              HttpServletResponse hres = (HttpServletResponse)response;
              String userName = hreq.getParameter(FORM_USER_NAME);
              String password = hreq.getParameter(FORM_PASSWORD);
              String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
              // ... remember me handling ...
              SignOnLocal signOn = getSignOnEjb();
              boolean authenticated = signOn.authenticate(userName, password);
              if (authenticated) {
                  // place session attributes
                  hreq.getSession().setAttribute(USER_NAME, userName);
                  hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
                  String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
                  hres.sendRedirect(targetURL);
                  return;
              } else {
                  hres.sendRedirect(signOnErrorPage);
                  return;
              }
          }
    stack_metadata:
      framework: Servlet Filter

