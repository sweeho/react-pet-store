  - record_key: CONFIG-0001
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      Protected resources and their URL patterns SHALL be configured externally in
      /WEB-INF/signon-config.xml, including mappings of URL patterns to resource names
      and optional role-based auth constraints.
    confidence: high
    confidence_basis: >
      SignOnDAO explicitly loads and parses signon-config.xml on filter initialization.
      The declarative approach and XML schema are both visible. The configuration is
      loaded once at startup.
    risk_class: operational
    basis: >
      SignOnFilter.init() calls SignOnDAO(protectedResourcesURL) which parses the XML
      file and extracts security-constraint elements, each containing a
      web-resource-collection with URL patterns and optional auth-constraint/role-name
      elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 88
        line_end: 102
        excerpt: |
          public void init(FilterConfig config) throws ServletException {
