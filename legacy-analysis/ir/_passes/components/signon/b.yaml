  - record_key: SESSION-REQ-0002
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL allow users to opt-in to a "Remember My User Name" feature that
      stores their username in a persistent cookie, valid for 30 days, to pre-fill the
      username field on subsequent visits.
    confidence: high
    confidence_basis: >
      The cookie logic is explicitly implemented in SignOnFilter.validateSignOn() with
      hardcoded 30-day TTL (2678400 seconds). The cookie name is defined as a constant
      and is consistently used.
    risk_class: presentational
    basis: >
      SignOnFilter checks for j_remember_username parameter. If present, a cookie named
      bp_signon is created with the username value and MaxAge set to 2678400 seconds
      (30 days). On the login form, the cookie is checked and used to pre-fill the
      username field.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 79
        line_end: 79
        excerpt: |
          public static final String COOKIE_NAME = "bp_signon";
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/signon.jsp
        line_start: 66
        line_end: 73
        excerpt: |
