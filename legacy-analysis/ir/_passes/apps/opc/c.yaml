  - record_key: NOTIF-RULE-0009
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL support optional email notifications for customer events. WHEN
      MailInvoiceMDB receives an invoice message, the system MAY send an invoice confirmation
      email to the customer, contingent on the param/SendConfirmationMail configuration flag
      being set to true at bean creation. WHEN the flag is false, the system SHALL skip email
      generation and do NOT process the message.
    confidence: high
    confidence_basis: >
      MailInvoiceMDB.ejbCreate() (line 97) retrieves sendConfirmationMail flag from JNDI
      JNDINames.SEND_CONFIRMATION_MAIL. MailInvoiceMDB.onMessage() (lines 127-130) checks
      the flag before calling doWork() and doTransition(). If false, the entire message is
      skipped. The env-entry declaration in ejb-jar.xml (lines 414-418) specifies the flag is
      a Boolean type loaded at deployment.
    risk_class: operational
    basis: >
      MailInvoiceMDB is a message-driven bean (ejb-jar.xml lines 405-489) that listens to a
      Topic (line 412). In ejbCreate() (lines 94-114), it loads the sendConfirmationMail boolean
      from JNDI (line 97). In onMessage() (lines 121-142), it receives a TextMessage (line 125),
      extracts the XML text (line 126), then checks "if (sendConfirmationMail)" (line 127). Only
      if true does it call doWork() (line 128) and doTransition() (line 129).
