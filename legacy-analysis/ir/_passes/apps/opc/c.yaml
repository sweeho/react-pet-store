  - record_key: OFULFILL-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order is received and auto-approval evaluation occurs,
      WHEN the order locale is US AND total price is strictly less than 500,
      THEN the order SHALL be automatically approved. WHEN the order locale is JAPAN
      AND total price is strictly less than 50000, THEN the order SHALL be automatically
      approved. OTHERWISE the order SHALL remain in PENDING status awaiting manual approval.
    confidence: high
    confidence_basis: >
      The auto-approval logic is explicitly implemented in PurchaseOrderMDB.canIApprove()
      method (lines 183-191) with hard-coded thresholds and locale checks. The method is
      called on every order (line 158) before creating the approval message. No configuration
      mechanism or comment suggesting flexibility exists; the thresholds are bare literals.
    risk_class: operational
    basis: >
      PurchaseOrderMDB.doWork() (line 158) calls canIApprove() which checks locale via
      purchaseOrder.getLocale() (line 184) and compares getTotalPrice() (lines 186, 188)
      against literal thresholds 500 and 50000. If true, an OrderApproval is created with
      APPROVED status (line 159) and returned as XML (line 162).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
            if(canIApprove(purchaseOrder)) {
              ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
              OrderApproval oa = new OrderApproval();
              oa.addOrder(co);
              ret = oa.toXML();
            }
            return ret;
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Required
      threshold_literal_us: 500
      threshold_literal_japan: 50000

  - record_key: OFULFILL-RULE-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN OrderApprovalMDB processes an OrderApproval message, THEN for each order in the
      message, the system SHALL check its current status. GIVEN an order status is NOT PENDING,
      THEN the order SHALL be skipped and NOT re-processed. GIVEN an order status IS PENDING,
      THEN update the status to the new status (APPROVED or DENIED) and if the new status is
      APPROVED, generate a supplier purchase order and add it to the list to be sent to the
      supplier.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB.doWork() implements status-check logic (lines 204-207) that explicitly
      skips non-PENDING orders. For PENDING orders, it updates status (line 216) then checks
      if APPROVED (line 219) before generating supplier PO. The logic is in production code path
      with no conditional compilation or feature flags.
    risk_class: operational
    basis: >
      OrderApprovalMDB processes a batch of ChangedOrder objects from the incoming OrderApproval
      message (lines 196-224). For each order, it calls processManager.getStatus() (line 204),
      compares to PENDING (line 205), and skips if not equal (line 206). Only PENDING orders
      proceed to status update (line 216) and the if-check for APPROVED (line 219).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      ejb.transaction: Required
      idempotency_pattern: status_check_before_update

  - record_key: OFULFILL-RULE-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN InvoiceMDB receives a supplier invoice, THEN invoke PurchaseOrderHelper.processInvoice()
      to determine if all line items for the order have been shipped (orderDone condition).
      GIVEN all items are shipped (orderDone = true), THEN update order status to COMPLETED
      and trigger transition to send completion notification. GIVEN items remain unshipped
      (orderDone = false), THEN update status to SHIPPED_PART and do NOT trigger notification.
    confidence: high
    confidence_basis: >
      InvoiceMDB.doWork() (lines 157-173) explicitly implements the two-path logic. Line 162
      calls poHelper.processInvoice() which returns a boolean orderDone. Lines 166-171 branch
      on orderDone: true -> COMPLETED + transition, false -> SHIPPED_PART + no transition.
      The comment (lines 108-114) states the exact behavior.
    risk_class: operational
    basis: >
      InvoiceMDB.doWork() deserializes the invoice XML (line 160), retrieves the PurchaseOrder
      (line 161), and calls PurchaseOrderHelper.processInvoice() (line 162) passing the order
      and line item IDs. The boolean result is checked: if true, status becomes COMPLETED
      (line 167); if false, status becomes SHIPPED_PART (line 170). Only when orderDone is true
      does doTransition() get called (line 128).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 108
        line_end: 139
        excerpt: |
          /**
           * InvoiceMDB receives a JMS message containing an Invoice
           * for a user order. If all the order items have been shipped
           * for the order, it updates the purchase order status to
           * COMPLETED to end the purchase order fulfillment process.
           * If the order is not yet all shipped, it updates the order
           * status based on the invoice.
           */
          public void onMessage(Message recvMsg) {
            ...
            String joinMessage = doWork(recdText);
            if (joinMessage != null) {
              doTransition(joinMessage);
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      ejb.transaction: Required
      jms.queue: jms/opc/InvoiceTopic
      join_condition_pattern: true

