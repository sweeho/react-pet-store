records:
  - record_key: OFULFILL-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL implement an asynchronous message-driven bean workflow where
      purchase orders flow through approval, supplier order generation, invoice processing,
      and status tracking. GIVEN a purchase order is received, WHEN PurchaseOrderMDB
      processes it and determines auto-approval criteria, THEN either directly transition
      to OrderApprovalMDB (auto-approved) OR await administrator approval (manual approval).
      WHEN OrderApprovalMDB receives approvals, THEN send supplier purchase orders to
      suppliers and order status notifications to customer relations. WHEN InvoiceMDB
      receives supplier invoices, THEN update order status and trigger completion
      notifications if all items are shipped.
    confidence: high
    confidence_basis: >
      Six message-driven beans are declared with explicit descriptions and transaction
      semantics in ejb-jar.xml (lines 50-651). Java source code confirms the workflow
      stages: PurchaseOrderMDB.onMessage() (lines 114-136) receives orders; OrderApprovalMDB
      .onMessage() (lines 146-165) processes approvals and delegates to transition; InvoiceMDB
      .onMessage() (lines 118-139) handles invoices. Container transaction attributes Required
      (ejb-jar.xml lines 708-773) enforce atomicity. The workflow is explicitly orchestrated
      through JMS message passing between MDB queues and topics.
    risk_class: operational
    basis: >
      The workflow is implemented as a chain of JMS message-driven beans. PurchaseOrderMDB
      receives TextMessages from a Queue (ejb-jar.xml line 118), creates PurchaseOrder EJBs,
      and conditionally sends OrderApproval messages to OrderApprovalMDB queue (line 193).
      OrderApprovalMDB (message-driven-destination Queue at line 305) processes approvals,
      updates status via ProcessManager, generates supplier POs (lines 219-223), and sends
      to both supplier queue (line 394) and mail queue (line 390). InvoiceMDB (message-driven
      -destination Topic at line 210) receives invoices and updates status to COMPLETED or
      SHIPPED_PART (InvoiceMDB.java lines 166-171), triggering transition to MailCompletedOrderMDB
      queue (ejb-jar.xml line 290).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 111
        line_end: 120
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>PurchaseOrderMDB</display-name>
            <ejb-name>PurchaseOrderMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.PurchaseOrderMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 104
        line_end: 136
        excerpt: |
          /**
           * Process a purchase order that was placed at the Java Pet Store
           * It creates the PuchaseOrder EJB for the order, and then for small
           * orders directly approves the order and sends the approval to the
           * OrderApproval MDB queue, but for larger orders, it jst puts them
           * in the PurchaseOrder EJB, and the workflow process just waits for
           * the Administrator to appove or deny the orders.
           */
          public void onMessage(Message recvMsg) {
            ...
            approval = doWork(recdText);
            if(approval != null) {
