  - record_key: OFULFILL-RULE-0010
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      All message-driven bean onMessage() method invocations SHALL be executed with container-managed
      transactions using the Required transaction attribute. This ensures that message processing,
      database updates, and JMS message sends within each MDB are atomic—either all succeed or all
      are rolled back together.
    confidence: high
    confidence_basis: >
      ejb-jar.xml assembly-descriptor (lines 708-773) declares container-transaction with
      trans-attribute=Required for onMessage() methods of all six MDBs: PurchaseOrderMDB (line 716),
      OrderApprovalMDB (line 727), InvoiceMDB (line 738), MailInvoiceMDB (line 750),
      MailOrderApprovalMDB (line 761), MailCompletedOrderMDB (line 772). All MDB declarations
      (lines 111-651) specify transaction-type=Container.
    risk_class: financial
    basis: >
      Every MDB entry in ejb-jar.xml declares transaction-type=Container (lines 116, 207, 303,
      410, 500, 586). The assembly-descriptor container-transaction elements (lines 708-773) map
      each onMessage() method to Required trans-attribute. Container-managed transactions with
      Required semantics automatically enlist all database and JMS operations in a transaction context
      and roll back all changes if any operation fails.
