findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The auto-approval thresholds (500 for US locale, 50000 for Japan locale) are hard-coded
      as bare literals (lines 186, 188) with no configuration mechanism, comments explaining
      their origin, or tests validating them. The method comment (lines 105-110) states the
      feature is for demonstration purposes ("Just a stub for converting currency...so that
      smaller orders can flow through the system without having to fire up the admin Gui").
      It is unclear whether these thresholds are permanent business requirements or demo-only
      values intended for testing the workflow.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
    description: >
      InvoiceMDB.doWork() (line 162) delegates the determination of the "all items shipped"
      condition to PurchaseOrderHelper.processInvoice(), which is not defined in this module
      (import suggests it is in com.sun.j2ee.blueprints.purchaseorder.ejb). The exact logic
      for evaluating orderDone and what constitutes "all items shipped" cannot be analyzed from
      the OPC module code alone. If that logic has edge cases or evolves, the behavior here
      cannot be verified independently.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
    description: >
      OrderApprovalMDB.ejbCreate() (lines 122-124) loads a TransitionDelegate implementation
      class name from JNDI (JNDINames.TRANSITION_DELEGATE_ORDER_APPROVAL) and instantiates it
      via TransitionDelegateFactory.getTransitionDelegate(). The actual transition behavior
      (what queues are written to, what transformations occur) depends on the runtime-loaded
      implementation and cannot be determined from source code alone. The env-entry value is
      redacted in the artifact.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
    description: >
      Lines 144-146 use deprecated Java Date methods (getMonth(), getDate(), getYear()) to
      format order dates. These methods have known issues: getMonth() returns 0-indexed month,
      getYear() returns year-1900, and behavior is locale-dependent. The formatted string is
      intended to be MM/DD/YYYY but may produce incorrect output on certain dates or in certain
      JVMs. This is a code defect; however, the requirement (format date as MM/DD/YYYY) is clear.
