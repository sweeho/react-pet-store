  - record_key: invoice-processing-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process supplier invoices to update order fulfillment status.
      GIVEN a supplier invoice indicating shipped items, WHEN all line items have been
      shipped (join condition met), THEN mark order as COMPLETED and trigger customer
      notification; OTHERWISE mark order as SHIPPED_PART and await further invoices.
    confidence: high
    confidence_basis: >
      InvoiceMDB.doWork() implements this logic with a processInvoice helper that determines
      whether all items are shipped (orderDone flag). The status update is enforced at
      lines 166-171. The join condition (all items shipped) is evaluated consistently.
    risk_class: operational
    basis: >
      InvoiceMDB.onMessage() (lines 118-139) receives invoice, calls doWork() which invokes
      PurchaseOrderHelper.processInvoice() to evaluate completion. Lines 166-171 show
      status is updated to COMPLETED or SHIPPED_PART based on orderDone flag. Only
      COMPLETED orders trigger transition to customer relations (line 127 check).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

            //update process manager if this order is completely done, or partially done
            //for this purchase order
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      ejb.transaction: Required
      jms.queue: jms/opc/InvoiceTopic

