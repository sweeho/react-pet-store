  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
    description: >
      Line 145-146 uses Date.getMonth(), Date.getDate(), Date.getYear() which are
      deprecated in Java and can produce incorrect results (getYear() returns year-1900,
      getMonth() is 0-indexed). The format produced is intended to be MM/DD/YYYY but
      the actual output may differ on some dates. This is a defect in the implementation
      but the requirement (date formatted as MM/DD/YYYY) is clear.
