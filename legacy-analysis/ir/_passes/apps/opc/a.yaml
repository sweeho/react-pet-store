  - record_key: OFULFILL-RULE-0012
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      All message-driven bean onMessage() operations SHALL be executed with
      container-managed transactions using the Required transaction attribute,
      ensuring that message processing and order state updates occur atomically.
    confidence: high
    confidence_basis: >
      ejb-jar.xml assembly-descriptor (lines 708-773) declares container-transaction
      with trans-attribute=Required for onMessage() methods of all six MDBs
      (PurchaseOrderMDB line 716, OrderApprovalMDB line 727, InvoiceMDB line 738,
      MailInvoiceMDB line 750, MailOrderApprovalMDB line 761, MailCompletedOrderMDB
      line 772). All MDBs are declared with transaction-type=Container.
    risk_class: financial
    basis: >
      Each MDB declaration in ejb-jar.xml specifies transaction-type=Container
      (lines 116, 207, 303, 410, 500, 586). The assembly-descriptor specifies
      Required semantics for each onMessage() method, meaning the container will
      enlist all database and JMS operations in a single transaction, rolling back
      all changes if any step fails.
