records:
  - record_key: OFULFILL-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL implement an asynchronous order fulfillment workflow
      where purchase orders from customers flow through approval (auto-approval
      for small orders, manual approval for large orders), supplier purchase
      order generation, invoice reception, and order completion status tracking.
    confidence: high
    confidence_basis: >
      Multi-source evidence: EJB configuration declares six message-driven beans
      with explicit business purpose comments in ejb-jar.xml (lines 44-100, 202-295);
      source code comments in MDB classes confirm the workflow stages and transitions
      (PurchaseOrderMDB lines 105-126, OrderApprovalMDB lines 139-149, InvoiceMDB lines
      108-139); transition delegates send messages to explicit queue destinations
      confirming handoffs (PurchaseOrderTD line 67, OrderApprovalTD lines 70-71);
      container transaction attributes (Required) enforce atomicity at each stage.
    risk_class: operational
    basis: >
      The workflow is orchestrated through message-driven beans processing JMS messages
      in sequence. PurchaseOrderMDB receives orders, makes auto/manual approval decision,
      and sends to OrderApprovalMDB queue. OrderApprovalMDB processes approvals and sends
      both supplier POs and customer notifications. InvoiceMDB receives supplier invoices
      and marks orders completed. Each MDB has a TransitionDelegate that sends the next
      message in the workflow chain (PurchaseOrderTD.doTransition line 78-87, OrderApprovalTD
      lines 86-105, InvoiceTD lines 79-86).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 43
        line_end: 47
        excerpt: |
          <ejb-jar>
            <description>order process controller</description>
            <display-name>OrderProcessingCenterJAR</display-name>
            <enterprise-beans>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 111
        line_end: 198
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>PurchaseOrderMDB</display-name>
          </message-driven>
          (+ InvoiceMDB, OrderApprovalMDB + customer relations MDBs)
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 104
        line_end: 136
        excerpt: |
          public void onMessage(Message recvMsg) {
            // Process a purchase order that was placed at the Java Pet Store
            // It creates the PuchaseOrder EJB for the order, and then for small
            // orders directly approves the order and sends the approval to the
            // OrderApproval MDB queue, but for larger orders, it jst puts them
            // in the PurchaseOrder EJB, and the workflow process just waits for
            // the Administrator to appove or deny the orders.
    stack_metadata:
      framework: ejb
      message_driven: true
      transaction_model: jms_queue_topic
      mdb_count: 6

  - record_key: OFULFILL-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order with total value below a threshold, WHEN the
      PurchaseOrderMDB processes it, THEN the order SHALL be automatically
      approved and an OrderApproval message SHALL be sent to the OrderApprovalMDB
      queue. GIVEN a purchase order with total value at or above the threshold,
      THEN the order SHALL be placed in pending status and the workflow SHALL wait
      for administrator approval.
    confidence: medium
    confidence_basis: >
      Code comment in PurchaseOrderMDB states the logic (lines 104-110) and onMessage
      implementation calls doWork() which makes approval decision (line 121) and
      conditionally calls doTransition() (lines 124-126). However, the threshold value
      is not visible in the source excerpt provided - only the conditional logic is
      clear. The actual threshold constant or configuration is likely in doWork() method
      which was not read (line 150+ indicated by truncation).
    risk_class: operational
    basis: >
      PurchaseOrderMDB.onMessage() processes each incoming order. Line 121 calls
      doWork(recdText) which returns an approval string. Lines 124-126 show conditional:
      if approval is not null, doTransition(approval) is called, otherwise no transition
      occurs (workflow waits). The comment at lines 105-110 explains: small orders are
      approved automatically, large orders wait for admin. The threshold determining
      "small" vs "large" is evaluated in doWork() but was not visible in the excerpt limit.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 104
        line_end: 127
        excerpt: |
          /**
           * Process a purchase order that was placed at the Java Pet Store
           * It creates the PuchaseOrder EJB for the order, and then for small
           * orders directly approves the order and sends the approval to the
           * OrderApproval MDB queue, but for larger orders, it jst puts them
           * in the PurchaseOrder EJB, and the workflow process just waits for
           * the Administrator to appove or deny the orders.
           */
          public void onMessage(Message recvMsg) {
            TextMessage recdTM = null;
            String recdText = null;
            String approval = null;
            try {
              recdTM = (TextMessage)recvMsg;
              recdText = recdTM.getText();
              approval = doWork(recdText);
              if(approval != null) {
                doTransition(approval);
              }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      mdb_destination_type: queue

  - record_key: OFULFILL-RULE-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN OrderApprovalMDB receives an OrderApproval message containing a batch
      of approved orders, THEN for each approved order a supplier purchase order
      SHALL be generated and sent to the supplier. Simultaneously, a single batch
      message containing all order approval/denial status notices SHALL be sent to
      customer relations for email notification.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB source code explicitly implements this rule. The doWork() is called
      (not fully visible), but doTransition() receives a WorkResult containing both
      supplierPoList (ArrayList) and xmlMailOrderApprovals (String). The transition
      delegate loops over supplierPoList sending each PO to supplier queue (OrderApprovalTD
      lines 92-97) and then calls sendMail with the batch notification (line 100).
      Declarative evidence also supports: ejb-jar.xml OrderApprovalMDB has references to
      both jms/PurchaseOrderQueue and jms/OrderApprovalMailQueue.
    risk_class: operational
    basis: >
      OrderApprovalMDB.onMessage() receives an order approval message, calls doWork()
      which returns a WorkResult with two parts: supplierPoList and xmlMailOrderApprovals.
      The transition delegate OrderApprovalTD.doTransition() (lines 86-105) iterates
      the supplierPoList and sends each PO to the supplier queue (lines 92-97), then
      sends the aggregated mail approvals (line 100). This implements the split-and-join
      pattern: one approval batch input → many supplier POs output + one email batch output.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 98
        line_end: 110
        excerpt: |
          /** Inner class used as to hold the return
            * values for the doWork
           **/
          private class WorkResult {
            ArrayList supplierPoList;
            String xmlMailOrderApprovals;
            WorkResult(String  xmlMailOrderApprovals, ArrayList supplierPoList) {
              this.xmlMailOrderApprovals = xmlMailOrderApprovals;
              this.supplierPoList = supplierPoList;
            }
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/OrderApprovalTD.java
        line_start: 79
        line_end: 105
        excerpt: |
          public void doTransition(TransitionInfo info) throws TransitionException {
            String xmlPO = null;
            Collection supplierPoList = info.getXMLMessageBatch();
            String xmlMailOrderApprovals = info.getXMLMessage();
            try {
              Iterator it = supplierPoList.iterator();
              while(it!= null && it.hasNext()) {
                xmlPO = (String) it.next();
                supplierQueueHelper.sendMessage(xmlPO);
               }
               sendMail(xmlMailOrderApprovals);
             } catch(JMSException je) {
                throw new TransitionException(je);
            }
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      mdb_destination_type: queue
      output_queues: 2

