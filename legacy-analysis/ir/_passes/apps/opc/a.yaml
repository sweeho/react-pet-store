  - record_key: OFULFILL-RULE-0005
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN an invoice is received from a supplier via InvoiceMDB, the system SHALL
      update the PurchaseOrder status based on the items shipped in the invoice.
      GIVEN all line items for an order have been shipped (join condition met), THEN
      the order status SHALL transition to COMPLETED and a message SHALL be sent to
      customer relations to notify the customer.
    confidence: high
    confidence_basis: >
      InvoiceMDB comment (lines 108-114) states: "If all the order items have been
      shipped for the order, it updates the purchase order status to COMPLETED to
      end the purchase order fulfillment process. If the order is not yet all shipped,
      it updates the order status based on the invoice." The onMessage method (lines
      118-139) calls doWork() which returns joinMessage (null if incomplete, non-null
      when all items shipped), and conditionally calls doTransition (lines 127-129).
    risk_class: operational
    basis: >
      InvoiceMDB processes supplier invoices in a publish-subscribe pattern (Topic
      destination, ejb-jar.xml line 210). The onMessage() method applies business
      logic that determines if all items for an order are shipped, using a join
      condition pattern. Only when the join condition is met (all items shipped) does
      it trigger the next transition by calling doTransition(joinMessage).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 108
        line_end: 139
        excerpt: |
          /**
           * InvoiceMDB receives a JMS message containing an Invoice
           * for a user order. If all the order items have been shipped
           * for the order, it updates the purchase order status to
           * COMPLETED to end the purchase order fulfillment process.
           * If the order is not yet all shipped, it updates the order
           * status based on the invoice.
           *
           * @param recvMsg is the JMS message contaning the xml content for the invoice
           */
          public void onMessage(Message recvMsg) {
            TextMessage recdTM = null;
            String recdText = null;
            try {
              recdTM = (TextMessage)recvMsg;
              recdText = recdTM.getText();
              String joinMessage = doWork(recdText);
              if (joinMessage != null) {
                doTransition(joinMessage);
              }
            } catch(TransitionException te) {
    stack_metadata:
      ejb.bean: InvoiceMDB
      mdb_destination_type: topic
      join_condition_pattern: true

  - record_key: ORDERTRACK-RULE-0006
    kind: business-rule
    capability_key: order-tracking
    requirement: >
      The system SHALL provide administrative capability to query all orders by
      status and retrieve order details including order ID, user ID, order date,
      and total order value.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB implements getOrdersByStatus(String status) method
      (line 131), which is declared in ejb-jar.xml with transaction attribute Required
      (lines 788-785). The method queries the process manager for orders in a given
      status and retrieves full order details from PurchaseOrder EJB for each result.
    risk_class: operational
    basis: >
      The OPCAdminFacadeEJB session bean provides a remote interface method
      getOrdersByStatus(). It accepts a status string parameter, queries ProcessManagerLocal
      which filters orders by status (line 139), then for each order ID looks up the
      PurchaseOrderLocal entity and extracts order properties (lines 143-149).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 123
        line_end: 157
        excerpt: |
          /**
           * Business method in the remote interface; Returns a collection of
           * of orders that are in the give status.
           * @param status   Represents the status of orders that are requested
           * @return <code>OrdersTO</code>
           * @throws <code>OPCAdminFacadeException</code> for all errors
           */
          public OrdersTO getOrdersByStatus(String status)
                                                        throws OPCAdminFacadeException {
              OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
              PurchaseOrderLocal po;
              ProcessManagerLocal mgr = getProcMgr();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection orders = mgr.getOrdersByStatus(status);
                  Iterator it = orders.iterator();
                  while((it!= null) && (it.hasNext())) {
                      ManagerLocal mgrEjb = (ManagerLocal) it.next();
                      po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                      Date gotDate = new Date(po.getPoDate());
                      String podate = (gotDate.getMonth()+1) + "/" +
                          gotDate.getDate() + "/" + (gotDate.getYear()+1900);
                      retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                                  podate, po.getPoValue(), status));
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      session_type: stateless
      remote_interface: true

  - record_key: ORDERTRACK-RULE-0007
    kind: business-rule
    capability_key: order-tracking
    requirement: >
      The system SHALL provide administrative capability to generate analytics
      data for orders by querying orders within a date range and aggregating
      revenue and order counts by product category or globally.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB implements getChartInfo() method (lines 169-200+) with
      parameters: request type (ORDERS or REVENUE), start date, end date, and
      optional category filter. The method queries all purchase orders within the
      date range, iterates through line items, and aggregates data by category.
    risk_class: operational
    basis: >
      The getChartInfo() method (lines 169-200+) uses PurchaseOrderLocalHome.findPOBetweenDates()
      to retrieve all orders in the date window (lines 182-184). For each order, it
      retrieves all line items (line 189). Based on the request type ("REVENUE" or
      "ORDERS"), it aggregates by category ID or globally (lines 193-200), accumulating
      revenue (quantity × unit price) or order counts.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 159
        line_end: 201
        excerpt: |
          /**
           * Business method in remote interface. Given start, end dates, this
           * returns a <code>HashMap</code> of revenue / orders in the given period
           * @param request  Represents the type of request - ORDERS/REVENUE
           * @param start    Represents the start date in mm/dd/yyyy format
           * @param end      Represents the end date in mm/dd/yyyy format
           * @param categ    Represents the sub-classification
           * @return <code>HashMap</code> of the required details
           * @throws <code>OPCAdminFacadeException</code> for all errors
           */
          public Map getChartInfo(String request,
                                  Date start,
                                  Date end,
                                  String categ)
              throws OPCAdminFacadeException {
              String id;
              Float tmpValue;
              Integer tmpQty;
              PurchaseOrderLocal po;
              Map chartDetails = new HashMap();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection poColl =
                      pohome.findPOBetweenDates(start.getTime(), end.getTime());
                  Iterator it = poColl.iterator();
                  while((it!= null) && (it.hasNext())) {
                      po = (PurchaseOrderLocal) it.next();
                      Collection liColl = po.getAllItems();
                      Iterator lit = liColl.iterator();
                      while((lit!=null) && (lit.hasNext())) {
                          LineItem loc = (LineItem) lit.next();
                          if(request.equals("REVENUE")) {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpValue = (Float) chartDetails.get(id);
                                      chartDetails.put(id,
                                           new Float(tmpValue.floatValue() +
                                           (loc.getQuantity()*loc.getUnitPrice())));
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      date_range_query: true

  - record_key: ADMINOPS-RULE-0008
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The OPC module SHALL provide an admin facade that grants administrative
      users remote access to query orders and generate reports without exposing
      the internal message-driven bean architecture to the admin client.
    confidence: high
    confidence_basis: >
      The OPCAdminFacadeEJB is declared as a session bean with unchecked
      (public) access (ejb-jar.xml lines 658-663). It implements the Remote
      interface and exposes getOrdersByStatus() and getChartInfo() as public
      business methods (lines 131, 169). These methods delegate to local EJBs
      internally, hiding the MDB orchestration.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB is a stateless session bean with Remote interface
      (ejb-jar.xml lines 50-106). All its methods have transaction attribute
      Required, and the assembly-descriptor grants unchecked access to all
      methods (lines 658-663). This provides a coarse-grained facade hiding
      the complex internal workflow.
