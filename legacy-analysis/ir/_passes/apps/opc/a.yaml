  - record_key: NOTIF-RULE-0009
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL send customer notification emails in response to order
      events: when an order is approved/denied (via MailOrderApprovalMDB) and
      when an order is completed and all items shipped (via MailCompletedOrderMDB).
      Additionally, invoice/shipment notifications SHALL be sent when suppliers
      ship items (via MailInvoiceMDB).
    confidence: high
    confidence_basis: >
      Three customer relations MDBs are declared with explicit business purpose in
      ejb-jar.xml (MailInvoiceMDB lines 404-491, MailOrderApprovalMDB lines 494-576,
      MailCompletedOrderMDB lines 580-652). Each has env-entry for SendConfirmationMail,
      SendApprovalMail, or SendCompletedOrderMail configuration. All receive JMS
      messages from previous workflow stages and have transition delegates that send
      mail.
    risk_class: operational
    basis: >
      Three MDBs in the customer-relations package (opc.customerrelations.ejb)
      process events and send customer notifications. MailOrderApprovalMDB receives
      OrderApproval messages from OrderApprovalMDB via queue. MailInvoiceMDB
      receives Invoice messages from InvoiceMDB via topic. MailCompletedOrderMDB
      receives completed order messages from InvoiceMDB when all items shipped.
      Each MDB has configurable flags to enable/disable email sending and XML
      validation.
