  - record_key: SUPMGMT-REQ-0004
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      When inventory is insufficient for a line item, the system SHALL leave the
      order in PENDING status and continue attempting to fulfill other items.
    confidence: medium
    confidence_basis: >
      Behavior inferred from checkInventory() returning false (line 189) setting
      allItemsAvailable = false but continuing iteration (line 191). However,
      the exact PO status assignment logic is unclear: po.setPoStatus() is only
      called at line 198 if allItemsAvailable is true. The PENDING status name
      is referenced in processPendingPO() query (line 251) but not explicitly set.
    risk_class: operational
    basis: >
      In processAnOrder(), when checkInventory() returns false for a line item,
      the boolean allItemsAvailable is set to false and the loop continues to
      check other items. Order status is only set to COMPLETED if allItemsAvailable
      is true. The PENDING status is used in findOrdersByStatus() query at line 251,
      suggesting orders remain PENDING when not all items can be fulfilled.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }//end while
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

  - record_key: SUPMGMT-REQ-0005
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL reduce inventory quantity by the requested quantity for
      each line item that can be fulfilled from stock.
    confidence: high
    confidence_basis: >
      Explicitly implemented in checkInventory() line 131 where inv.reduceQuantity()
      is called after verifying sufficient inventory exists. Corroborated by
      InventoryEJB.reduceQuantity() method lines 82-85 which decrements the
      quantity field. This is enforced in two layers: declarative transaction
      control and programmatic field update.
    risk_class: operational
    basis: >
      When sufficient inventory exists for a line item (line 129 condition passes),
      the checkInventory() method calls inv.reduceQuantity(item.getQuantity())
      to decrement the inventory. The InventoryEJB.reduceQuantity() method
      retrieves current quantity and sets it to q - quantity.
