  - record_key: SUPMGMT-REQ-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL attempt to fulfill purchase orders by checking inventory
      availability for each line item.
    confidence: high
    confidence_basis: >
      Requirement explicitly documented in OrderFulfillmentFacadeEJB.java line 123
      comment "if items are in stock then take them out of inventory to full order".
      Implementation corroborated at lines 185-195 where inventory is checked via
      checkInventory(LineItemLocal) for each unshipped line item.
    risk_class: operational
    basis: >
      The processAnOrder() method iterates through line items of a purchase order.
      For each line item that has not been fully shipped (quantity != quantityShipped),
      it calls checkInventory() which retrieves the inventory item by itemId and
      compares available quantity against requested quantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 120
        line_end: 139
        excerpt: |
          /**
           * if items are in stock then take them out of inventory to full order
           *
           * @return false if number of items in inventory is less than
           *         number in the line item of po; else return true.
           */
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 173
        line_end: 196
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
