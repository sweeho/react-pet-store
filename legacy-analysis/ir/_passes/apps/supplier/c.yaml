    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: >
      RcvrRequestProcessor.updateInventory() line 119 extracts itemId via
      substring from parameter name "item_<itemId>". If itemId contains special
      characters or is malformed, the subsequent lookup via
      inventoryHomeRef.findByPrimaryKey(itemId) will fail. However, there is no
      validation of itemId format or length. If the request contains a parameter
      like "item_", the substring results in an empty string, which may or may not
      be a valid itemId. This edge case is unresolved.
