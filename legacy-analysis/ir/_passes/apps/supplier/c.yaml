  - record_key: ADMIN-REQ-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      Inventory quantity updates from the web interface SHALL be processed within
      a user-managed transaction that also triggers fulfillment of pending orders.
    confidence: high
    confidence_basis: >
      Requirement explicitly implemented in RcvrRequestProcessor.doPost() lines
      180-188. UserTransaction is obtained via JNDI, begun explicitly, inventory
      is updated, processPendingPO() is called, and committed. The transactional
      boundary is explicitly managed with begin/commit/rollback handlers.
    risk_class: operational
    basis: >
      When a supplier updates inventory (currentScreen="updateinventory"),
      RcvrRequestProcessor obtains a UserTransaction from JNDI, calls begin(),
      updates inventory quantities via updateInventory(), processes pending orders
      via procPO.processPendingPO(), publishes invoices, and commits the transaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 166
        line_end: 209
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws java.io.IOException, javax.servlet.ServletException {
              if(fromDoGet) {
                getServletConfig().getServletContext().getRequestDispatcher("/index.jsp").forward(req, resp);
              } else {
                String curScreen = req.getParameter("currentScreen").trim();
                if(curScreen.equals("updateinventory")) {
                  UserTransaction ut = null;
                  try {
                    InitialContext ic = new InitialContext();
                    ut = (UserTransaction) ic.lookup(JNDINames.USER_TRANSACTION);
                    ut.begin();        // start the xaction.
                    updateInventory(req);
                    Collection invoices = procPO.processPendingPO();
                    sendInvoices(invoices);
                    ut.commit();        // end xaction
    stack_metadata:
