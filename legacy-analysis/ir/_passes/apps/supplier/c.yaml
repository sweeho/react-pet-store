    kind: requirement
    capability_key: supplier-management
    requirement: >
      The system SHALL receive purchase orders from the Order Processing Center
      asynchronously via JMS queue.
    confidence: high
    confidence_basis: >
      Requirement is enforced in two independent locations: (1) declarative
      configuration in ejb-jar.xml lines 85-93 declares SupplierOrderMDB as a
      message-driven bean with destination-type of javax.jms.Queue, and
      (2) SupplierOrderMDB.java implements MessageListener interface with
      onMessage() method that receives TextMessage (line 101). Both sources
      converge on this single requirement.
    risk_class: operational
    basis: >
      SupplierOrderMDB is configured as a message-driven bean that listens to a
      JMS queue for incoming purchase order messages. The onMessage(Message)
      method extracts text content from the received TextMessage and delegates
      processing to OrderFulfillmentFacadeLocal.
