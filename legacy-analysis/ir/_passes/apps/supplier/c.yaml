  - record_key: SUPMGMT-REQ-0002
    kind: requirement
    capability_key: supplier-management
    requirement: >
      The system SHALL persist received purchase orders as entity objects.
    confidence: high
    confidence_basis: >
      Requirement explicitly stated in OrderFulfillmentFacadeEJB.java comment
      lines 212-216. Corroborated by implementation: supplierOrderXDE.setDocument()
      parses XML, supplierOrderXDE.getSupplierOrder() converts to Java object,
      and supplierOrderLocalHome.create(supplierOrder) persists it (lines 228-233).
    risk_class: operational
    basis: >
      The OrderFulfillmentFacadeEJB processes incoming PO XML documents by
      converting them to SupplierOrder Java objects via TPASupplierOrderXDE,
      then persists them using the SupplierOrderLocalHome EJB.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 212
        line_end: 237
        excerpt: |
          /**
           * This method processes the incoming PO received by the supplier. It
           * persists the order, and then it tries to fullfill the order with items
           * in Inventory and packages and ships as much of the order as possible to
           * the customer and returns an Invoice indicating the shipment
           *
           * @param String Serialized XML document which represents the PO
           * @return String Serialized XML document that is the invoice and
           *          may return null if the invoice has no items or nothing
           *          could be shipped now
           */
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
    stack_metadata:
