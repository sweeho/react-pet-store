  - record_key: SUPMGMT-REQ-0006
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL generate an XML invoice containing fulfilled line items
      with order ID, order date, shipping date, item details, and unit prices.
    confidence: high
    confidence_basis: >
      Requirement explicitly documented in OrderFulfillmentFacadeEJB.java lines
      141-144 comment. Corroborated by createInvoice() implementation lines
      145-171 which calls invoiceXDE methods to populate invoice document.
      Both the comment and implementation converge on complete invoice structure.
    risk_class: operational
    basis: >
      The createInvoice() method uses TPAInvoiceXDE to construct an XML invoice
      document. It sets order ID, user ID, order date, shipping date (current date),
      and iterates through line items, adding only those that were successfully
      fulfilled (present in the items HashMap). Each line item includes category ID,
      product ID, item ID, line number, quantity, and unit price.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 141
        line_end: 171
        excerpt: |
          /**
           * Builds an Invoice XML document containing all the items that
           *  can be shipped from inventory
           */
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

  - record_key: SUPMGMT-REQ-0007
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      When order fulfillment generates an invoice, the system SHALL publish the
      invoice to an asynchronous JMS topic for downstream notification processing.
    confidence: high
    confidence_basis: >
      Requirement enforced in two independent places: (1) SupplierOrderMDB.onMessage()
      line 111 branches to doTransition() only if invoice is non-null, and
      (2) doTransition() line 152 creates TransitionInfo and calls
      transitionDelegate.doTransition(). Both paths converge on topic publication.
    risk_class: operational
    basis: >
      After OrderFulfillmentFacadeEJB.processPO() generates an invoice XML string,
      SupplierOrderMDB.onMessage() calls doTransition(invoice) which wraps the XML
      in a TransitionInfo object and delegates to SupplierOrderTD.doTransition().
      SupplierOrderTD publishes the XML invoice to the InvoiceTopic via TopicSender.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
