  - record_key: SUPMGMT-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL attempt to fulfill received purchase orders by checking
      inventory availability for requested items and reducing inventory quantities
      by the order quantity if items are in stock.
    confidence: high
    confidence_basis: >
      The requirement is enforced in two independent places: (1) OrderFulfillmentFacadeEJB.checkInventory()
      method in lines 126-139 checks availability and reduces quantity, and (2) the method
      is called from processAnOrder() which coordinates the fulfillment logic (lines 176-210).
      The logic is consistently enforced across both the MDB trigger path and the web tier
      path via RcvrRequestProcessor (lines 186-187).
    risk_class: financial
    basis: >
      The OrderFulfillmentFacadeEJB contains the core fulfillment logic. The checkInventory()
      method retrieves an inventory item by ID, compares the quantity in stock against the
      line item quantity, and if sufficient stock exists, calls reduceQuantity() to decrement
      the inventory. The processAnOrder() method iterates through all line items in a purchase
      order and applies this logic to each item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.type: SessionBean
      ejb.transaction: Required

  - record_key: SUPMGMT-REQ-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL only fulfill an order if inventory quantity is greater than
      or equal to the line item quantity requested. If insufficient stock exists,
      the system SHALL mark that portion of the order as not yet fulfilled and leave
      the order in PENDING status for later fulfillment.
    confidence: high
    confidence_basis: >
      The comparison logic `inv.getQuantity() < item.getQuantity()` enforces this
      invariant at line 129. The behavior when insufficient stock is found (returning
      false, continuing iteration without modifying inventory or order status) is
      consistent with the processAnOrder() logic which only sets COMPLETED status
      if allItemsAvailable is true (line 197-198).
    risk_class: financial
    basis: >
      In checkInventory(), the quantity comparison on line 129 returns false if
      inventory is less than requested, preventing any inventory reduction. In
      processAnOrder(), the order status is only set to COMPLETED if allItemsAvailable
      remains true after checking all items (line 197-198), which tracks whether
      all items passed the inventory check.
