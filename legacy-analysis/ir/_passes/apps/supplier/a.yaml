  - record_key: SUPMGMT-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      GIVEN a supplier receives a purchase order from the Order Processing Center
      via JMS queue, WHEN the system processes the purchase order, THEN the system
      SHALL attempt to fulfill each line item by checking inventory availability,
      THEN reduce inventory for items with sufficient stock, THEN create an invoice
      for fulfilled items, THEN send the invoice back to OPC via message transition.
      IF any line items cannot be fulfilled due to insufficient inventory, those items
      SHALL be left in the order for later fulfillment when inventory arrives.
    confidence: high
    confidence_basis: >
      The complete workflow is enforced through the MDB pattern: SupplierOrderMDB.onMessage()
      calls doWork() which calls OrderFulfillmentFacadeEJB.processPO() (lines 138-143),
      which persists the order and calls processAnOrder() (lines 223-237). The processAnOrder()
      method iterates through line items, checks inventory, marks items as shipped,
      creates invoices, and returns them for transition (lines 176-210). The workflow
      is consistently enforced in both the MDB path and the servlet-triggered path
      (RcvrRequestProcessor.processPendingPO() at line 186).
    risk_class: financial
    basis: >
      The MDB receives a TextMessage containing XML PO, extracts the text, and passes
      it to OrderFulfillmentFacadeEJB.processPO(). That method converts the XML to
      a SupplierOrder object, persists it as a SupplierOrderLocal entity, then calls
      processAnOrder() to fulfill it. processAnOrder() iterates through line items,
      calls checkInventory() for each item (which reduces quantity if available),
      marks items as shipped, builds an invoice of fulfilled items, and returns the
      invoice XML. If an invoice is generated (non-null), the MDB calls doTransition()
      to send it back to OPC.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 143
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              // Do processing work on received message
              String invoice = doWork(recdText);
              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              }
            }
          private String doWork(String xmlMessage) throws
                                                CreateException, XMLDocumentException  {
            String invoice = null;
            invoice = poProcessor.processPO(xmlMessage);
            return invoice;
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
    stack_metadata:
      workflow.async: true
      framework: jms
      ejb.transaction: Required

