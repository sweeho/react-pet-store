      (1) SupplierOrderMDB.onMessage() (lines 317-326), (2) OrderFulfillmentFacadeEJB.processPO()
      (lines 330-339), and (3) OrderFulfillmentFacadeEJB.processPendingPO() (lines 340-347).
      All Inventory entity methods (getQuantity, setQuantity, reduceQuantity) also use
      Required attribute. RcvrRequestProcessor explicitly uses UserTransaction to bracket
      inventory updates and invoice sending (lines 182-188). Multiple independent
      sources enforce transaction semantics.
