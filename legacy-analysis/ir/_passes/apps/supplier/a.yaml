    requirement: >
      The system SHALL execute all order fulfillment operations (inventory checking,
      quantity reduction, order status updates, invoice generation, and message
      transmission) within a single container-managed transaction with Required
      transaction attribute. If any step fails, the entire transaction SHALL rollback,
      leaving inventory and order state unchanged.
