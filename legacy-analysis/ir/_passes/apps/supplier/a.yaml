  - record_key: SUPMGMT-REQ-0004
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL generate an invoice XML document for each purchase order
      that has been partially or fully fulfilled, containing the item details
      of all line items that were shipped.
    confidence: high
    confidence_basis: >
      The createInvoice() method (lines 145-171) builds the invoice XML from
      fulfilled items, and it is called from processAnOrder() (line 201) when
      invoiceReqd is true. The method is consistently invoked whenever items
      are fulfilled, and the invoice document is returned as the result of order
      processing (line 235-236).
    risk_class: operational
    basis: >
      The createInvoice() method iterates through the line items in the purchase
      order and adds each item to the invoice XML if it was included in the
      fulfilled items map (lines 154-165). The invoice includes order ID, user ID,
      order date, shipping date, and detailed line item information (category,
      product, item ID, line number, quantity, unit price). The invoice is
      generated as a serialized XML string (line 169).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }//end while
              String invDoc = null;
              invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      xml.format: TPA

  - record_key: SUPMGMT-REQ-0005
    kind: requirement
    capability_key: supplier-management
    requirement: >
      The system SHALL send invoice documents back to the Order Processing Center
      via asynchronous message transition when orders are fulfilled, so that the
      OPC can acknowledge the shipment.
    confidence: medium
    confidence_basis: >
      The SupplierOrderMDB.doTransition() method (mentioned in onMessage() at line 112)
      uses TransitionDelegate to send invoices, and this pattern is replicated in the
      web tier servlet (RcvrRequestProcessor.sendInvoices() lines 139-157). However,
      the actual implementation of doTransition() is not visible in the provided code
      (it extends beyond the excerpt), so confidence is medium rather than high.
      Both paths (MDB and servlet) consistently use the same transition mechanism.
    risk_class: operational
    basis: >
      In the MDB, when an invoice is generated (line 111), the doTransition() method
      is called to send it. In the servlet tier, processPendingPO() returns a Collection
      of invoices (line 186) which are then sent via sendInvoices() (line 187), which
      creates a TransitionDelegate and calls doTransition() for each invoice (line 150).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              // Do processing work on received message
              String invoice = doWork(recdText);
              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 139
        line_end: 157
        excerpt: |
          private void sendInvoices(Collection invoices) {
            try {
              ServiceLocator serviceLocator = ServiceLocator.getInstance();
              String tdClassName = serviceLocator.getString(JNDINames.TRANSITION_DELEGATE__SUPPLIER_ORDER);
              TransitionDelegateFactory tdf = new TransitionDelegateFactory();
              transitionDelegate = tdf.getTransitionDelegate(tdClassName);
              transitionDelegate.setup();
              Iterator it = invoices.iterator();
              while((it!=null) && (it.hasNext())) {
                String anInvoice = (String) it.next();
                TransitionInfo info = new TransitionInfo(anInvoice);
                transitionDelegate.doTransition(info);
              }
    stack_metadata:
      ejb.bean: SupplierOrderMDB
      pattern: transitiondelegate

