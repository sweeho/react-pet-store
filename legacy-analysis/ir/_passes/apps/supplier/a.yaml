      The SupplierOrderMDB is configured as a message-driven bean in ejb-jar.xml
      that receives JMS messages containing supplier purchase orders. The onMessage()
      method processes incoming TextMessage objects carrying serialized XML purchase order
      documents. This is part of the asynchronous order fulfillment workflow where
      the OPC component sends purchase orders to the supplier module via JMS.
