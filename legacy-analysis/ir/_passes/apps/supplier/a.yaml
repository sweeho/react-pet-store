  - record_key: SUPMGMT-REQ-0006
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      When inventory is unavailable for a line item in a purchase order, the
      system SHALL NOT reduce inventory for that item and SHALL NOT mark it as
      shipped. Instead, the line item SHALL remain in PENDING state for later
      fulfillment when the inventory becomes available.
    confidence: high
    confidence_basis: >
      The checkInventory() method returns false and does not call reduceQuantity()
      if stock is insufficient (lines 129-130). In processAnOrder(), when checkInventory()
      returns false, the line is skipped with continue (line 191) without calling
      setQuantityShipped() (which is only called on line 193 when inventory check succeeds).
      The logic prevents both inventory reduction and quantity shipped marking when
      inventory is unavailable.
    risk_class: financial
    basis: >
      When inv.getQuantity() < item.getQuantity(), the method returns false immediately
      without calling reduceQuantity(). In processAnOrder(), if checkInventory() returns
      false, the code executes continue to skip that line item entirely, preventing both
      the inventory reduction and the setQuantityShipped() call. Only when checkInventory()
      succeeds does the code proceed to set the quantityShipped.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 185
        line_end: 196
        excerpt: |
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() == li.getQuantityShipped())
              continue;
            if(!checkInventory(li)) {
              allItemsAvailable = false;
              continue;
            }
            li.setQuantityShipped(li.getQuantity());
            items.put(li.getItemId(), OrderStatusNames.COMPLETED);
            invoiceReqd = true;
          }
