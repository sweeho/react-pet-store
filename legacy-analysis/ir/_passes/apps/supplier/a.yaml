      Requirement is enforced in two independent places: (1) ejb-jar.xml declares
      SupplierOrderMDB as message-driven bean listening on javax.jms.Queue
      (line 85-93), and (2) SupplierOrderMDB.java implements MessageListener with
      onMessage() method receiving TextMessage containing XML PO (line 101-123).
      Both declarative and programmatic evidence converge on this requirement.
    risk_class: operational
