    basis: >
      The ejb-jar.xml assembly-descriptor declares container-transaction elements
      with trans-attribute=Required for the key business methods. This ensures the
      EJB container enforces ACID semantics around these operations. In the servlet
      path, RcvrRequestProcessor explicitly manages transactions using JNDI UserTransaction,
