  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/DisplayInventoryBean.java
    description: >
      DisplayInventoryBean.getInventory() returns null in exception cases (lines
      83-84 catch exceptions but continue returning null). The displayinventory.jsp
      page checks for null at line 74 and displays "no items" message. However, the
      RcvrRequestProcessor does not perform this null check when calling updateInventory(),
      which would attempt to iterate over a potentially null collection (line 116).
      If getInventory() returns null, Enumeration.nextElement() would throw NPE. This
      is a defensive coding gap, though in practice the inventory is pre-populated so
      the collection should not be null.
