  - record_key: SUPMGMT-WORKFLOW-0002
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      WHEN new inventory arrives at the supplier and is recorded, the web tier
      SHALL call processPendingPO() on the OrderFulfillmentFacade to re-attempt
      fulfilling all purchase orders that are still in PENDING status. For each
      pending order that can now be fulfilled with the newly arrived inventory,
      an invoice SHALL be generated and sent to the OPC.
    confidence: high
    confidence_basis: >
      RcvrRequestProcessor.doPost() explicitly calls procPO.processPendingPO() at
      line 186 after updateInventory() completes, and then calls sendInvoices() with
      the returned collection at line 187. This is enforced in a transaction that
      includes both operations. The processPendingPO() method in OrderFulfillmentFacadeEJB
      (lines 247-269) implements this logic by finding all PENDING orders and attempting
      to fulfill each one.
    risk_class: financial
    basis: >
      The RcvrRequestProcessor servlet handles the updateinventory action by: (1)
      updating inventory quantities from the form parameters, (2) calling processPendingPO()
      to process pending orders, (3) collecting the invoices returned, and (4) calling
      sendInvoices() to send them. OrderFulfillmentFacadeEJB.processPendingPO() finds all
      orders with PENDING status using findOrdersByStatus(), iterates through them,
      and attempts to fulfill each one by calling processAnOrder().
