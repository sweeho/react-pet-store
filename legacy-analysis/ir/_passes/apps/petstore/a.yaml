records:
  - record_key: UAC-REQ-0001
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL provide customer registration functionality where a user can create
      a new account by providing a username and password.
    confidence: high
    confidence_basis: >
      Both the CreateUserHTMLAction and CreateUserEJBAction explicitly implement user
      creation. The HTML action extracts username and password from request parameters,
      and the EJB action calls SignOn.createUser(). The mappings.xml shows the createuser.do
      URL maps to CreateUserHTMLAction.
    risk_class: operational
    basis: >
      CreateUserHTMLAction performs parameter extraction; CreateUserEJBAction invokes
      SignOnLocal.createUser() and stores username in ShoppingClientFacade via setUserId().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CreateUserHTMLAction.java
        line_start: 73
        line_end: 88
        excerpt: |
          String userName = (String)request.getParameter("j_username");
          String password = request.getParameter("j_password");
          String password2 = request.getParameter("j_password2");
          request.getSession().setAttribute(SignOnFilter.USER_NAME, userName);
          CreateUserEvent event = null;
          if (userName != null && password != null) {
              return new CreateUserEvent(userName,password);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 78
        line_end: 104
        excerpt: |
          CreateUserEvent cue = (CreateUserEvent)e;
          SignOnLocal signOn = null;
          String userName = cue.getUserName();
          String password = cue.getPassword();
          signOn.createUser(userName, password);
          scf.setUserId(userName);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 86
        line_end: 88
        excerpt: |
          <url-mapping url="createuser.do" screen="create_customer.screen" >
              <web-action-class>com.sun.j2ee.blueprints.petstore.controller.web.actions.CreateUserHTMLAction</web-action-class>
    stack_metadata:
      framework: "web action"
      web_action: "com.sun.j2ee.blueprints.petstore.controller.web.actions.CreateUserHTMLAction"
      ejb_action: "com.sun.j2ee.blueprints.petstore.controller.ejb.actions.CreateUserEJBAction"

  - record_key: UAC-BIZ-0001
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      When a duplicate account is detected during user creation, the system SHALL throw
      a DuplicateAccountException and display an error screen to the user.
    confidence: high
    confidence_basis: >
      The exception class exists in the codebase and is explicitly mapped in mappings.xml
      to the duplicate_account.screen. The CreateUserEJBAction catches CreateException and
      re-throws it as DuplicateAccountException.
    risk_class: operational
    basis: >
      DuplicateAccountException is caught from SignOn.createUser() in CreateUserEJBAction
      and mapped to duplicate_account.screen in the exception-mapping configuration.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/exceptions/DuplicateAccountException.java
        line_start: 1
