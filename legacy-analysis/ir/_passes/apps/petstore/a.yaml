  - record_key: ORD-REQ-0002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL require the following mandatory fields for billing and shipping addresses:
      first name, last name, street address, city, state/province, postal code, and telephone number.
    confidence: high
    confidence_basis: >
      OrderHTMLAction.extractContactInfo() validates all these fields explicitly,
      adding missing field names to an exception list when they are empty.
    risk_class: operational
    basis: >
      extractContactInfo validates familyName, givenName, address_1, city,
      stateOrProvince, postalCode, and telephone fields by checking for empty strings.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 88
        line_end: 145
        excerpt: |
          private ContactInfo extractContactInfo(HttpServletRequest request, String suffix)
              throws HTMLActionException {
              ArrayList missingFields = null;
              String familyName =  request.getParameter("family_name" +suffix).trim();
              if (familyName.equals("")) {
                  missingFields.add("Last Name");
              }
              String givenName =  request.getParameter("given_name" +suffix).trim();
              if (givenName.equals("")) {
                  missingFields.add("First Name");
              }
              String address1 = request.getParameter("address_1" +suffix).trim();
              String city =   request.getParameter("city"  +suffix).trim();
              String stateOrProvince = request.getParameter("state_or_province" +suffix).trim();
              String postalCode = request.getParameter("postal_code" +suffix).trim();
              String telephone = request.getParameter("telephone_number" +suffix).trim();
              if (telephone.equals("")){
                  missingFields.add("Telephone Number");
              }

