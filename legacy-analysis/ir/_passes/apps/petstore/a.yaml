  - record_key: ORD-REQ-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL generate a unique order ID for each order using the UniqueIdGenerator EJB.
    confidence: high
    confidence_basis: >
      OrderEJBAction obtains UniqueIdGeneratorLocal via service locator and calls
      uidgen.getUniqueId("1001") to generate the order ID.
    risk_class: operational
    basis: >
      OrderEJBAction uses ServiceLocator to get UniqueIdGeneratorLocalHome, creates
      a UniqueIdGeneratorLocal instance, and calls getUniqueId().
    traces:
