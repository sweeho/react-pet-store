  - record_key: SHC-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow users to add items to their shopping cart by specifying
      an item ID and action type.
    confidence: high
    confidence_basis: >
      CartHTMLAction explicitly handles the "purchase" action type which creates
      a CartEvent.ADD_ITEM. CartEJBAction processes this by calling cart.addItem().
    risk_class: operational
    basis: >
      CartHTMLAction extracts action parameter and itemId; CartEJBAction performs
      the add operation on the ShoppingCartLocal bean.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 82
        line_end: 98
        excerpt: |
          String actionType = (String)request.getParameter("action");
          CartEvent event = null;
          if (actionType == null) return null;
          if (actionType.equals("purchase")) {
              String itemId = request.getParameter("itemId");
              event = new CartEvent(CartEvent.ADD_ITEM, itemId);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 59
        line_end: 71
        excerpt: |
          CartEvent ce = (CartEvent)e;
          ShoppingClientFacadeLocal scf = null;
          scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
          ShoppingCartLocal cart = scf.getShoppingCart();
          switch (ce.getActionType()) {
              case  CartEvent.ADD_ITEM  : {
                  cart.addItem(ce.getItemId());
              }

