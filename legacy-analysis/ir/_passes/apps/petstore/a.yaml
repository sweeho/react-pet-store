  - record_key: UAC-BIZ-0003
    kind: business-rule
    capability_key: user-accounts
    requirement: >
      When a user signs off, the system SHALL invalidate the current session and
      create a new session while preserving the user's locale preference.
    confidence: high
    confidence_basis: >
      SignOffHTMLAction.perform() explicitly calls session.invalidate(), creates a
      new session, and restores the locale attribute.
    risk_class: operational
    basis: >
      SignOffHTMLAction demonstrates the sign-off workflow with session invalidation
      and locale preservation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/SignOffHTMLAction.java
        line_start: 69
        line_end: 82
        excerpt: |
          HttpSession session = request.getSession();
          Locale locale = (Locale)session.getAttribute(WebKeys.LOCALE);
          session.invalidate();
          session = null;
          session = request.getSession(true);
          session.setAttribute(WebKeys.LOCALE, locale);

