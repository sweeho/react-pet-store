records:
  - record_key: shopping-cart-req-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow customers to add items to a shopping cart.
    confidence: high
    confidence_basis: >
      Confirmed by CartEJBAction.perform() showing CartEvent.ADD_ITEM case;
      cart.addItem(itemId) is called in multiple flows; supported by cart.jsp
      which renders items with add functionality.
    risk_class: operational
    basis: >
      CartEJBAction line 68-71 handles ADD_ITEM action by calling
      cart.addItem(itemId). cart.jsp renders individual items with add capability.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 68
        line_end: 71
        excerpt: |
          case  CartEvent.ADD_ITEM  : {
              cart.addItem(ce.getItemId());
          }

