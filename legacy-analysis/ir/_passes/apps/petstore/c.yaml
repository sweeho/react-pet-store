  - record_key: shopping-cart-req-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow customers to update quantities of items in a shopping cart.
    confidence: high
    confidence_basis: >
      Confirmed by CartEJBAction.perform() showing CartEvent.UPDATE_ITEMS case;
      iterates over items map and calls cart.updateItemQuantity for each;
      cart.jsp form submits quantities in input fields with naming pattern
      itemQuantity_<itemId>.
    risk_class: operational
    basis: >
      CartEJBAction line 78-88 handles UPDATE_ITEMS action by parsing a map of
      itemId to quantity and calling cart.updateItemQuantity for each. cart.jsp
      renders quantity inputs for each cart item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 88
        excerpt: |
          case  CartEvent.UPDATE_ITEMS : {
              Map items = ce.getItems();
              Iterator it = null;
              if (items != null) it = items.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String itemId = (String)it.next();
                  int quantity = ((Integer)items.get(itemId)).intValue();
                  cart.updateItemQuantity(itemId, quantity);
              }
          }

  - record_key: shopping-cart-req-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL maintain a shopping cart across a session. GIVEN a customer
      adds items to cart, WHEN the customer navigates to other pages, THEN the
      cart SHALL retain the items until explicitly emptied or checkout occurs.
    confidence: medium
    confidence_basis: >
      Evident from ShoppingCartLocal being retrieved from ShoppingClientFacadeLocal
      across multiple action handlers (CartEJBAction, OrderEJBAction); cart is
      stateful session bean persisted on ShoppingClientFacadeEJB (Stateful). Session
      timeout is 15 minutes per web.xml. Direct confirmation of persistence beyond
      a single action is inferred rather than explicitly stated.
    risk_class: operational
    basis: >
      CartEJBAction line 64 and OrderEJBAction line 125 both retrieve cart via
      scf.getShoppingCart(). web.xml line 161-163 defines session-timeout of 15 minutes.
      ejb-jar.xml line 148 shows ShoppingClientFacadeEJB is Stateful session bean.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 161
        line_end: 163
        excerpt: |
          <session-config>
            <session-timeout>15</session-timeout>
          </session-config>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/ejb-jar.xml
        line_start: 148
        line_end: 149
        excerpt: |
          <session-type>Stateful</session-type>

  - record_key: order-placement-req-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL validate that the shopping cart is not empty before
      allowing order placement. GIVEN an empty cart, WHEN checkout is attempted,
      THEN the system SHALL throw ShoppingCartEmptyOrderException.
    confidence: high
    confidence_basis: >
      Explicitly enforced in OrderEJBAction.perform() with an if condition
      checking items.size() == 0 and throwing ShoppingCartEmptyOrderException.
      Exception is defined in the petstore controller package showing this is
      a deliberate business rule.
    risk_class: operational
    basis: >
      OrderEJBAction line 130-132 checks cart items size and throws
      ShoppingCartEmptyOrderException if empty. Exception is defined in
      legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/exceptions/ShoppingCartEmptyOrderException.java
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 130
        line_end: 132
        excerpt: |
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }

