  - record_key: order-placement-req-0005
    kind: requirement
    capability_key: order-placement
    requirement: >
      Orders SHALL capture the following information: order ID, user ID, customer
      email, order date, shipping address, billing address, credit card information,
      and line items with quantities and costs. Order total price SHALL be calculated
      as the sum of (unit cost * quantity) for all line items.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() explicitly sets all these fields on PurchaseOrder
      object and calculates totalCost in a loop. UniqueIdGenerator with prefix
      "1001" is used for order ID generation.
    risk_class: financial
    basis: >
      OrderEJBAction lines 92-146 build PurchaseOrder with setOrderId, setUserId,
      setEmailId, setOrderDate, setShippingInfo, setBillingInfo, setCreditCard.
      Line items added with LineItem constructor. totalCost calculated as:
      totalCost += (cost * item.getQuantity()) for each item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 92
        line_end: 146
        excerpt: |
          PurchaseOrder purchaseOrder = new PurchaseOrder();
          // ...
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
          purchaseOrder.setShippingInfo(shipTo);
          purchaseOrder.setBillingInfo(billTo);
          purchaseOrder.setCreditCard(creditCard);
          // ...
          while (it.hasNext()) {
              CartItem item = (CartItem)it.next();
              float cost = new Float(item.getUnitCost()).floatValue();
              totalCost += (cost*item.getQuantity());
              purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                     item.getProductId(),
                                                     item.getItemId(),
                                                     (lineItemCount++) + "",
                                                     item.getQuantity(),
                                                     cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

