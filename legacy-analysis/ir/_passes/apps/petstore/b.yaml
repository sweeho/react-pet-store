# === AUTHENTICATION AND USER ACCOUNTS ===

  - record_key: user-accounts-req-0001
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL allow customers to create a user account by providing a unique username and password.
      The system SHALL reject duplicate usernames with a DuplicateAccountException.
    confidence: high
    confidence_basis: >
      Direct evidence in CreateUserEJBAction which catches CreateException and throws
      DuplicateAccountException. Declarative configuration in mappings.xml maps createuser.do
      to create_customer.screen showing this is an explicit user-facing flow.
    risk_class: operational
    basis: >
      CreateUserEJBAction.perform() calls signOn.createUser(userName, password) which
      throws CreateException on duplicate username. The exception is caught and converted
      to DuplicateAccountException which is mapped to duplicate_account.screen in mappings.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 78
        line_end: 104
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CreateUserEvent cue = (CreateUserEvent)e;
              SignOnLocal signOn = null;
              String userName = cue.getUserName();
              try {
                 signOn = home.create();
              } catch (CreateException cx) {
                 throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + cx);
              }
              signOn.createUser(userName, password);
              try {
                 signOn.createUser(userName, password);
              } catch (CreateException ce) {
                 throw new DuplicateAccountException("Bad UserName or password");
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 112
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.DuplicateAccountException" screen="duplicate_account.screen"/>

  - record_key: user-accounts-req-0002
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL allow registered customers to authenticate by username and password.
      Upon successful authentication, the system SHALL retrieve the customer's profile and set
      the user's preferred locale.
    confidence: high
    confidence_basis: >
      SignOnEJBAction directly implements this flow. Code shows retrieval of ProfileLocal and
      locale setting with exception handling for first-time users. Two independent sources
      (action class and exception handling) confirm this behavior.
    risk_class: operational
    basis: >
      SignOnEJBAction.perform() retrieves the user profile via scf.getCustomer().getProfile()
      and extracts the preferredLanguage to set locale via I18nUtil.getLocaleFromString().
      FinderException is caught to handle first-time users who have not yet created a profile.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 75
        line_end: 98
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              SignOnEvent cue = (SignOnEvent)e;
              String userId = cue.getUserName();
              scf.setUserId(userId);
              try {
                 ProfileLocal profile = scf.getCustomer().getProfile();
                 Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
                 machine.setAttribute(PetstoreKeys.LOCALE, locale);
                 ShoppingCartLocal cart = scf.getShoppingCart();
                 cart.setLocale(locale);
              } catch (FinderException fe) {
                 // in the process of creating a user for the first time
              }
          }

  - record_key: user-accounts-req-0003
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL support customer profile management including preferred language,
      favorite product category, and list and banner preferences.
    confidence: high
    confidence_basis: >
      ProfileLocal entity is retrieved and multiple profile fields are set in CustomerEJBAction.
      The profile fields (preferredLanguage, favoriteCategory, myListPreference, bannerPreference)
      are explicitly set on the ProfileLocal EJB. This is both in code and in EJB declarations.
    risk_class: operational
    basis: >
      CustomerEJBAction.updateCustomer() sets preference fields on ProfileLocal object:
      profileLocal.setPreferredLanguage(), setFavoriteCategory(), setMyListPreference(),
      setBannerPreference(). These fields are directly settable on the profile EJB.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 136
        line_end: 145
        excerpt: |
          ProfileInfo profileInfo = ce.getProfileInfo();
          ProfileLocal profileLocal = customer.getProfile();
          profileLocal.setPreferredLanguage(profileInfo.getPreferredLanguage());
          profileLocal.setFavoriteCategory(profileInfo.getFavoriteCategory());
          profileLocal.setMyListPreference(profileInfo.getMyListPreference());
          profileLocal.setBannerPreference(profileInfo.getBannerPreference());
          Locale locale = I18nUtil.getLocaleFromString(profileInfo.getPreferredLanguage());
          machine.setAttribute("locale", locale);

  - record_key: user-accounts-req-0004
    kind: requirement
    capability_key: user-accounts
    requirement: >
      The system SHALL store and manage customer contact information including given name,
      family name, telephone, email, and complete address (street name, city, state, country, zip code).
    confidence: high
    confidence_basis: >
      ContactInfoLocal and AddressLocal entities are directly manipulated in CustomerEJBAction.
      Each field corresponds to an EJB setter method, indicating database schema persistence.
      Code shows deep copy operations from ContactInfo to ContactInfoLocal and Address to AddressLocal.
    risk_class: operational
    basis: >
      CustomerEJBAction.updateCustomer() retrieves account.getContactInfo() and sets:
      givenName, familyName, telephone, email on ContactInfoLocal.
      It also retrieves contactInfoLocal.getAddress() and sets: streetName1, streetName2,
      city, zipCode, state, country on AddressLocal.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 110
        line_end: 129
        excerpt: |
          AccountLocal account = customer.getAccount();
          ContactInfoLocal contactInfoLocal = account.getContactInfo();
          ContactInfo contactInfo = ce.getContactInfo();
          contactInfoLocal.setFamilyName(contactInfo.getFamilyName());
          contactInfoLocal.setGivenName(contactInfo.getGivenName());
          contactInfoLocal.setTelephone(contactInfo.getPhone());
          contactInfoLocal.setEmail(contactInfo.getEmail());
          Address address = contactInfo.getAddress();
          AddressLocal addressLocal = contactInfoLocal.getAddress();
          addressLocal.setStreetName1(address.getStreetName1());
          addressLocal.setStreetName2(address.getStreetName2());
          addressLocal.setCity(address.getCity());
          addressLocal.setZipCode(address.getZipCode());
          addressLocal.setState(address.getState());
          addressLocal.setCountry(address.getCountry());

# === SHOPPING CART ===

  - record_key: shopping-cart-req-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow customers to add items to their shopping cart by item ID.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() directly calls cart.addItem() with the item ID from CartEvent.
      This is the sole implementation of item addition and is reachable via cart.do URL mapping.
    risk_class: operational
    basis: >
      CartEJBAction handles CartEvent.ADD_ITEM action type by calling cart.addItem(ce.getItemId()).
      The ShoppingCartLocal EJB interface provides this method. URL mapping shows cart.do routes to
      CartHTMLAction which dispatches to CartEJBAction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 57
        line_end: 92
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CartEvent ce = (CartEvent)e;
              ShoppingClientFacadeLocal scf = null;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              ShoppingCartLocal cart = scf.getShoppingCart();
              switch (ce.getActionType()) {
                  case CartEvent.ADD_ITEM: {
                      cart.addItem(ce.getItemId());
                  }
                  break;
                  case CartEvent.DELETE_ITEM: {
                      cart.deleteItem(ce.getItemId());
                  }
                  break;
                  case CartEvent.UPDATE_ITEMS: {
                      Map items = ce.getItems();
                      Iterator it = null;
                      if (items != null) it = items.keySet().iterator();
                      while ((it != null) && it.hasNext()) {
                          String itemId = (String)it.next();
                          int quantity = ((Integer)items.get(itemId)).intValue();
                          cart.updateItemQuantity(itemId, quantity);
                      }
                  }
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 106
        line_end: 108
        excerpt: |
          <url-mapping url="cart.do" screen="cart.screen" >
              <web-action-class>com.sun.j2ee.blueprints.petstore.controller.web.actions.CartHTMLAction</web-action-class>
          </url-mapping>

  - record_key: shopping-cart-req-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow customers to remove items from their shopping cart by item ID.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() handles CartEvent.DELETE_ITEM action and calls cart.deleteItem().
      The method is invoked identically to addItem, indicating symmetric add/delete behavior.
    risk_class: operational
    basis: >
      CartEJBAction handles CartEvent.DELETE_ITEM case by calling cart.deleteItem(ce.getItemId()).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 73
        line_end: 76
        excerpt: |
          case CartEvent.DELETE_ITEM: {
              cart.deleteItem(ce.getItemId());
          }
          break;

  - record_key: shopping-cart-req-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow customers to update the quantity of items in their shopping cart.
      Quantities are updated per item using a map of item IDs to integer quantities.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() iterates over a map of itemId -> Integer quantity pairs from
      CartEvent.getItems() and calls cart.updateItemQuantity() for each entry. This is the
      sole implementation of quantity updates and type-safe evidence that quantities are integers.
    risk_class: operational
    basis: >
      CartEJBAction handles CartEvent.UPDATE_ITEMS by iterating through ce.getItems() map,
      extracting itemId as String and quantity as Integer, then calling
      cart.updateItemQuantity(itemId, quantity.intValue()).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 88
        excerpt: |
          case CartEvent.UPDATE_ITEMS: {
              Map items = ce.getItems();
              Iterator it = null;
              if (items != null) it = items.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String itemId = (String)it.next();
                  int quantity = ((Integer)items.get(itemId)).intValue();
                  cart.updateItemQuantity(itemId, quantity);
              }
          }

  - record_key: shopping-cart-req-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support locale-specific shopping cart behavior. The cart locale
      is synchronized with the customer's preferred language during sign-on.
    confidence: medium
    confidence_basis: >
      SignOnEJBAction directly calls cart.setLocale(locale) after retrieving the user's
      preferred locale from their profile. However, only the sign-on action sets cart locale;
      no evidence of other cart locale updates or locale-specific display logic in cart action.
    risk_class: presentational
    basis: >
      SignOnEJBAction.perform() retrieves Locale from user's profile and calls
      cart.setLocale(locale) to notify the shopping cart of the locale change.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 85
        line_end: 91
        excerpt: |
          try {
              ProfileLocal profile = scf.getCustomer().getProfile();
              Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
              machine.setAttribute(PetstoreKeys.LOCALE, locale);
              ShoppingCartLocal cart = scf.getShoppingCart();
              cart.setLocale(locale);
          }

# === ORDER PLACEMENT ===

  - record_key: order-placement-req-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL allow customers to place orders from their shopping cart only if
      the cart is not empty. Empty cart orders SHALL be rejected with ShoppingCartEmptyOrderException.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() checks if items.size() == 0 and throws ShoppingCartEmptyOrderException.
      The exception is declared in mappings.xml and handled with a specific error screen.
      Both declarative and programmatic enforcement.
    risk_class: operational
    basis: >
      OrderEJBAction.perform() retrieves items from cart via cart.getItems() and checks
      if (items.size() == 0) throw new ShoppingCartEmptyOrderException("Shopping cart is empty").
      Exception is mapped to cart_empty_order_error.screen in mappings.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          if (items.size() == 0) {
              throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>

  - record_key: order-placement-req-0002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL assign a unique order ID to each purchase order using a UniqueIdGenerator EJB.
      Order IDs are generated with a counter prefix of "1001".
    confidence: medium
    confidence_basis: >
      OrderEJBAction.perform() directly calls uidgen.getUniqueId("1001") to generate order IDs.
      The "1001" counter prefix is a literal value in the code. However, the purpose of this
      prefix is unclear (whether it's a counter type or category identifier). No other code paths
      generate order IDs, so this is the sole source.
    risk_class: operational
    basis: >
      OrderEJBAction retrieves UniqueIdGeneratorLocalHome, creates instance, and calls
      uidgen.getUniqueId("1001") to generate orderIdString.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 98
        line_end: 110
        excerpt: |
          UniqueIdGeneratorLocal uidgen = null;
          try {
              ServiceLocator sl = new ServiceLocator();
              UniqueIdGeneratorLocalHome home =
                (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
              uidgen = home.create();
          } catch (javax.ejb.CreateException cx) {
              cx.printStackTrace();
          }
          orderIdString = uidgen.getUniqueId("1001");

  - record_key: order-placement-req-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL collect shipping and billing address information from the customer.
      Order SHALL include shipTo and billTo contact information.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() retrieves billTo and shipTo from OrderEvent and sets them
      on the PurchaseOrder via setShippingInfo() and setBillingInfo(). ContactInfo objects
      carry address data as evidenced by CustomerEJBAction which manages Address fields.
    risk_class: operational
    basis: >
      OrderEJBAction extracts billTo and shipTo ContactInfo objects from OrderEvent and
      sets them on purchaseOrder via purchaseOrder.setShippingInfo(shipTo) and
      purchaseOrder.setBillingInfo(billTo).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 90
        line_end: 121
        excerpt: |
          OrderEvent oe = (OrderEvent)e;
          PurchaseOrder purchaseOrder = new PurchaseOrder();
          ContactInfo billTo = oe.getBillTo();
          ContactInfo shipTo = oe.getShipTo();
          CreditCard creditCard = oe.getCreditCard();
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
          purchaseOrder.setShippingInfo(shipTo);
          purchaseOrder.setBillingInfo(billTo);
          purchaseOrder.setCreditCard(creditCard);

# === PAYMENT PROCESSING ===

  - record_key: payment-processing-req-0001
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL store credit card information for orders including card number,
      card type, and expiry date.
    confidence: high
    confidence_basis: >
      OrderEJBAction retrieves CreditCard from OrderEvent and sets it on PurchaseOrder.
      CustomerEJBAction manages CreditCardLocal entity with setCardNumber(), setCardType(),
      and setExpiryDate() methods, indicating these are persistent fields.
    risk_class: financial
    basis: >
      OrderEJBAction extracts creditCard from OrderEvent (oe.getCreditCard()) and sets it
      on purchaseOrder via purchaseOrder.setCreditCard(creditCard).
      CustomerEJBAction shows credit card fields: cardNumber, cardType, expiryDate.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 91
        line_end: 121
        excerpt: |
          CreditCard creditCard = oe.getCreditCard();
          purchaseOrder.setCreditCard(creditCard);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 130
        line_end: 135
        excerpt: |
          CreditCard creditCard = ce.getCreditCard();
          CreditCardLocal creditCardLocal = account.getCreditCard();
          creditCardLocal.setCardNumber(creditCard.getCardNumber());
          creditCardLocal.setCardType(creditCard.getCardType());
          creditCardLocal.setExpiryDate(creditCard.getExpiryDate());

  - record_key: payment-processing-req-0002
    kind: requirement
    capability_key: payment-processing
    requirement: >
      The system SHALL calculate order total cost by summing the product of unit cost
      and quantity for each line item in the cart. Total cost is calculated as a float.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() iterates through cart items and explicitly calculates
      totalCost += (cost * item.getQuantity()). The calculation is straightforward and
      is the sole implementation of total cost computation.
    risk_class: financial
    basis: >
      OrderEJBAction iterates through items, extracts item.getUnitCost() as float, and
      accumulates totalCost += (cost * item.getQuantity()). Sets purchaseOrder.setTotalPrice(totalCost).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 133
        line_end: 146
        excerpt: |
          Iterator it = items.iterator();
          while (it.hasNext()) {
              CartItem item = (CartItem)it.next();
              float cost = new Float(item.getUnitCost()).floatValue();
              totalCost += (cost*item.getQuantity());
              purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                     item.getProductId(),
                                                     item.getItemId(),
                                                     (lineItemCount++) + "",
                                                     item.getQuantity(),
                                                     cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

# === CATALOG BROWSING ===

  - record_key: catalog-browsing-req-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL provide catalog browsing functionality via a CatalogEJB session bean.
      Catalog access is configured to use either a CatalogDAO implementation class or
      fast-lane JDBC access to read catalog data directly from the database.
    confidence: medium
    confidence_basis: >
      web.xml declares env-entry param/CatalogDAOClass and resource-ref jdbc/CatalogDB with
      comment "Allow the Fast Lane Reader Pattern to Read Catalog Data Directly via JDBC".
      However, no query logic is visible in the petstore application code itself; catalog
      access delegates to CatalogEJB in a separate component. Evidence is declarative only.
    risk_class: operational
    basis: >
      web.xml defines:
      - Resource reference jdbc/CatalogDB of type javax.sql.DataSource
      - Env-entry param/CatalogDAOClass naming the implementation class
      - Comment explaining Fast Lane Pattern for catalog data access
      ShoppingControllerEJB references ejb/Catalog for catalog lookups.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 171
        line_end: 197
        excerpt: |
          <resource-ref>
              <description>Allow the Fast Lane Reader Pattern to Read Catalog Data Directly via JDBC in the Web Tier</description>
              <res-ref-name>jdbc/CatalogDB</res-ref-name>
              <res-type>javax.sql.DataSource</res-type>
              <res-auth>Container</res-auth>
          </resource-ref>
          <env-entry>
              <env-entry-name>param/CatalogDAODatabase</env-entry-name>
              <env-entry-value>«REDACTED:secret-finding-30»</env-entry-value>
              <env-entry-type>java.lang.String</env-entry-type>
          </env-entry>
          <env-entry>
              <description>This Entry Provides the name for the CatalogDAO Implementation Class</description>
              <env-entry-name>param/CatalogDAOClass</env-entry-name>
              <env-entry-value>«REDACTED:secret-finding-31»</env-entry-value>
              <env-entry-type>java.lang.String</env-entry-type>
          </env-entry>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/ejb-jar.xml
        line_start: 87
        line_end: 93
        excerpt: |
          <ejb-local-ref>
              <ejb-ref-name>ejb/Catalog</ejb-ref-name>
              <ejb-ref-type>Session</ejb-ref-type>
              <local-home>com.sun.j2ee.blueprints.catalog.ejb.CatalogLocalHome</local-home>
              <local>com.sun.j2ee.blueprints.catalog.ejb.CatalogLocal</local>
              <ejb-link>CatalogEJB</ejb-link>
          </ejb-local-ref>

