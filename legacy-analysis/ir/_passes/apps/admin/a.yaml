  # Date Handling
  - record_key: ADM-DATE-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      Dates in admin requests SHALL be provided in mm/dd/yyyy format.
      The system SHALL convert these string dates to Date objects for processing.
    confidence: medium
    confidence_basis: >
      ApplRequestProcessor.getProperDate() converts mm/dd/yyyy format strings to Date.
      OPCAdminFacadeEJB formats dates in mm/dd/yyyy for response. However, the Date
      constructor used (deprecated constructor with year, month, day parameters) may
      indicate legacy implementation.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getProperDate() uses StringTokenizer to parse mm/dd/yyyy,
      extracting month, day, year components. OPCAdminFacadeEJB formats dates using
      deprecated Date constructor with arithmetic (year-1900, month+1).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 319
        line_end: 326
        excerpt: |
          Date getProperDate(String inpDate) {
              StringTokenizer tokens = new StringTokenizer(inpDate, "/");
              Integer month = new Integer((String)tokens.nextElement());
              Integer day = new Integer((String)tokens.nextElement());
              Integer year = new Integer((String)tokens.nextElement());
              return(new Date(year.intValue()-1900, month.intValue()-1,
                              day.intValue()));
    stack_metadata:
      framework: servlet

  # Session Management
  - record_key: ADM-SESSION-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL maintain authenticated sessions for the rich client.
      Session ID SHALL be passed from the web tier to the rich client via JNLP
      application arguments to enable client authentication without additional login.
    confidence: high
    confidence_basis: >
      AdminRequestProcessor.buildJNLP() explicitly includes req.getSession().getId()
      as an argument to the rich client application. ApplRequestProcessor validates
      session existence before processing requests from rich client.
    risk_class: operational
    basis: >
      buildJNLP() appends session ID as argument to application-desc. This allows
      the rich client to attach to the server session. ApplRequestProcessor checks
      session with getSession(false) and rejects requests with null session.
    traces:
