  # XML Protocol
  - record_key: ADM-PROTOCOL-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The rich client and web tier SHALL communicate via XML protocol. Request format
      SHALL include a Type element specifying the operation (GETORDERS, UPDATESTATUS,
      REVENUE, ORDERS). Response format SHALL include a Type element and either data
      elements or an Error element.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor explicitly parses XML requests and builds XML responses.
      Request types are checked via getValue(root.getElementsByTagName("Type")).
      Response structure is shown throughout with replyHeader containing XML envelope.
    risk_class: operational
    basis: >
      ApplRequestProcessor.processRequest() parses XML and extracts Type element,
      then dispatches to appropriate handler. Each handler builds response XML
      with Type and either Success/data or Error elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 122
        line_end: 147
        excerpt: |
          String processRequest(String xmlString) {
              try {
                  InputSource source =
                      new InputSource(new ByteArrayInputStream(xmlString.
                                                               getBytes()));
                  DocumentBuilder db =
                      DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root =
                      db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type")
                                          .item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
    stack_metadata:
      framework: servlet

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >
      The updateOrders() method accepts OrderStatus values from the client request
      and passes them to the backend without validation. The code comment at line 207
      notes that a schema conversion would be better. It is unclear whether status
      values are validated, normalized, or what the valid status values are. The
      OrderApproval and ChangedOrder objects may perform validation, but their
      implementation is not visible in this module. A human should verify the valid
      order status enumeration and any required transformations.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
    description: >
      The getChartInfo() method queries orders using findPOBetweenDates() with
      start.getTime() and end.getTime(). The exact date range semantics (inclusive,
      exclusive, boundaries) are not documented in the visible code. Additionally,
      orders returned by ProcessManager.getOrdersByStatus() are matched with
      PurchaseOrder entities, but the exact matching logic (by orderId) and possible
      data inconsistencies are not visible. A human should verify the date range
      semantics and reconciliation logic.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >
      Error handling in getOrders(), updateOrders(), and getChartInfo() methods
      catches exceptions but returns null in some cases (lines 200-201, 301-303).
      When these methods return null, the servlet does not appear to send any
      response to the client. The behavior when a query returns no results versus
      an error is not clearly differentiated. A human should verify the intended
      error response format and null handling behavior.
