records:
  # Authentication and Authorization
  - record_key: ADM-AUTH-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL require form-based authentication with username and
      password before granting access to admin operations. Only users with
      the 'administrator' role SHALL be permitted to access the /AdminRequestProcessor
      endpoint.
    confidence: high
    confidence_basis: >
      Declarative security constraints are defined in web.xml with form login
      configuration, role-based access control, and HTTP method restrictions
      (GET/POST). Both web.xml and login.jsp confirm form-based auth mechanism.
      Authentication enforced at servlet level.
    risk_class: operational
    basis: >
      web.xml lines 75-97 define security-constraint requiring administrator role
      for /AdminRequestProcessor. Form login configured with login.jsp and error.jsp.
      ApplRequestProcessor.java lines 88-99 validate session existence before processing
      requests from rich client.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
          </security-constraint>
          <login-config>
            <auth-method>FORM</auth-method>
            <form-login-config>
              <form-login-page>/login.jsp</form-login-page>
              <form-error-page>/error.jsp</form-error-page>
            </form-login-config>
          </login-config>
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 99
        excerpt: |
          HttpSession session = req.getSession(false);
          ServletOutputStream out = resp.getOutputStream();
          if(session == null) {
              out.println(replyHeader +
                          "<Error>Session Timed Out; Please exit and " +
                          "login as admin from the login page</Error>\n" +
                          "</Response>\n");
    stack_metadata:
      framework: servlet
      declarative_validator: web.xml

  - record_key: ADM-AUTH-0002
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The session timeout for admin users SHALL be 54 minutes of inactivity.
    confidence: high
    confidence_basis: >
      Declarative configuration in web.xml explicitly sets session timeout. This is
      enforced by the container.
    risk_class: operational
    basis: >
      Session timeout is declared in web.xml session-config.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      framework: servlet

  # Rich Client Deployment
  - record_key: ADM-DEPLOY-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support launching a Java Web Start (JNLP) based rich client
      application from the web interface. The rich client SHALL be the primary UI
      for admin order management operations.
    confidence: high
    confidence_basis: >
      AdminRequestProcessor.buildJNLP() method explicitly constructs JNLP file
      dynamically. Index.jsp provides button to launch this client. This is the
      documented deployment model for the admin application.
    risk_class: operational
    basis: >
      AdminRequestProcessor POST handler generates JNLP content when
      currentScreen='manageorders'. buildJNLP() method creates XML JNLP manifest
      with application descriptor referencing PetStoreAdminClient main class.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 95
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n");
              ...
              jnlp.append("<application-desc main-class=\"com.sun.j2ee.blueprints.admin.client.PetStoreAdminClient\">\n");
              jnlp.append("<argument>com.sun.j2ee.blueprints.admin.client.HttpPostPetStoreProxy</argument>\n");
              ...
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/index.jsp
        line_start: 67
        line_end: 74
        excerpt: |
          <form action="AdminRequestProcessor" method=post>
            To launch the JAVA Web Start based Rich Client click here :
            <input type="hidden" name="currentScreen" value="manageorders">
            <input type="submit" value="Launch Rich Client">
          </form>
    stack_metadata:
      framework: servlet
      jsp.page: index.jsp

  # Order Query Operations
  - record_key: ADM-ORDER-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow authenticated admin users to retrieve orders filtered
      by order status. The query request SHALL be sent as XML with a Status element.
      Response SHALL be XML containing order list with OrderId, UserId, OrderDate,
      OrderAmount, and OrderStatus fields.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.getOrders() implements this feature. XML request/response
      schema is explicit in code. Method is invoked for GETORDERS request type.
      Both the request handler and business delegate confirm this behavior.
    risk_class: operational
    basis: >
      ApplRequestProcessor processes GETORDERS XML requests and invokes
      AdminRequestBD.getOrdersByStatus(). Response is built with specific XML
      elements matching order properties retrieved from OPCAdminFacade.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 133
        line_end: 135
        excerpt: |
          if (reqType.equals("GETORDERS")) {
              return getOrders(root);
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 166
        line_end: 203
        excerpt: |
          String getOrders(Element root) {
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  NodeList nl = root.getElementsByTagName("Status");
                  String status = getValue(nl.item(0));
                  OrdersTO orders = bd.getOrdersByStatus(status);
                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  responseBuffer.append("<Type>GETORDERS</Type>\n");
                  responseBuffer.append("<Status>" + status + "</Status>\n");
                  responseBuffer.append("<TotalCount>" + orders.size() + "</TotalCount>\n" );
                  for (Iterator it = orders.iterator(); it.hasNext(); ) {
                      OrderDetails o = (OrderDetails) it.next();
                      responseBuffer.append("<Order>\n");
                      responseBuffer.append("<OrderId>" + o.getOrderId() + "</OrderId>\n");
                      responseBuffer.append("<UserId>" + o.getUserId() + "</UserId>\n");
                      responseBuffer.append("<OrderDate>" + o.getOrderDate() + "</OrderDate>\n");
                      responseBuffer.append("<OrderAmount>" + o.getOrderValue() + "</OrderAmount>\n");
                      responseBuffer.append("<OrderStatus>" + o.getOrderStatus() + "</OrderStatus>\n");
                  }
    stack_metadata:
      framework: servlet
      ejb.bean: OPCAdminFacade

