      via OPCAdminFacade EJB (remote). Order updates from the admin interface
      SHALL be sent asynchronously via AsyncSender EJB (local) to enable order
      approval workflow processing.
    confidence: high
    confidence_basis: >
      AdminRequestBD explicitly looks up and uses OPCAdminFacadeRemote EJB and
      AsyncSender EJB. These are declared as ejb-ref and ejb-local-ref in web.xml.
      The flow is explicit: updateOrders calls AsyncSender.sendAMessage().
    risk_class: operational
    basis: >
      AdminRequestBD constructor looks up OPCAdminFacade via JNDI. updateOrders()
      method looks up AsyncSender and sends OrderApproval XML. web.xml declares
      both EJB references with full paths to home and remote interfaces.
