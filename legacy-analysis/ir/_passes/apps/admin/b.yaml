  # Order Query Operations
  - record_key: ADM-ORDER-QUERY-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow authenticated admin users to retrieve orders filtered
      by order status. Query requests SHALL be submitted as XML with a Status element.
      Response SHALL be XML containing an order list with OrderId, UserId, OrderDate,
      OrderAmount, and OrderStatus fields for each order.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.getOrders() implements this feature. XML request parsing
      explicitly extracts Status element. Response construction shows each required
      field being appended to XML. Method is invoked for GETORDERS request type.
    risk_class: operational
    basis: >
      ApplRequestProcessor lines 166-203 show getOrders() processing GETORDERS requests.
      Status element extraction at line 170. Response building at lines 177-194 shows
      each field (OrderId, UserId, OrderDate, OrderAmount, OrderStatus) appended.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 133
        line_end: 135
        excerpt: |
          if (reqType.equals("GETORDERS")) {
              return getOrders(root);
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 166
        line_end: 203
        excerpt: |
          String getOrders(Element root) {
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  NodeList nl = root.getElementsByTagName("Status");
                  String status = getValue(nl.item(0));
                  OrdersTO orders = bd.getOrdersByStatus(status);
                  if (orders == null) {
                      return null;
                  }
                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  responseBuffer.append("<Type>GETORDERS</Type>\n");
                  responseBuffer.append("<Status>" + status + "</Status>\n");
                  responseBuffer.append("<TotalCount>" + orders.size() + "</TotalCount>\n" );
                  for (Iterator it = orders.iterator(); it.hasNext(); ) {
                      OrderDetails o = (OrderDetails) it.next();
                      responseBuffer.append("<Order>\n");
                      responseBuffer.append("<OrderId>" + o.getOrderId() + "</OrderId>\n");
                      responseBuffer.append("<UserId>" + o.getUserId() + "</UserId>\n");
                      responseBuffer.append("<OrderDate>" + o.getOrderDate() + "</OrderDate>\n");
                      responseBuffer.append("<OrderAmount>" + o.getOrderValue() + "</OrderAmount>\n");
                      responseBuffer.append("<OrderStatus>" + o.getOrderStatus() + "</OrderStatus>\n");
                      responseBuffer.append("</Order>\n");
                  }
                  responseBuffer.append("</Response>\n");
                  return responseBuffer.toString();
    stack_metadata:
      framework: servlet
      ejb.bean: OPCAdminFacade

