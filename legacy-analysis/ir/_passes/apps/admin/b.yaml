      parallel logic for ORDERS that aggregates quantities instead of revenue values.
    risk_class: operational
    basis: >
      ApplRequestProcessor lines 282-297 show handling of ORDERS request with
      quantity aggregation (Integer type vs Float for revenue). OPCAdminFacadeEJB
      lines 219-245 show ORDERS branch with getQuantity() accumulation logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 282
        line_end: 297
        excerpt: |
          else {
              int totalQuantity = 0;
              for (Iterator it = chartInfo.entrySet().iterator(); it.hasNext(); ) {
