  # Authentication & Authorization
  - record_key: ADM-AUTH-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL enforce form-based authentication with username and password
      for access to the AdminRequestProcessor endpoint. Only users with the
      'administrator' role SHALL be permitted to access this endpoint.
    confidence: high
    confidence_basis: >
      Security configuration is declared in web.xml with explicit form-login
      configuration, security-constraint specifying role, and both login and error
      JSP pages referenced. Multiple layers confirm this (declarative + JSP).
    risk_class: operational
    basis: >
      web.xml lines 75-97 define security-constraint requiring administrator
      role for /AdminRequestProcessor with FORM auth method. Form login config
      specifies login.jsp and error.jsp. Login form in login.jsp confirms
      j_username and j_password fields. Error page confirms failed auth flow.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
          <login-config>
            <auth-method>FORM</auth-method>
            <form-login-config>
              <form-login-page>/login.jsp</form-login-page>
              <form-error-page>/error.jsp</form-error-page>
