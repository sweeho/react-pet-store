  # XML Protocol and Request/Response
  - record_key: ADM-PROTOCOL-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      Rich client and web tier SHALL communicate via XML protocol over HTTP.
      Request XML SHALL include a Type element specifying the operation.
      Supported request types are: GETORDERS, UPDATESTATUS, REVENUE, ORDERS.
      Response XML SHALL include a Type element and either success data or
      an Error element.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.processRequest() explicitly parses incoming XML string,
      extracts Type element, and dispatches to operation-specific handlers. Each
      handler builds XML response. Multiple request types are explicitly checked.
    risk_class: operational
    basis: >
      ApplRequestProcessor lines 122-147 show XML parsing and Type element extraction
      with explicit if-else chain checking for GETORDERS, UPDATESTATUS, REVENUE,
      ORDERS. Response construction shows replyHeader prepended to all responses.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 122
        line_end: 147
        excerpt: |
          String processRequest(String xmlString) {
              try {
                  InputSource source =
                      new InputSource(new ByteArrayInputStream(xmlString.getBytes()));
                  DocumentBuilder db =
                      DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root = db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type").item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
                  }
                  else {
                      return replyHeader + "<Error>Unable to process request : " +
                          "Unknown request type - " + reqType + "</Error>\n</Response>\n";
                  }
    stack_metadata:
      framework: servlet

