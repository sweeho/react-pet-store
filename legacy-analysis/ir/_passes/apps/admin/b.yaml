  # Date Handling
  - record_key: ADM-DATE-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      Admin report dates SHALL be provided by clients in mm/dd/yyyy format (string).
      The system SHALL parse these strings and convert them to Date objects for
      backend processing. OrderDate values in responses SHALL be formatted as
      mm/dd/yyyy strings.
