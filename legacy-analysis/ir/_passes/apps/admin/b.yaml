  # Rich Client Deployment
  - record_key: ADM-DEPLOY-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support launching a Java Web Start (JNLP) based rich client
      application from the web interface. The AdminRequestProcessor servlet SHALL
      generate JNLP manifest files dynamically when the currentScreen parameter
      equals 'manageorders'.
    confidence: high
    confidence_basis: >
      AdminRequestProcessor.doPost() explicitly checks for currentScreen parameter
      and calls buildJNLP() to generate JNLP content. Index.jsp provides user
      interface to trigger this flow. Content type is set to application/x-java-jnlp-file.
    risk_class: operational
    basis: >
      AdminRequestProcessor lines 102-119 show doPost handler checking curScreen
      parameter and conditionally generating JNLP. Index.jsp lines 67-74 show
      form submission to AdminRequestProcessor with currentScreen='manageorders'.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 102
        line_end: 119
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
          throws IOException, ServletException {
              String curScreen = req.getParameter("currentScreen");
              if (curScreen == null) {
                  return;
              }
              curScreen = curScreen.trim();
              if(curScreen.equals("logout")) {
                  getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
              }
              if(curScreen.equals("manageorders")) {
                  resp.setContentType("application/x-java-jnlp-file");
                  ServletOutputStream out = resp.getOutputStream();
                  out.println(buildJNLP(req));
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/index.jsp
        line_start: 67
        line_end: 74
        excerpt: |
          <form action="AdminRequestProcessor" method=post>
          <p>
          <p>
          <p>
           To launch the JAVA Web Start based Rich Client click here :
          <input type="hidden" name="currentScreen" value="manageorders">
          <input type="submit" value="Launch Rich Client">
          </form>
    stack_metadata:
      framework: servlet
      jsp.page: index.jsp

