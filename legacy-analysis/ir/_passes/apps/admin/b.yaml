  # Order Status Updates
  - record_key: ADM-ORDER-UPDATE-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow authenticated admin users to update order statuses.
      Update requests SHALL be submitted as XML containing Order elements, each
      with OrderId and OrderStatus child elements. The system SHALL send updated
      orders asynchronously to the AsyncSender EJB for processing.
    confidence: medium
    confidence_basis: >
      ApplRequestProcessor.updateOrders() processes UPDATESTATUS requests and builds
      ChangedOrder objects from XML. AdminRequestBD.updateOrders() sends OrderApproval
      via AsyncSender. However, no validation of status values is visible in the servlet;
      possible validation occurs in OrderApproval or downstream.
    risk_class: financial
    basis: >
      ApplRequestProcessor lines 205-237 show updateOrders() extracting OrderId and
      OrderStatus from XML Order elements and creating ChangedOrder objects. Code comment
      at line 207 indicates schema mapping assumption. AdminRequestBD lines 115-130 show
      updateOrders() looking up AsyncSender and sending OrderApproval XML.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {
              // a better solution would be using a style sheet to convert from
              // one schema to the other
              OrderApproval oa = new OrderApproval();
              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);
                  // Assumes values of OrderStatus are the same for both schemas
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                      + "<Status>SUCCESS</Status>\n"
                      + "</Response>\n";
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
              try {
                  AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                      ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
                  AsyncSender sender= home.create();
                  sender.sendAMessage(oa.toXML());
    stack_metadata:
      framework: servlet
      jms.queue: AsyncSender
      ejb.bean: AsyncSender

  # Analytics - Revenue Reporting
  - record_key: ADM-ANALYTICS-REV-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support revenue reporting for a specified date range.
      Admin users may optionally filter by product category. When no category
      filter is provided, revenue SHALL be aggregated by CategoryId. When a
      category filter is provided, revenue SHALL be aggregated by ItemId within
      that category. Response SHALL include aggregated revenue amounts and a
      TotalSales sum.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.getChartInfo() processes REVENUE request type and calls
      OPCAdminFacadeEJB.getChartInfo(). OPCAdminFacadeEJB implements conditional
      aggregation logic based on category parameter. Both revenue calculation and
      aggregation are shown explicitly in code.
    risk_class: operational
    basis: >
      ApplRequestProcessor lines 239-305 show getChartInfo() handling REVENUE requests
      with date range and category parameters. OPCAdminFacadeEJB lines 169-256 show
      conditional aggregation: if(categ == null) groups by CategoryId, else groups
      by ItemId within filtered category. Revenue values are accumulated in HashMap.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 239
        line_end: 279
        excerpt: |
          String getChartInfo(Element root, String request) {
              try {
                  Map chartInfo = null;
                  String category = null;
                  String start = getValue(root.getElementsByTagName("Start").item(0));
                  String end = getValue(root.getElementsByTagName("End").item(0));
                  AdminRequestBD bd = new AdminRequestBD();
                  category = getValue(root.getElementsByTagName("ReqCategory").item(0));
                  chartInfo = bd.getChartInfo(request, getProperDate(start), getProperDate(end), category);
                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  String xmlElement = (category == null) ? "Category" : "Item";
                  responseBuffer.append("<Type>" + request + "</Type>\n");
                  responseBuffer.append("<Start>" + start + "</Start>\n");
                  responseBuffer.append("<End>" + end + "</End>\n");
                  if (request.equals("REVENUE")) {
                      float totalAmount = 0f;
                      for (Iterator it = chartInfo.entrySet().iterator(); it.hasNext(); ) {
                          Map.Entry e = (Map.Entry) it.next();
                          float amount = ((Float) e.getValue()).floatValue();
                          totalAmount += amount;
                          responseBuffer.append("<" + xmlElement + " name=\"" + e.getKey() + "\">");
                          responseBuffer.append(amount);
                          responseBuffer.append("</" + xmlElement + ">\n");
                      }
                      responseBuffer.append("<TotalSales>");
                      responseBuffer.append(totalAmount);
                      responseBuffer.append("</TotalSales>\n");
    stack_metadata:
      framework: servlet
      ejb.bean: OPCAdminFacade
      db.object: PurchaseOrder, LineItem

  - record_key: ADM-ANALYTICS-REV-0002
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      Revenue per line item SHALL be calculated as: quantity * unit price.
      Individual line item revenue amounts SHALL be accumulated into the
      aggregated chart result by summing values for matching category/item keys.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB shows explicit multiplication of quantity and unit price.
      Accumulation logic using containsKey() check and put() confirms summation.
    risk_class: financial
    basis: >
      OPCAdminFacadeEJB lines 193-218 show revenue calculation in REVENUE request
      branch: multiplication of loc.getQuantity() * loc.getUnitPrice(). Accumulation
      at lines 197-200 and 210-212 shows adding to existing value or creating new entry.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 193
        line_end: 218
        excerpt: |
          if(request.equals("REVENUE")) {
              if(categ == null) {
                  id = loc.getCategoryId();
                  if(chartDetails.containsKey(id)) {
                      tmpValue = (Float) chartDetails.get(id);
                      chartDetails.put(id,
                           new Float(tmpValue.floatValue() +
                           (loc.getQuantity()*loc.getUnitPrice())));
                  } else {
                      chartDetails.put(id, new Float((loc.getQuantity()*
                                              loc.getUnitPrice())));
                  }
              } else {
                  if(loc.getCategoryId().equals(categ)) {
                      id = loc.getItemId();
                      if(chartDetails.containsKey(id)) {
                          tmpValue = (Float) chartDetails.get(id);
                          chartDetails.put(id,
                            new Float(tmpValue.floatValue() +
                            (loc.getQuantity()*loc.getUnitPrice())));
    stack_metadata:
      ejb.bean: OPCAdminFacade

  # Analytics - Order Volume Reporting
  - record_key: ADM-ANALYTICS-VOL-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support order volume reporting (quantity aggregation) for a
      specified date range. Admin users may optionally filter by product category.
      When no category filter is provided, quantities SHALL be aggregated by CategoryId.
      When a category filter is provided, quantities SHALL be aggregated by ItemId
